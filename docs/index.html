  for(const d of sortedDates()){
    if(d >= beforeDate) continue;
    const e = (state.sessions[d].entries||[]).find(x=>x.ex===exId && x.sets.length);
    if(e) return {date:d, sets:e.sets};
  }
  return null;
}
function bestSet(sets, kind){
  if(!sets.length) return null;
  if(kind==="w") return sets.slice().sort((a,b)=> (b.w*b.r)-(a.w*a.r))[0];
  return sets.slice().sort((a,b)=> b.r-a.r)[0];
}
function setText(st, kind){
  if(kind==="w") return st.w+" kg × "+st.r;
  if(kind==="t") return st.r+" 秒";
  return st.r+" 回";
}

function muscleLoad(days){
  const out = {}; Object.keys(MUSCLES).forEach(k=>out[k]=0);
  for(const d of sortedDates()){
    if(daysAgo(d) >= days) continue;
    for(const e of (state.sessions[d].entries||[])){
      const ex = EXMAP[e.ex]; if(!ex) continue;
      const n = e.sets.length;
      ex.p.forEach(m=> out[m] = (out[m]||0) + n);
      (ex.s||[]).forEach(m=> out[m] = (out[m]||0) + n*0.5);

const PREF_DEFAULT = { sound:true, sure:false, vib:false, notify:false, wake:true };
let CAP = { sound:null, vib:null, notif:null, wake:null };

/* ---- 音 ----
   休憩終わりの合図は「記録」を押した瞬間（＝指で触れている間）に予約しておく。
   スマホは、指で触れていないときに新しく鳴らそうとしても音を出させてくれないことがあるため。
   既定（sure=オフ）: Web Audio。ほかのアプリの音楽と混ざる。iPhoneはマナーモード中だと鳴らない。
   sure=オン: 休憩の長さの無音＋合図の音声を <audio> で流す。マナーモード中・画面ロック中も鳴るが、
             休憩中はほかのアプリの音楽が止まる。 */
const CHIME = [[0,784],[0.22,784],[0.44,1046]];
let AC = null, chimeNodes = [], chimeAt = null;
function unlockAudio(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C){ CAP.sound = false; return null; }
    if(!AC) AC = new C();
    if(AC.state !== "running") AC.resume();          /* suspended / interrupted（iPhoneで電話などに止められた） */
    CAP.sound = true;
    return AC;
  }catch(e){ CAP.sound = false; return null; }
}
/* どこかに触れたら、止められていた音声を使える状態に戻す */
["pointerdown","touchend","keydown"].forEach(t=>document.addEventListener(t, ()=>{
  if(AC && AC.state !== "running") unlockAudio();
}, {capture:true, passive:true}));

function cancelChime(){
  chimeNodes.forEach(o=>{ try{ o.onended = null; o.stop(0); }catch(e){} try{ o.disconnect(); }catch(e){} });
  chimeNodes = []; chimeAt = null;
}
/* delay 秒後に合図を鳴らす（0なら今すぐ） */
function scheduleChime(delay){
  cancelChime();
  if(!PREF.get("sound", true)) return;
  const ac = unlockAudio(); if(!ac) return;
  try{
    const base = ac.currentTime + Math.max(0, delay);
    CHIME.forEach(([t,f])=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      const s0 = base + t;
      g.gain.setValueAtTime(0.0001, s0);
      g.gain.exponentialRampToValueAtTime(0.3, s0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s0 + 0.2);
      o.connect(g); g.connect(ac.destination);
      o.start(s0); o.stop(s0 + 0.22);
      chimeNodes.push(o);
    });
    chimeAt = base;
  }catch(e){ CAP.sound = false; }
}

/* 確実に鳴らす方式: 無音 delay 秒 → 合図 の WAV を作る（8kHz・16bit・モノラル。外部ファイルなし） */
function chimeWav(delay){
  const rate = 8000, pre = Math.round(Math.max(0, delay) * rate), n = pre + Math.round(0.9 * rate);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  CHIME.forEach(([t,f])=>{
    const s0 = pre + Math.round(t * rate), len = Math.round(0.2 * rate);
    for(let i = 0; i < len && s0 + i < n; i++){
      const env = Math.min(1, i / (0.02 * rate)) * Math.exp(-i / (0.07 * rate));
      v.setInt16(44 + (s0 + i) * 2, Math.round(12000 * env * Math.sin(2 * Math.PI * f * i / rate)), true);
    }
  });
  return new Blob([buf], {type:"audio/wav"});
}
let restAudio = null, restAudioUrl = null;
function stopRestAudio(){
  if(restAudio){ try{ restAudio.pause(); }catch(e){} restAudio = null; }
  if(restAudioUrl){ try{ URL.revokeObjectURL(restAudioUrl); }catch(e){} restAudioUrl = null; }
}
function playRestAudio(delay){
  stopRestAudio();
  if(!PREF.get("sound", true)) return true;
  try{
    restAudioUrl = URL.createObjectURL(chimeWav(delay));
    const a = new Audio(restAudioUrl);
    restAudio = a;
    const p = a.play();
    /* 再生を断られたら Web Audio で鳴らす */
    if(p && p.catch) p.catch(()=>{ if(restAudio === a){ stopRestAudio(); scheduleChime(Math.max(0, (restEnd - Date.now()) / 1000)); } });
    return true;
  }catch(e){ stopRestAudio(); return false; }
}
/* 休憩の残りに合わせて合図を予約し直す（記録・+30秒のタップの中で呼ぶ） */
function armChime(){
  const delay = Math.max(0, (restEnd - Date.now()) / 1000);
  if(PREF.get("sure", false)){ cancelChime(); if(!playRestAudio(delay)) scheduleChime(delay); }
  else { stopRestAudio(); scheduleChime(delay); }
}
/* 休憩が終わった時点で、予約した合図が遅れていたら（途中で音声が止められていたら）今鳴らす */
function ensureChimeNow(){
  if(!PREF.get("sound", true)) return;
  if(restAudio){
    const at = restAudio.duration ? Math.max(0, restAudio.duration - 0.9) : 0;
    if(restAudio.paused || restAudio.currentTime < at - 0.5){
      try{ restAudio.currentTime = at; const p = restAudio.play(); if(p && p.catch) p.catch(()=>scheduleChime(0)); }
      catch(e){ scheduleChime(0); }
    }
    return;
  }
  if(!AC || AC.state !== "running" || chimeAt === null || AC.currentTime < chimeAt - 0.5) scheduleChime(0);
}
/* 設定画面の「鳴らしてみる」 */
function testChime(){
  if(PREF.get("sure", false)){ cancelChime(); if(!playRestAudio(0)) scheduleChime(0); }
  else scheduleChime(0);
}

function buzz(){
  if(!PREF.get("vib", false)) return;
  try{ if(navigator.vibrate){ navigator.vibrate([220,90,220,90,320]); CAP.vib = true; } else CAP.vib = false; }
  catch(e){ CAP.vib = false; }
}
/* ---- 端末通知 ---- */
function notifySupported(){ return typeof Notification !== "undefined"; }
function notify(title, body){
  if(!PREF.get("notify", false) || !notifySupported() || Notification.permission !== "granted") return;
  const opts = {body, tag:"trainlog-rest", renotify:true};
  const direct = ()=>{ try{ new Notification(title, opts); CAP.notif = true; }catch(e){ CAP.notif = false; } };
  /* ホーム画面に追加したアプリ（Android など）は new Notification が使えないので、Service Worker 経由で出す */
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration()
        .then(reg=>{ if(reg && reg.showNotification) return reg.showNotification(title, opts).then(()=>{ CAP.notif = true; }); direct(); })
        .catch(direct);
      return;
    }
  }catch(e){}
  direct();
}
async function askNotify(){
  if(!notifySupported()){ CAP.notif = false; setStatus("この画面では端末通知が使えません。音と振動で知らせます"); render(); return; }
  try{
    const r = await Notification.requestPermission();
    const ok = (r === "granted");
    PREF.set("notify", ok); CAP.notif = ok;
    setStatus(ok ? "" : "通知が許可されませんでした。音と振動で知らせます");
  }catch(e){ CAP.notif = false; PREF.set("notify", false); setStatus("この画面では端末通知が使えません。音と振動で知らせます"); }
  render();
}
/* ---- 画面を消さない ---- */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); CAP.wake = true; }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ CAP.wake = false; wakeLock = null; }
}

  if(document.visibilityState !== "visible" || !restIv) return;

/* ============================================================
   休憩タイマー
   残り秒数を1秒ずつ減らすのではなく「終わる時刻」を持つ。
   画面が消えたりアプリを切り替えたりしてタイマーが止められても、戻った時点で正しい残りになる。
   ============================================================ */
let restEnd = 0, restIv = null, restLabel = "";
function restLeftSec(){ return Math.max(0, Math.ceil((restEnd - Date.now()) / 1000)); }
function startRest(sec, label){
  restEnd = Date.now() + sec * 1000;
  restLabel = label || "";
  document.getElementById("timer").classList.add("on");
  document.getElementById("timerLb").textContent = restLabel;
  armChime();
  drawRest();
  clearInterval(restIv);
  if(PREF.get("wake", true)) keepAwake(true);
  restIv = setInterval(tickRest, 250);
}
function tickRest(){
  if(!restIv) return;
  if(restLeftSec() > 0){ drawRest(); return; }
  clearInterval(restIv); restIv = null;
  document.getElementById("timerT").textContent = "0:00";
  ensureChimeNow(); buzz();
  notify("次のセットの時間です", restLabel || "休憩おわり");
  const mine = restEnd;
  setTimeout(()=>{ if(restEnd === mine && !restIv) stopRest(); }, 4000);
}
function drawRest(){
  const left = restLeftSec(), m = Math.floor(left / 60), s = left % 60;
  document.getElementById("timerT").textContent = m + ":" + String(s).padStart(2, "0");
}
function stopRest(){
  clearInterval(restIv); restIv = null;
  cancelChime(); stopRestAudio();
  document.getElementById("timer").classList.remove("on");
  keepAwake(false);
}

  calf: "段差のふちにつま先を乗せる。下も上も可動域いっぱいまで使う。",
  farmer: "肩は下げて後ろに引いたまま。すくんで前に丸まり、肩幅が狭くなってきたらそこが限界。",
};

let FIG = null, animRAF = null, playingId = null, playSlot = null, playBtn = null;
const figAz = {};                 /* 種目ごとの視点。指で左右にドラッグすると回る */
const figShots = {};              /* 静止画のキャッシュ */

function figDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t) return t === "dark";
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function figInit(){
  if(FIG !== null) return FIG;
  try{
    if(typeof THREE === "undefined" || typeof MOTION === "undefined" || typeof FIGURE3D === "undefined") return (FIG = false);
    const c = document.createElement("canvas");
    c.className = "figcanvas";
    const f = FIGURE3D.create(THREE, c, {theme: figDark() ? "dark" : "light", dpr: window.devicePixelRatio || 1});
    f.setSize(480, 560);
    f.canvas = c;
    bindFigDrag(c);
    FIG = f;
  }catch(e){ FIG = false; }
  return FIG;
}
function bindFigDrag(c){
  let down = false, x0 = 0, a0 = 0;
  const start = (e)=>{ if(!playingId) return; down = true; x0 = e.clientX; a0 = figAz[playingId] || 0;
    try{ c.setPointerCapture(e.pointerId); }catch(err){} };
  const move = (e)=>{ if(!down || !playingId) return; figAz[playingId] = a0 + (e.clientX - x0) * 0.5; };
  const end = ()=>{ down = false; };
  c.addEventListener("pointerdown", start);
  c.addEventListener("pointermove", move);
  c.addEventListener("pointerup", end);
  c.addEventListener("pointercancel", end);
}
function motionOf(id){
  if(typeof MOTION === "undefined") return null;
  return MOTION.motions[id] || MOTION.motions[baseOf(id)] || null;
}
function figView(m, id){
  const v = Object.assign({}, m.view || {});
  v.az = (v.az === undefined ? 40 : v.az) + (figAz[id] || 0);
  return v;
}
function stillTime(m){
  if(m.still !== undefined) return m.still;
  const T = MOTION.cycleTime(m);
  const ps = m.phases || [];
  /* 「よくある崩れ」の場面は静止画に使わない */
  if(ps.some(p => p.wrong)){
    for(let i = 0; i < ps.length; i++){
      if(!ps[i].wrong){
        const end = (i + 1 < ps.length) ? ps[i+1].t : T;
        return (ps[i].t + end) / 2;
      }
    }
  }
  return T * 0.35;
}
function figSize(f, m){
  let w = 480, h = 560;
  try{
    const r = f.frameShape ? f.frameShape(m).ratio : 1;
    if(r > 1.15){ h = Math.round(Math.max(300, 560 / Math.min(2.0, r / 0.85))); w = 560; }
  }catch(e){}
  f.setSize(w, h);
}
function figShot(id){
  const f = figInit(), m = motionOf(id);
  if(!f || !m) return "";
  figSize(f, m);
  const key = id + "|" + (figDark() ? "d" : "l") + "|" + Math.round(figAz[id] || 0);
  if(figShots[key]) return figShots[key];
  try{
    f.render(m, stillTime(m), figView(m, id));
    const keys = Object.keys(figShots);
    if(keys.length > 10) delete figShots[keys[0]];     /* 画像を抱え込みすぎない */
    return (figShots[key] = f.canvas.toDataURL("image/png"));
  }catch(e){ return ""; }
}
function phaseLabel(m, t){
  let lb = "";
  (m.phases || []).forEach(p => { if(t >= p.t) lb = p.label; });
  return lb;
}
function diaHTML(id, compact){
  const m = motionOf(id);
  const hold = ((PHYS[id] || PHYS[baseOf(id)] || {}).hold) || "";
  const note = DIANOTE[id] || DIANOTE[baseOf(id)] || "";
  const tail = (hold ? `<p class="diahold"><b>接地</b>　${hold}</p>` : "")
             + (compact || !note ? "" : `<p class="dianote">${note}</p>`);
  if(!m) return `<div class="dia">${tail}</div>`;
  const shot = figShot(id);
  return `<div class="dia" data-dia="${id}">
    <div class="figslot">
      ${shot ? `<img class="figstill" src="${shot}" alt="${itemNameOf(id)}の姿勢">`
             : `<p class="diahint">この端末では動きの図を表示できません</p>`}
      <div class="figphase"></div>
      <div class="figbar"><span></span></div>
    </div>
    ${shot ? `<div class="rowbtns"><button data-act="play" data-ex="${id}">動きを再生</button></div>` : ""}
    ${tail}
  </div>`;
}
function itemNameOf(id){ return EXMAP[id] ? EXMAP[id].name : ""; }
function stopAnim(){
  if(animRAF) cancelAnimationFrame(animRAF);
  animRAF = null;
  if(playSlot){
    if(FIG && FIG.canvas && FIG.canvas.parentNode === playSlot) playSlot.removeChild(FIG.canvas);
    const img = playSlot.querySelector(".figstill");
    if(img) img.style.display = "";
    const ph = playSlot.querySelector(".figphase");
    if(ph) ph.textContent = "";
    const bb = playSlot.querySelector(".figbar");
    if(bb){ bb.style.display = "none"; bb.firstChild.style.width = "0%"; }
  }
  if(playBtn) playBtn.textContent = "動きを再生";
  playSlot = null; playBtn = null; playingId = null;
}
function togglePlay(id){
  const wrap = document.querySelector('[data-dia="' + id + '"]');
  const f = figInit(), m = motionOf(id);
  if(!wrap || !f || !m) return;
  if(playingId === id){ stopAnim(); return; }
  stopAnim();
  figSize(f, m);
  const slot = wrap.querySelector(".figslot");
  const img = slot.querySelector(".figstill");
  if(img) img.style.display = "none";
  slot.insertBefore(f.canvas, slot.firstChild);
  playSlot = slot;
  playBtn = wrap.querySelector('[data-act="play"]');
  if(playBtn) playBtn.textContent = "停止";
  playingId = id;
  const phase = slot.querySelector(".figphase");
  const bar = slot.querySelector(".figbar span");
  if(bar) bar.parentNode.style.display = "block";
  const T = MOTION.cycleTime(m);
  const t0 = performance.now();
  let last = 0;
  const tick = (now)=>{
    animRAF = requestAnimationFrame(tick);
    if(now - last < 33) return;
    last = now;
    const t = ((now - t0) / 1000) % T;
    f.render(m, t, figView(m, id));
    if(phase) phase.textContent = phaseLabel(m, t);
    if(bar) bar.style.width = (t / T * 100).toFixed(1) + "%";
  };
  animRAF = requestAnimationFrame(tick);
}
function figThemeChanged(){
  Object.keys(figShots).forEach(k => delete figShots[k]);
  if(FIG) FIG.setTheme(figDark() ? "dark" : "light");
}

function render(){
  stopAnim();

/* ---------- 今日 ---------- */
const REST = {split:120, goblet:120, rdl:120, rdl1:120, hipthrust:105, row:105, ohp:105, pushup:105, floorpress:105};
function restFor(item){
  const ex = EXMAP[item.ex];
  if(ex.kind === "t") return 60;
  return REST[item.ex] || 90;
}
function routineToday(){
  const s = session(TODAY);
  if(s.routine && RMAP[s.routine]) return s.routine;
  for(const d of sortedDates()){
    if(d >= TODAY) continue;
    const sd = state.sessions[d];
    if(sd && sd.routine && (sd.entries||[]).some(e=>e.sets.length)){
      const i = RORDER.indexOf(sd.routine);
      if(i >= 0) return RORDER[(i+1) % RORDER.length];
    }
  }
  return "A";
}

/* ---- 今日のメニューを決める ----
   土台は内部のローテーション（画面には出さない）。その上で
   1. 同じ動きの種目（例: ゴブレットスクワットとブルガリアンスクワット）は1日に1つだけ。しばらくやっていないほうを残す
   2. 空いた枠は別の動きで埋める。条件は
      ・その動きを前にやってから間隔が空いている（体幹は1日、それ以外は2日）
      ・主に使う部位を、昨日しっかり使っていない
      ・次の回のメニューで主に使う部位と重ならない（次の回の回復を邪魔しない）
      ・今日その部位のセット数が多くなりすぎない
      ・ダンベルが要る種目なら、持っているダンベルで作れる
   記録を始めた日は、そのときのメニューを保存して、その日のうちは変えない。 */
const PATTERN = {
  goblet:"squat", split:"squat", rdl:"hinge", rdl1:"hinge", hipthrust:"bridge", calf:"calf",
  pushup:"hpush", floorpress:"hpush", ohp:"vpush", lateral:"raise", row:"pull", farmer:"carry",
  curl:"curl", triext:"ext", plank:"abs", deadbug:"abs", crunch:"abs", sideplank:"side"
};
const PATTERN_GAP = {abs:1, side:1};
/* 昨日この有効セット数以上使った部位は、今日は主役にしない。体幹・ふくらはぎ・前腕は回復が早い */
const RECOVER_SETS = {abs:10, obliques:10, calves:6, forearms:6};
function patternOf(id){ return PATTERN[id] || PATTERN[baseOf(id)] || id; }
function recoverLimit(m){ return RECOVER_SETS[m] || 3; }
function daysSinceEx(id){ const l = lastPerformance(id, TODAY); return l ? daysAgo(l.date) : 9999; }
/* 前回トレーニングした日（今日より前で1セットでも記録がある日）に手を付けた種目。
   規定セットをやりきっていなくても、手を付けたものは次のトレーニング日には出さない */
function lastDayTouched(){
  for(const d of sortedDates()){
    if(d >= TODAY) continue;
    const ex = (state.sessions[d].entries||[]).filter(e=>e.sets.length).map(e=>e.ex);
    if(ex.length) return new Set(ex);
  }
  return new Set();
}
function daysSincePattern(pat){
  for(const d of sortedDates()){
    if(d >= TODAY) continue;
    if((state.sessions[d].entries||[]).some(e=>e.sets.length && patternOf(e.ex) === pat)) return daysAgo(d);
  }
  return 9999;
}
/* 昨日しっかり使った主働筋（なければ null） */
function tiredMuscle(exId){
  const ex = EXMAP[exId];
  return ex.p.find(m => muscleLoadBetween(m, 1, 1) >= recoverLimit(m)) || null;
}
/* その日にやった組み方（片脚版などのラベル）。保存したメニュー、なければ当時のローテーションから読む */
function variantUsed(date, exId){
  const s = state.sessions[date];
  const src = (s.plan && s.plan.length) ? s.plan : (s.routine && RMAP[s.routine] ? RMAP[s.routine].items : []);
  const it = src.find(x=>x.ex===exId);
  return it ? (it.label || "") : "";
}
function lastVariant(exId){
  const l = lastPerformance(exId, TODAY);
  return l ? variantUsed(l.date, exId) : null;
}
/* 全ローテーションに出てくる種目の組み方（同じ種目でも片脚版などは別の行） */
function catalog(){
  const out = [];
  ROUTINES.forEach(r => r.items.forEach(it => {
    if(!out.some(x => x.ex === it.ex && (x.label||"") === (it.label||""))) out.push(it);
  }));
  return out;
}
function catalogItem(exId){
  const c = catalog().find(x => x.ex === exId), ex = EXMAP[exId];
  return c ? Object.assign({}, c) : {ex:exId, sets:ex.sets || 3, r:ex.r};
}
let planMemo = null;                       /* 描画1回のあいだだけ使い回す */
function buildPlan(){
  if(planMemo) return planMemo;
  const rid = routineToday();
  const slots = RMAP[rid].items.map(x => Object.assign({}, x));
  /* 1. 同じ動きは1つだけ */
  const firstAt = {};
  slots.forEach((it, i)=>{
    const pat = patternOf(it.ex);
    if(firstAt[pat] === undefined){ firstAt[pat] = i; return; }
    const k = firstAt[pat];
    if(daysSinceEx(it.ex) > daysSinceEx(slots[k].ex)) slots[k] = it;
    slots[i] = null;
  });
  /* 1b. 前回手を付けた種目は出さない。同じ動きの別の種目に替えられればそれに（間隔が空いている場合だけ）、
         替えられなければ枠を空けて、下で別の動きで埋める */
  const touched = lastDayTouched();
  slots.forEach((it, i)=>{
    if(!it || !touched.has(it.ex)) return;
    const pat = patternOf(it.ex);
    const alt = daysSincePattern(pat) >= (PATTERN_GAP[pat] || 2)
      ? catalog().filter(c => patternOf(c.ex) === pat && !touched.has(c.ex) && (EXMAP[c.ex].kind !== "w" || gearOptions(c.ex).length))
                 .sort((a, b) => daysSinceEx(b.ex) - daysSinceEx(a.ex))[0]
      : null;
    slots[i] = alt ? Object.assign({}, alt) : null;
  });
  /* 2. 空いた枠を別の動きで埋める */
  const load = {};
  const addLoad = it => {
    const ex = EXMAP[it.ex], n = it.sets || 3;
    ex.p.forEach(m => load[m] = (load[m]||0) + n);
    (ex.s||[]).forEach(m => load[m] = (load[m]||0) + n * 0.5);
  };
  slots.forEach(it => { if(it) addLoad(it); });
  const next = RMAP[RORDER[(RORDER.indexOf(rid) + 1) % RORDER.length]];
  const nextMuscles = new Set();
  next.items.forEach(it => EXMAP[it.ex].p.forEach(m => { if(m !== "abs" && m !== "obliques") nextMuscles.add(m); }));
  slots.forEach((it, i)=>{
    if(it) return;
    const used = new Set(slots.filter(Boolean).map(x => patternOf(x.ex)));
    const cands = catalog().filter(c=>{
      const ex = EXMAP[c.ex], pat = patternOf(c.ex), n = c.sets || 3;
      if(used.has(pat)) return false;
      if(touched.has(c.ex)) return false;                                         /* 前回手を付けた */
      if(daysSincePattern(pat) < (PATTERN_GAP[pat] || 2)) return false;
      if(tiredMuscle(c.ex)) return false;
      if(ex.p.some(m => nextMuscles.has(m))) return false;
      if(ex.p.some(m => (load[m]||0) + n > 6)) return false;
      if(ex.kind === "w" && !gearOptions(c.ex).length) return false;
      return true;
    });
    if(!cands.length) return;
    /* 久しぶりの動き → 前回と違う組み方 → 久しぶりの種目 の順に優先 */
    const score = c => [daysSincePattern(patternOf(c.ex)), (c.label||"") !== lastVariant(c.ex) ? 1 : 0, daysSinceEx(c.ex)];
    cands.sort((a, b)=>{
      const sa = score(a), sb = score(b);
      for(let k = 0; k < sa.length; k++){ if(sa[k] !== sb[k]) return sb[k] - sa[k]; }
      return 0;
    });
    slots[i] = Object.assign({}, cands[0]);
    addLoad(slots[i]);
  });
  planMemo = slots.filter(Boolean);
  return planMemo;
}
function todayItems(){
  const s = session(TODAY);
  const items = (s.plan && s.plan.length ? s.plan : buildPlan()).map(x=>Object.assign({}, x));
  (s.entries||[]).forEach(e=>{
    if(!items.some(i=>i.ex===e.ex) && EXMAP[e.ex]){
      const ex = EXMAP[e.ex];
      items.push({ex:e.ex, sets:ex.sets||3, r:ex.r, extra:true});
    }
  });
  return items;
}
function itemOf(id){ return todayItems().find(i=>i.ex===id) || {ex:id, sets:3, r:EXMAP[id]?EXMAP[id].r:10}; }
/* 記録を始めた時点のメニューを、その日の分として保存する */
function fixPlan(s){
  if(s.plan && s.plan.length) return;
  if(!s.routine) s.routine = routineToday();
  s.plan = buildPlan().map(x => Object.assign({}, x));
  s.planAt = Date.now();
}
function isDoneToday(id){
  const it = todayItems().find(i=>i.ex===id);
  const e = entryFor(TODAY, id, false);
  return !!(it && e && e.sets.length >= (it.sets || 3));
}

/* ---- きつさに応じて次のセットの回数を決める ---- */
function clampR(kind, r){
  r = Math.round(r);
  return kind==="t" ? Math.max(10, Math.min(180, r)) : Math.max(4, Math.min(40, r));
}
function adjust(kind, r, rpe){
  const st = kind==="t" ? 5 : 2;
  if(!rpe) return {r:clampR(kind,r), why:""};
  if(rpe <= 5) return {r:clampR(kind, r + st*2), why:"かなり余裕があったので増やしました"};
  if(rpe <= 6) return {r:clampR(kind, r + st), why:"まだ余力があるので少し増やしました"};
  if(rpe <= 9) return {r:clampR(kind, r), why:"狙いの範囲です。同じ数字で"};
  return {r:clampR(kind, r - st), why:"限界まで行ったので少し減らしました"};
}
/* 次のセットの提案。重さは持っているダンベルで作れる使い方の中からだけ選ぶ */
function suggestNext(item, e, last){
  const id = item.ex, ex = EXMAP[id], kind = ex.kind;
  const sets = e ? e.sets : [];
  const held = kind !== "w" && holdOf(id) ? defaultOption(id) : null;   /* 時間の種目でもダンベルを持つもの */
  if(sets.length){
    const prev = sets[sets.length-1];
    const a = adjust(kind, prev.r, prev.rpe);
    const w = kind==="w" ? prev.w : undefined;
    return {r:a.r, w, opt: kind==="w" ? optionByTotal(id, w) : held, why:a.why, src:"前のセットのきつさ " + (prev.rpe||"—")};
  }
  if(last && last.sets.length){
    const first = last.sets[0];
    const avg = last.sets.reduce((x,st)=>x+(st.rpe||0),0) / last.sets.length;
    const a = adjust(kind, first.r, avg ? Math.round(avg*2)/2 : 0);
    const src = "前回のきつさ平均 " + (avg ? Math.round(avg*10)/10 : "—");
    if(kind !== "w") return {r:a.r, opt:held, why:a.why, src};
    const p = weightPlan(item, last, avg);
    if(!p.opt) return {r:a.r, w:first.w, opt:null, why:a.why, src};
    const rr = repRange(id, item);
    if(p.change === "up") return {r:clampR(kind, rr.lo), w:p.opt.total, opt:p.opt, change:"up", src,
      why:"余裕があったので、持っているダンベルの中で一段重い使い方にしました。回数は" + rr.lo + "回から"};
    if(p.change === "down") return {r:clampR(kind, item.r || rr.hi), w:p.opt.total, opt:p.opt, change:"down", src,
      why:"限界で回数が届かなかったので、一段軽い使い方にしました"};
    if(p.change === "snap") return {r:clampR(kind, item.r || ex.r), w:p.opt.total, opt:p.opt, change:"snap", src,
      why:"前回の " + kgText(p.lastW) + " は登録しているダンベルでは作れないので、近い使い方にしました"};
    return {r:a.r, w:p.opt.total, opt:p.opt, why:a.why, src};
  }
  const opt = kind==="w" ? defaultOption(id) : held;
  return {r:clampR(kind, item.r || ex.r), w: kind==="w" ? (opt ? opt.total : 0) : undefined, opt,
          why:"初回はフォーム優先。余力を2〜3回残して終える", src:"初回"};
}
function sugText(item, sug){
  const ex = EXMAP[item.ex];
  if(ex.kind === "w") return sug.w + " kg × " + sug.r + (item.side ? "（左右それぞれ）" : "");
  if(ex.kind === "t") return sug.r + " 秒" + (item.side ? "（左右それぞれ）" : "");
  return sug.r + " 回" + (item.side ? "（左右それぞれ）" : "");
}

function viewToday(){
  const items = todayItems();
  const s = session(TODAY);

  let next = null;
  for(const it of items){
    const e = entryFor(TODAY, it.ex, false);
    if(!e || e.sets.length < (it.sets||3)){ next = it; break; }
  }

  let hero;
  if(!next){
    const total = s.entries.reduce((a,e)=>a+e.sets.length,0);
    hero = `<div class="hero"><p class="kicker">今日のメニュー</p><h2>完了</h2>
      <div class="bigset"><span class="v num" style="color:var(--done)">${total}</span><span class="u">セット記録</span></div>
      <p class="sub">お疲れさまでした。直したい記録は、各種目の「修正」から消せます。</p></div>`;
  }else{
    const ex = EXMAP[next.ex];
    const e = entryFor(TODAY, next.ex, false);
    const sug = suggestNext(next, e, lastPerformance(next.ex, TODAY));
    const inner = ex.kind==="w"
      ? `<div class="bigset"><span class="v num">${sug.w}</span><span class="x num">×</span><span class="v num">${sug.r}</span><span class="u">kg・回</span></div>`
      : `<div class="bigset"><span class="v num">${sug.r}</span><span class="u">${ex.kind==="t"?"秒":"回"}${next.side?"・左右":""}</span></div>`;
    hero = `<div class="hero"><p class="kicker">次の種目</p>
      <h2>${itemName(next)}</h2>${inner}
      ${sug.opt ? `<p class="sub">${sug.opt.text}</p>` : ""}
      <p class="sub">${sug.src}${sug.why?"　→　"+sug.why:""}</p></div>`;
  }

  const rows = items.map(it=>exRow(it)).join("");
  return hero + rows + `
    <div class="rowbtns"><button data-act="addex">種目を追加</button></div>
    <h3 class="sec">今日のメモ</h3>
    <div class="card">
      <textarea id="note" placeholder="睡眠、体調、気づいたこと。一行でいい。">${(s.note||"").replace(/</g,"&lt;")}</textarea>
    </div>
    ${gearCard()}
    ${settingsCard()}`;
}

/* ============================================================
   持っているダンベル
   設定で入れるのは「何kgを何本持っているか」だけ。種目ごとにどれを何本・どう持つかはアプリが決める。
   持っていない重さは提案しない。足りない分は日用品（タオル・リュック・ペットボトルなど）の工夫で補う。
   既定は 5kg×2本（引き継ぎ時の前提）
   ============================================================ */
const GEAR_DEFAULT_ITEMS = [{kg:5, n:2}];
/* 保存データの器具設定を読む。旧形式 {unit,count,adjustable,max} は「unit kg を count 本」に読み替える */
function readGear(g){
  if(!g || typeof g !== "object") return undefined;
  if(Array.isArray(g.items)){
    return {items: g.items.filter(x => x && +x.kg > 0 && +x.n > 0).map(x => ({kg:+x.kg, n:Math.round(+x.n)})),
            updatedAt: +g.updatedAt || 0};
  }
  if(g.unit !== undefined || g.count !== undefined){
    const n = Math.round(+g.count || 0), kg = +g.unit || 5;
    return {items: n > 0 ? [{kg, n}] : [], updatedAt: 0};
  }
  return undefined;
}
/* 入力欄に並べる行（入れたとおり） */
function gearItems(){
  const g = state.gear;
  const items = g && Array.isArray(g.items) ? g.items : GEAR_DEFAULT_ITEMS;
  return items.map(x => ({kg:+x.kg || 0, n:Math.max(0, Math.round(+x.n || 0))}));
}
function setGearItems(items){
  state.gear = {items, updatedAt: Date.now()};
  persistProgram();
  if(typeof syncSchedule === "function") syncSchedule();        /* 同期: ダンベル設定を変えたとき */
}
/* 計算用: 同じ重さはまとめ、軽い順 */
function inventory(){
  const m = {};
  gearItems().forEach(x => { if(x.kg > 0 && x.n > 0) m[x.kg] = (m[x.kg] || 0) + x.n; });
  return Object.keys(m).map(Number).sort((a, b) => a - b).map(kg => ({kg, n:m[kg]}));
}
/* 引き継ぎ時の 5kg×2本 のままか（元の解説文・メモがそのまま当てはまる） */
function isDefaultGear(){ const inv = inventory(); return inv.length === 1 && inv[0].kg === 5 && inv[0].n === 2; }
function kgText(v){ return (Math.round(v * 10) / 10) + "kg"; }

/* 種目ごとの持ち方
   pair   = 同じ重さを2つ使うときの持ち方 / one = 1つだけ使うときの持ち方
   mixed  = 重さの違う2つを組み合わせてよい（体の上に置く種目だけ）
   per    = "arm" なら片腕あたりの重さで重い・軽いを決める（腕の種目）。"total" なら合計で決める
   prefer = 同じ重さになる使い方が複数あるとき、1つで持つほうを選ぶ（"one"） */
const HOLD = {
  goblet:    {pair:"両肩に1つずつ担ぐ",    one:"縦にして胸の前で抱える", per:"total", prefer:"one"},
  rdl:       {pair:"両手に1つずつ持つ",    one:"両手でまとめて持つ",     per:"total"},
  split:     {pair:"両手に1つずつ持つ",    one:"縦にして胸の前で抱える", per:"total"},
  hipthrust: {pair:"骨盤の上に並べて置く", one:"骨盤の上に置く",         per:"total", prefer:"one", mixed:true},
  row:       {one:"片手に持ち、左右を入れ替える",                          per:"total"},
  ohp:       {pair:"両手に1つずつ持つ",    one:"片手ずつ押し上げ、左右を入れ替える", per:"arm"},
  lateral:   {pair:"両手に1つずつ持つ",    one:"片手ずつ上げ、左右を入れ替える",     per:"arm"},
  floorpress:{pair:"両手に1つずつ持つ",    one:"片手ずつ押し、反対の手は床に置く",   per:"arm"},
  curl:      {pair:"両手に1つずつ持つ",    one:"片手ずつ巻き上げ、左右を入れ替える", per:"arm"},
  triext:    {one:"両手でまとめて持つ",                                    per:"total"},
  calf:      {pair:"両手に1つずつ持つ",    one:"片手に持ち、反対の手で壁を支える",   per:"total"},
  farmer:    {pair:"両手に1つずつ持つ",    one:"片手に持ち、途中で左右を持ち替える", per:"total"}
};
function holdOf(id){ return HOLD[id] || HOLD[baseOf(id)] || null; }

/* 持っているダンベルで作れる使い方を、軽い順に並べる。同じ重さになる使い方は1つに絞る */
function gearOptions(id){
  const h = holdOf(id); if(!h) return [];
  const inv = inventory(), out = [];
  inv.forEach(({kg, n})=>{
    if(h.pair && n >= 2) out.push({n:2, pieces:[kg, kg], total:kg * 2, key:h.per === "arm" ? kg : kg * 2, how:h.pair});
    if(h.one && !(h.per === "arm" && h.pair && n >= 2)) out.push({n:1, pieces:[kg], total:kg, key:kg, how:h.one});
  });
  if(h.mixed){
    for(let i = 0; i < inv.length; i++) for(let j = i + 1; j < inv.length; j++){
      const a = inv[j].kg, b = inv[i].kg;
      out.push({n:2, pieces:[a, b], total:a + b, key:a + b, how:h.pair, mixed:true});
    }
  }
  const rank = o => h.prefer === "one" ? (o.n === 1 ? 0 : o.mixed ? 2 : 1) : (o.n === 2 && !o.mixed ? 0 : o.mixed ? 1 : 2);
  out.sort((x, y) => (x.key - y.key) || (rank(x) - rank(y)));
  const uniq = [];
  out.forEach(o => { if(!uniq.length || Math.abs(uniq[uniq.length - 1].key - o.key) > 1e-9) uniq.push(o); });
  uniq.forEach(o => {
    o.total = Math.round(o.total * 10) / 10;
    o.text = o.n === 1 ? kgText(o.pieces[0]) + "を1つ、" + o.how
           : (o.mixed ? kgText(o.pieces[0]) + "と" + kgText(o.pieces[1]) + "を1つずつ、" : kgText(o.pieces[0]) + "を2つ、")
             + o.how + "（合計" + kgText(o.total) + "）";
  });
  return uniq;
}
function optionIndex(opts, o){ return o ? opts.findIndex(x => Math.abs(x.key - o.key) < 1e-9) : -1; }
function optionByTotal(id, w){
  if(w === undefined || w === null || isNaN(w)) return null;
  return gearOptions(id).find(o => Math.abs(o.total - w) < 0.01) || null;
}
/* 持っている組み合わせにない重さ w に一番近い使い方（w 以下で一番重いもの。なければ一番軽いもの） */
function nearestOption(opts, w){
  let best = null;
  opts.forEach(o => { if(o.total <= w + 1e-9 && (!best || o.total > best.total)) best = o; });
  return best || opts.reduce((a, o) => o.total < a.total ? o : a, opts[0]);
}

/* 記録がない種目の最初の重さの目安（per が arm の種目は片腕あたり）。この重さ以下で一番重い使い方から始める */
const START_KG = {goblet:10, rdl:12, rdl1:10, split:10, hipthrust:15, row:8, ohp:5, lateral:3, floorpress:6, curl:5, triext:6, calf:10, farmer:Infinity};
function startKg(id){ const v = START_KG[id] !== undefined ? START_KG[id] : START_KG[baseOf(id)]; return v === undefined ? 8 : v; }
function defaultOption(id){
  const opts = gearOptions(id); if(!opts.length) return null;
  const lim = startKg(id);
  let pick = opts[0];
  opts.forEach(o => { if(o.key <= lim + 1e-9) pick = o; });
  return pick;
}
/* 種目の回数の目安（解説の「10〜15回」から読む） */
function repRange(id, item){
  const d = DETAIL[id] || DETAIL[baseOf(id)] || {};
  const m = /(\d+)〜(\d+)回/.exec(d.reps || "");
  if(m) return {lo:+m[1], hi:+m[2]};
  const r = (item && item.r) || EXMAP[id].r || 10;
  return {lo:Math.max(4, r - 2), hi:r + 3};
}
/* 前回の記録から今日の使い方を決める。動くのは持っている使い方の中だけ。
   up   : 余裕があって回数も伸びきった → 一段重い使い方（重さが一気に増えすぎる場合は動かさない）
   down : 限界で回数が届かなかった → 一段軽い使い方
   snap : 前回の重さが今の登録では作れない → 近い使い方 */
function weightPlan(item, last, avg){
  const id = item.ex, opts = gearOptions(id);
  if(!opts.length) return {opt:null};
  const lastW = last.sets[0].w;
  if(lastW === undefined || lastW === null || isNaN(lastW)) return {opt:defaultOption(id), change:null};
  let i = opts.findIndex(o => Math.abs(o.total - lastW) < 0.01);
  if(i < 0) return {opt:nearestOption(opts, lastW), change:"snap", lastW};
  const {lo, hi} = repRange(id, item);
  const maxR = last.sets.reduce((a, s) => Math.max(a, s.r || 0), 0);
  let change = null;
  const nx = opts[i + 1];
  if(avg && nx && (nx.key <= opts[i].key * 1.6 || nx.key - opts[i].key <= 3)
     && ((avg <= 7 && maxR >= hi + 3) || (avg <= 6 && maxR >= hi))){ i++; change = "up"; }
  else if(avg && i > 0 && avg >= 9.5 && maxR < lo){ i--; change = "down"; }
  return {opt:opts[i], change, lastW};
}

/* 日用品で負荷を変えるやり方（ダンベルは買い足さない前提） */
const HOUSE = {

  farmer:    {up:"持ち手にタオルを巻いて太くする（握る力の負荷が上がる）", down:"水を入れたペットボトルや荷物を入れた袋を持つ"}
};
function houseOf(id){ return HOUSE[id] || HOUSE[baseOf(id)] || {}; }

/* 「使うダンベル」の一文 */
function gearLine(id, sug){
  if(!holdOf(id)) return "";
  const opts = gearOptions(id);
  if(!opts.length){
    const hs = houseOf(id);
    return "ダンベルが登録されていません。" + (hs.down ? "「" + hs.down + "」で代用できます。" : "この種目は飛ばしてください。");
  }
  const o = sug ? sug.opt : defaultOption(id);
  if(!o){
    if(sug && sug.w !== undefined && sug.w !== null && !isNaN(sug.w)) return kgText(sug.w) + "は、登録しているダンベルでは作れない重さです（日用品を足しているなら、そのままで構いません）。";
    return defaultOption(id).text;
  }
  const hs = houseOf(id);
  const heavy = optionIndex(opts, o) === 0 && o.key > startKg(id) * 2 && hs.down
    ? "　持っている中で一番軽くても重めです。きつすぎたら「" + hs.down + "」に替えてください。" : "";
  return o.text + heavy;
}
/* 解説文の「5kg」などの数字は、5kg×2本の前提で書いてある。登録が違えば数字を出さない言い方にする */
function gearText(s){
  if(!s) return "";
  if(isDefaultGear()) return s;
  return String(s).replace(/\d+(?:\.\d+)?\s*kg/g, "軽いダンベル");
}
/* メモのうち持ち方に触れた一文（「両手に1つずつ持つ」「2つ担げば10kgになる」）は、実際の使い方と合うときだけ残す */
function noteFor(item, opt){
  const note = item.note;
  if(!note) return "";
  if(isDefaultGear() && opt && opt.n === 2 && !opt.mixed) return note;
  const kept = note.split("。").filter(x => x && !/kg|[2２]つ|両手に[1１]つずつ/.test(x));
  return kept.length ? kept.join("。") + "。" : "";
}

function dbStep(i, t, d){
  const it = gearItems(); if(!it[i]) return;
  if(t === "kg"){

    it[i].kg = Math.max(0.5, Math.round((cur + d * st) * 10) / 10);
  }else{
    it[i].n = Math.max(1, Math.min(20, it[i].n + d));
  }
  setGearItems(it); render();
}

/* ============================================================
   今日の調整（種目ごとに、きつさ・部位の回復・器具・マンネリから判断する）
   メニュー自体は勝手に書き換えず、提案だけ出す。
   ============================================================ */

/* 指定した部位を、fromDaysAgo〜toDaysAgo 日前に何セット使ったか（今日は含めない） */
function muscleLoadBetween(muscle, fromDaysAgo, toDaysAgo){
  let n = 0;
  sortedDates().forEach(d=>{
    const ago = daysAgo(d);
    if(ago < fromDaysAgo || ago > toDaysAgo) return;
    (state.sessions[d].entries||[]).forEach(e=>{
      const ex = EXMAP[e.ex]; if(!ex) return;
      if(ex.p.includes(muscle)) n += e.sets.length;
      else if((ex.s||[]).includes(muscle)) n += e.sets.length * 0.5;
    });
  });
  return n;
}
/* 直近2回の平均きつさ（記録が2回に満たなければ null） */
function recentRpe(exId, count){
  const hist = exerciseHistory(exId).slice(-(count || 2));
  if(hist.length < (count || 2)) return null;
  const vals = hist.map(h=>{
    const rs = h.sets.map(s=>s.rpe||0).filter(x=>x>0);
    return rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : 0;
  }).filter(x=>x>0);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
/* 同じ主働筋で、今の器具でできる別の種目（今日のメニューにすでにある動きは除く） */
function altFor(exId, wantBodyweight){
  const ex = EXMAP[exId]; if(!ex) return null;
  const mine = ex.p[0];
  const todayPats = new Set(todayItems().filter(t=>t.ex !== exId).map(t=>patternOf(t.ex)));
  const touched = lastDayTouched();
  const cands = EX.filter(c=>{
    if(c.id === exId || baseOf(c.id) === baseOf(exId)) return false;
    if(touched.has(c.id)) return false;
    if(!c.p.includes(mine)) return false;
    if(todayPats.has(patternOf(c.id))) return false;
    if(wantBodyweight && c.kind === "w") return false;
    if(c.kind === "w" && !gearOptions(c.id).length) return false;
    return true;
  });
  if(!cands.length) return null;
  /* しばらくやっていないものを優先する（変化をつけるため） */
  cands.sort((a,b)=> daysSinceEx(b.id) - daysSinceEx(a.id));
  return cands[0];
}
/* 同じ種目が何回続けて出てきているか（直近のセッション連続数） */
function streakOf(exId){
  let n = 0;
  for(const d of sortedDates()){
    const s = state.sessions[d];
    if(!(s.entries||[]).some(e=>e.sets.length)) continue;
    if((s.entries||[]).some(e=>e.ex===exId && e.sets.length)) n++;
    else break;
  }
  return n;
}

/* 1種目ぶんの判断。優先度の高いものを1つだけ返す */
function todayAdvice(item, sug){
  const id = item.ex, ex = EXMAP[id];
  if(!ex) return null;
  const d = DETAIL[id] || DETAIL[baseOf(id)] || {};
  const hs = houseOf(id);
  if(!sug) sug = suggestNext(item, entryFor(TODAY, id, false), lastPerformance(id, TODAY));
  const opts = holdOf(id) ? gearOptions(id) : [];

  /* 1. ダンベルが要る種目なのに登録がない */
  if(ex.kind === "w" && !opts.length){
    const alt = altFor(id, true);
    return {level:"skip", warn:true, short:"ダンベルなし",
      text: "ダンベルが登録されていません。" + (hs.down ? "「" + hs.down + "」で代用できます。" : "")
          + (alt ? "自重でやるなら、同じ" + MUSCLES[ex.p[0]] + "を使う「" + alt.name + "」に替えられます。" : (hs.down ? "" : "今日は飛ばしてください。")),
      alt: alt ? alt.id : null};
  }

  /* 2. 主働筋を昨日しっかり使っている（回復優先） */
  const tired = tiredMuscle(id);
  if(tired){
    return {level:"recover", warn:true, short:"回復優先",
      text: MUSCLES[tired] + "は昨日 " + (Math.round(muscleLoadBetween(tired, 1, 1)*10)/10) + " セット使っています。セット数を1つ減らすか、きつさ7くらいで止めておくほうが回復に有利です。"};
  }

  /* 3. 前回の記録から、今日の持ち方を変えた */
  if(sug.change === "up") return {level:"harder", short:"一段重く",
    text: "前回は余裕があったので、今日は持っているダンベルの中で一段重い「" + sug.opt.text + "」にしています。重すぎたら重量の − で元に戻せます。"};
  if(sug.change === "down") return {level:"easier", warn:true, short:"一段軽く",
    text: "前回は限界で回数が届かなかったので、今日は一段軽い「" + sug.opt.text + "」にしています。"};
  if(sug.change === "snap") return {level:"gear", short:"持ち方変更",
    text: "前回の重さは、今登録しているダンベルでは作れません。今日は「" + sug.opt.text + "」にしています。"};

  const rpe2 = recentRpe(id, 2);
  const cur = sug.opt || (opts.length && sug.w !== undefined && sug.w !== null && !isNaN(sug.w) ? nearestOption(opts, sug.w) : null);
  const i = optionIndex(opts, cur);

  /* 4. 限界が続いている → やさしくする */
  if(rpe2 !== null && rpe2 >= 9.5){
    const tip = i > 0 ? "持っている中で一段軽い「" + opts[i-1].text + "」に替えてください。"
      : (d.easy ? "今日は「" + gearText(d.easy) + "」でもいいです。" : "回数を落として余力を残してください。")
        + (ex.kind === "w" && hs.down ? "ダンベル自体が重すぎるなら「" + hs.down + "」でも構いません。" : "");
    return {level:"easier", warn:true, short:"やさしく",
      text: "直近2回のきつさが平均 " + rpe2.toFixed(1) + "。限界続きはフォームが崩れます。" + tip};
  }

  /* 5. 余裕が続いている → 強くする。持っているダンベルの範囲で、足りなければやり方と日用品で */
  if(rpe2 !== null && rpe2 <= 6){
    let tip;
    if(i >= 0 && i < opts.length - 1){
      tip = "持っている中で一段重い「" + opts[i+1].text + "」に持ち替えてください。";
    }else{
      let way = d.hard ? gearText(d.hard) : (ex.up && ex.up[0] ? gearText(ex.up[0]) : "");
      if(!inventory().length && /ダンベル/.test(way)) way = "";
      tip = (ex.kind === "w" ? "持っているダンベルではこれ以上重くできません。" : "")
          + (way ? "「" + way + "」を試してください。" : "")
          + (hs.up ? (way ? "日用品を使うなら「" + hs.up + "」も手です。" : "「" + hs.up + "」を試してください。") : "")
          + (!way && !hs.up ? "回数を増やしてください。" : "");
    }
    return {level:"harder", short:"強めに",
      text: "直近2回のきつさが平均 " + rpe2.toFixed(1) + "。8〜9に届いていません。" + tip};
  }

  /* 6. 同じ種目が続いている → たまには変える */
  const st = streakOf(id);
  if(st >= 4){
    const alt = altFor(id, false);
    if(alt) return {level:"swap", short:"変えてもいい",
      text: st + "回続けて同じ種目です。同じ" + MUSCLES[ex.p[0]] + "を使う「" + alt.name + "」に替えると刺激が変わります。",
      alt: alt.id};
  }
  return null;
}

/* ============================================================
   提案（ルールベース。外部通信なし。state.sessions の実績だけで判断する）
   ============================================================ */

/* ある種目の、記録のあるセッションだけを古い→新しい順に並べる */
function exerciseHistory(exId){
  const out = [];
  sortedDates().slice().reverse().forEach(d=>{
    const e = (state.sessions[d].entries||[]).find(x=>x.ex===exId && x.sets && x.sets.length);
    if(e) out.push({date:d, sets:e.sets});
  });
  return out;
}
function sessionSummary(exId, sets){
  const kind = EXMAP[exId].kind;
  const avgRpe = sets.reduce((a,s)=>a+(s.rpe||0),0) / sets.length;
  const maxR = sets.reduce((a,s)=>Math.max(a,s.r||0),0);
  const vol = kind==="w" ? sets.reduce((a,s)=>a+(s.w||0)*(s.r||0),0) : sets.reduce((a,s)=>a+(s.r||0),0);
  return {avgRpe, maxR, vol, kind};
}

/* 種目ごとの「そろそろ変え時／まだ様子見／余裕あり」判定。
   持っているダンベルで一段重くできるならその持ち替えを先に出し、できなければ
   EX[id].up（可動域・テンポ・片側化など）と日用品のやり方を次の一手として出す。 */
function heavierOption(exId){
  if(EXMAP[exId].kind !== "w") return null;
  const hist = exerciseHistory(exId), opts = gearOptions(exId);
  if(!hist.length || !opts.length) return null;
  const w = hist[hist.length-1].sets[0].w;
  const cur = optionByTotal(exId, w) || nearestOption(opts, +w || 0);
  const i = optionIndex(opts, cur);
  return i >= 0 && i < opts.length - 1 ? opts[i+1] : null;
}
function nextStepText(exId){
  const ex = EXMAP[exId], next = heavierOption(exId), hs = houseOf(exId);
  if(next) return "持っているダンベルで一段重い「" + next.text + "」に持ち替える";
  const up = exUp(exId), first = gearText(up && up[0] ? up[0] : "");
  return first + (hs.up ? (first ? "。" : "") + "日用品を使うなら「" + hs.up + "」" : "");
}

function levelSuggestions(){
  const out = [];
  Object.keys(EXMAP).forEach(exId=>{
    const ex = EXMAP[exId];
    if(!ex.up || !ex.up.length) return;
    const hist = exerciseHistory(exId);
    if(hist.length < 3) return;
    const ceil = clampR(ex.kind, 9999);
    const sums = hist.map(h=>sessionSummary(exId, h.sets));
    const recent3 = sums.slice(-3);

    const atCeiling = recent3.every(s=>s.maxR >= ceil*0.9 && s.avgRpe >= 8.5);
    if(atCeiling){
      out.push({exId, kind:"levelup",
        title: itemName({ex:exId}) + "：そろそろ切り替え時",
        body: "次の一手 → " + nextStepText(exId),
        why: "直近3回とも" + (ex.kind==="t" ? "秒数" : "回数") + "が上限付近で、きつさの平均が " + recent3[recent3.length-1].avgRpe.toFixed(1) + "。" + (ex.kind !== "w" ? "今のやり方のままでは伸びしろが少ない状態です。"
             : heavierOption(exId) ? "持っているダンベルで、まだ一段重くできます。"
             : "持っているダンベルの一番重い使い方でも上限に来ています。")});
      return;
    }

    if(hist.length >= 4){
      const sums4 = sums.slice(-4);
      const first = sums4[0].vol, last = sums4[sums4.length-1].vol;
      const avgRpe4 = sums4.reduce((a,s)=>a+s.avgRpe,0) / sums4.length;
      if(first > 0 && last <= first*1.05 && avgRpe4 >= 8){
        out.push({exId, kind:"plateau",
          title: itemName({ex:exId}) + "：伸び悩みぎみ",
          body: "次の一手 → " + nextStepText(exId),
          why: "直近4回できつさは高いまま（平均 " + avgRpe4.toFixed(1) + "）ですが、量はほぼ横ばいです。"});
        return;
      }
    }

    const easy3 = recent3.every(s=>s.avgRpe <= 6 && s.maxR < ceil*0.7);
    if(easy3){
      out.push({exId, kind:"easy",
        title: itemName({ex:exId}) + "：余裕が続いています",
        body: "回数を増やすか、早めに次の一手 → " + nextStepText(exId),
        why: "直近3回のきつさ平均が " + (recent3.reduce((a,s)=>a+s.avgRpe,0)/3).toFixed(1) + "。8〜9を狙う設計に対して軽すぎる状態です。"});
    }
  });
  return out;
}

/* 大きな部位が長期間ゼロに近い＝メニュー全体の見直しサイン */
function balanceSuggestions(){
  const BIG = ["quads","glutes","hams","lats"];
  const load30 = muscleLoad(30);
  const out = [];
  BIG.forEach(m=>{
    const v = load30[m] || 0;
    if(v <= 2){
      const cands = EX.filter(e=>e.p.includes(m)).slice(0,3).map(e=>e.name);
      out.push({kind:"balance", muscle:m,
        title: MUSCLES[m] + "：直近30日でほぼ使えていません",
        body: cands.length ? "候補: " + cands.join("、") : "",
        why: "有効セット数 " + v.toFixed(1) + "（体の中で大きい筋肉なので、抜けると効果の範囲が狭くなります）"});
    }
  });
  return out;
}

function planSummary(){
  const totalSessions = sortedDates().filter(d=>(state.sessions[d].entries||[]).some(e=>e.sets.length)).length;
  return { totalSessions, level: levelSuggestions(), balance: balanceSuggestions() };
}

/* ---------- 提案 ---------- */

  const p = planSummary();
  if(p.totalSessions < 3){
    return `<div class="empty">まだデータが少ないため提案できません。<br>あと${3 - p.totalSessions}回ほど記録すると、傾向が見えてきます。</div>`;
  }

  const levelCards = p.level.length
    ? p.level.map(s=>`<div class="card">
        <h4>${s.title}</h4>
        <p style="margin:0 0 6px;font-size:14px">${s.body}</p>
        <p class="lastline" style="margin-top:0">${s.why}</p>
        <div class="rowbtns"><button data-act="goref" data-ex="${s.exId}">種目を見る</button></div>
      </div>`).join("")

  const balanceCards = p.balance.length
    ? p.balance.map(s=>`<div class="card">

/* ---------- 履歴 ---------- */
function viewHist(){
  const dates = sortedDates().filter(d=> (state.sessions[d].entries||[]).some(e=>e.sets.length));
  /* 記録がない端末でも、共有の接続とバックアップからの復元はできるようにする（別の端末の記録を持ってくるため） */
  if(!dates.length) return `<div class="empty">まだ記録がありません。<br>「今日」タブから最初の1セットを記録してください。<br>別の端末の記録を使う場合は、下の共有か復元から取り込めます。</div>
    ${typeof syncCard === "function" ? syncCard() : ""}
    ${typeof storeButtons === "function" ? `<h3 class="sec">バックアップ</h3><div class="card">${storeButtons()}</div>` : ""}`;

  const streakDays = dates.length;
  const totalSets = dates.reduce((a,d)=>a+(state.sessions[d].entries||[]).reduce((x,e)=>x+e.sets.length,0),0);
  const last7 = dates.filter(d=>daysAgo(d)<7).length;

  const perEx = {};
  dates.slice().reverse().forEach(d=>{
    (state.sessions[d].entries||[]).forEach(e=>{
      if(!e.sets.length) return;
      const ex = EXMAP[e.ex]; if(!ex) return;
      const vol = ex.kind==="w" ? e.sets.reduce((a,s)=>a+s.w*s.r,0) : e.sets.reduce((a,s)=>a+s.r,0);
      (perEx[e.ex] = perEx[e.ex] || []).push({d, vol, best: bestSet(e.sets, ex.kind)});
    });
  });

  const prog = Object.keys(perEx).map(id=>{
    const ex = EXMAP[id], rows = perEx[id];
    const max = Math.max(...rows.map(r=>r.vol), 1);
    const bars = rows.slice(-12).map(r=>`<i style="height:${Math.max(4, Math.round(r.vol/max*44))}px" title="${fmtDate(r.d)}"></i>`).join("");
    const first = rows[0], lastR = rows[rows.length-1];
    const delta = first.vol>0 ? Math.round((lastR.vol/first.vol-1)*100) : 0;
    const unit = ex.kind==="w" ? "kg·回" : (ex.kind==="t"?"秒":"回");
    return `<div class="card">
      <h4>${ex.name}</h4>
      <div class="spark">${bars}</div>
      <p class="lastline" style="margin-top:2px">総量 <b>${Math.round(lastR.vol)}</b> ${unit}　最高セット <b>${setText(lastR.best, ex.kind)}</b>${rows.length>1?`　開始時比 <b>${delta>=0?"+":""}${delta}%</b>`:""}</p>
    </div>`;
  }).join("");

  const table = dates.slice(0,30).map(d=>{
    const s = state.sessions[d];
    const sets = (s.entries||[]).reduce((a,e)=>a+e.sets.length,0);
    const names = (s.entries||[]).filter(e=>e.sets.length).map(e=>EXMAP[e.ex]?EXMAP[e.ex].name:e.ex).join("、");
    return `<tr><td>${fmtDate(d)}<div style="font-size:11.5px;color:var(--ink-3)">${names}</div>${s.note?`<div style="font-size:11.5px;color:var(--ink-2)">${s.note.replace(/</g,"&lt;")}</div>`:""}</td><td class="n">${sets}</td></tr>`;
  }).join("");

  return `
    <div class="card">
      <h4>これまで</h4>
      <div class="bigset"><span class="v num">${streakDays}</span><span class="u">回のトレーニング・${totalSets}セット</span></div>
      <p class="lastline">直近7日で ${last7} 回。</p>
    </div>
    <h3 class="sec">種目ごとの推移</h3>
    ${prog}
    <h3 class="sec">セッション</h3>
    <div class="card overflowx">
      <table class="hist"><thead><tr><th>日付</th><th style="text-align:right">セット</th></tr></thead><tbody>${table}</tbody></table>
    </div>
    ${typeof syncCard === "function" ? syncCard() : ""}
    <h3 class="sec">書き出し</h3>
    <div class="card">
      <p class="lastline" style="margin-top:0">CSVで保存するか、テキストを貼り付けて共有できます。</p>
      <div class="rowbtns">
        <button data-act="csv">CSVで保存</button>
        <button data-act="txt">テキストで表示</button>
      </div>
      ${typeof storeButtons === "function" ? storeButtons() : ""}
    </div>`;
}

  v.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick = (ev)=>{
      const a = el.dataset.act;
      if(a==="toggle"){ openEx = (openEx===el.dataset.ex)?null:el.dataset.ex; render(); }
      else if(a==="addset"){ addSet(el.dataset.ex); }
      else if(a==="delset"){ delSet(el.dataset.ex, +el.dataset.i); }
      else if(a==="step"){ step(el.dataset.t, el.dataset.ex, +el.dataset.d); }
      else if(a==="pref"){ const k = el.dataset.k; PREF.set(k, !PREF.get(k, PREF_DEFAULT[k])); render(); }
      else if(a==="edit"){ editEx = (editEx===el.dataset.ex) ? null : el.dataset.ex; render(); }
      else if(a==="dbstep"){ dbStep(+el.dataset.i, el.dataset.t, +el.dataset.d); }
      else if(a==="dbdel"){ const it = gearItems(); it.splice(+el.dataset.i, 1); setGearItems(it); render(); }
      else if(a==="dbadd"){
        const it = gearItems(), mx = it.reduce((m, x)=>Math.max(m, x.kg), 0);
        it.push({kg: mx ? (mx < 10 ? mx + 2 : mx + 5) : 5, n: 2}); setGearItems(it); render();
      }
      else if(a==="swapto"){ replaceInPlan(el.dataset.from, el.dataset.ex); }
      else if(a==="asknotify"){ if(PREF.get("notify",false)){ PREF.set("notify",false); render(); } else askNotify(); }
      else if(a==="testalert"){ testChime(); buzz(); notify("テスト", "この知らせ方で鳴ります"); }
      else if(a==="goref"){ refEx = el.dataset.ex; switchTab("ex"); }
      else if(a==="addex"){ openPicker("add"); }
      else if(a==="addtoday"){ addToProgramToday(el.dataset.ex); }
      else if(a==="days"){ bodyDays = +el.dataset.d; selMuscle=null; render(); }
      else if(a==="play"){ togglePlay(el.dataset.ex); }
      else if(a==="csv"){ exportCSV(); }
      else if(a==="txt"){ showText(); }
      else if(a==="backup" && typeof backupSave === "function"){ backupSave(); }
      else if(a==="restore" && typeof backupLoad === "function"){ backupLoad(); }
      else if(a==="restorepaste" && typeof backupPaste === "function"){ backupPaste(); }
    };
  });

  const sel = v.querySelector("#exSel");
  if(sel) sel.onchange = ()=>{ refEx = sel.value; render(); };

  /* 持っているダンベルの入力欄 */
  v.querySelectorAll('input[id^="db_"]').forEach(inp=>{
    inp.onchange = ()=>{
      const [, t, i] = inp.id.split("_");
      const it = gearItems(), val = parseFloat(inp.value || "0");
      if(!it[+i] || isNaN(val) || val <= 0){ render(); return; }
      if(t === "kg") it[+i].kg = Math.round(val * 10) / 10;
      else it[+i].n = Math.max(1, Math.round(val));
      setGearItems(it); render();
    };
  });
  /* 重量を手で打ち替えたら「使うダンベル」の一文も合わせる */
  v.querySelectorAll('input[id^="w_"]').forEach(inp=>{
    inp.oninput = ()=>{
      const id = inp.id.slice(2), h = document.getElementById("wh_" + id);
      const w = parseFloat(inp.value);
      if(h) h.textContent = gearLine(id, {opt: optionByTotal(id, w), w});
    };
  });

  const note = v.querySelector("#note");
  if(note){
    let t=null;
    note.oninput = ()=>{
      clearTimeout(t);
      t = setTimeout(()=>{
        const s = session(TODAY); s.note = note.value; s.noteAt = Date.now(); persistSession(TODAY);
        if(typeof syncSchedule === "function") syncSchedule();      /* 同期: メモを変えたとき */
      }, 600);
    };
  }

  if(tab==="ex"){
    const ex = EXMAP[refEx];
    const w = {}; ex.p.forEach(m=>w[m]=1); (ex.s||[]).forEach(m=>{ if(!w[m]) w[m]=0.45; });
    paintFigs(v.querySelector("#refFig"), w, 1);
  }
  if(tab==="body"){

    const max = Math.max(1, ...Object.values(load));

function switchTab(t){
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.tab===t)));
  render(); window.scrollTo(0,0);
}

function step(t, id, d){
  const map = {w:"w_", r:"r_", e:"e_"};
  const inp = document.getElementById(map[t]+id);
  if(!inp) return;
  let val = parseFloat(inp.value||"0");
  if(t==="w"){
    /* 重量は、持っているダンベルで作れる使い方だけを順にたどる */
    const opts = gearOptions(id);
    if(opts.length){
      let i = opts.findIndex(o => Math.abs(o.total - val) < 0.01);
      i = i < 0 ? opts.indexOf(nearestOption(opts, isNaN(val) ? 0 : val)) : Math.max(0, Math.min(opts.length - 1, i + d));
      inp.value = String(opts[i].total);
      const h = document.getElementById("wh_" + id);
      if(h) h.textContent = gearLine(id, {opt: opts[i]});
      return;
    }
    val = Math.max(0, val + d*0.5);
  }
  else if(t==="e") val = Math.min(10, Math.max(1, val + d));
  else val = Math.max(1, val + d);
  inp.value = (t==="w") ? String(val) : String(Math.round(val));
}

function addSet(id){
  const ex = EXMAP[id];
  const rIn = document.getElementById("r_"+id), eIn = document.getElementById("e_"+id);
  if(!rIn || !eIn) return;
  const r = Math.round(parseFloat(rIn.value||"0"));
  const rpe = Math.round(parseFloat(eIn.value||"0"));
  if(!r || r<1) return;
  /* 前日の画面のまま押された場合は、前日に記録せず今日のメニューに切り替える */
  if(rollDay()){ render(); setStatus("日付が変わったので、今日のメニューに切り替えました"); return; }
  const item = itemOf(id);
  if(isDoneToday(id)){ render(); return; }          /* 規定のセット数を終えた種目は、修正で消すまで記録できない */
  unlockAudio();
  const st = {id:newSetId(), at:Date.now(), r, rpe};
  if(ex.kind==="w"){
    const w = parseFloat(document.getElementById("w_"+id).value||"0");
    st.w = isNaN(w)?0:w;
  }
  const s = session(TODAY);
  fixPlan(s);
  const e = entryFor(TODAY, id, true);
  e.sets.push(st);
  persistSession(TODAY);
  if(typeof syncNow === "function") syncNow();                   /* 同期: 記録したとき */

  const doneNow = e.sets.length >= (item.sets||3);
  if(doneNow){ openEx = null; editEx = null; }
  let label;
  if(doneNow){
    const items = todayItems();
    const nx = items.find(it=>{ const en = entryFor(TODAY, it.ex, false); return !en || en.sets.length < (it.sets||3); });
    label = nx ? "次: " + itemName(nx) : "今日のメニュー完了";
  }else{
    const sug = suggestNext(item, e, lastPerformance(id, TODAY));
    label = itemName(item) + "  " + sugText(item, sug);
  }
  render();
  startRest(restFor(item), label);
}
function delSet(id, i){
  if(rollDay()){ render(); setStatus("日付が変わったので、今日のメニューに切り替えました"); return; }
  const e = entryFor(TODAY, id, false);
  if(!e || !e.sets[i]) return;
  const s = session(TODAY);
  const wasDone = isDoneToday(id);
  const gone = e.sets.splice(i,1)[0];
  if(gone && gone.id) s.del = (s.del || []).concat(gone.id);        /* 別の端末から復活しないように、消した印を残す */
  const inPlan = todayItems().some(x => x.ex === id && !x.extra);
  if(!e.sets.length && !inPlan && !state.program.includes(id)){
    s.entries = s.entries.filter(x => x !== e);
  }
  persistSession(TODAY);
  if(typeof syncNow === "function") syncNow();                   /* 同期: 修正で消したとき */
  /* 修正で規定に届かなくなったら、そのまま記録できる状態で開く */
  if(wasDone && !isDoneToday(id)){ editEx = null; openEx = id; }
  render();
}
function addToProgramToday(id){
  if(isDoneToday(id)){
    openEx = null; editEx = null;
    switchTab("today");
    setStatus("「" + itemNameOf(id) + "」は今日の分を記録済みです。直すときは「修正」を押してください");
    return;
  }
  entryFor(TODAY, id, true);
  persistSession(TODAY);
  openEx = id; editEx = null;
  switchTab("today");
}
/* 今日のメニューの種目を別の種目に替える（「今日の調整」から） */
function replaceInPlan(fromId, toId){
  const s = session(TODAY);
  fixPlan(s);
  const e = entryFor(TODAY, fromId, false);
  const i = s.plan.findIndex(x => x.ex === fromId);
  if(i >= 0 && !(e && e.sets.length)){
    s.plan[i] = catalogItem(toId);
    if(e) s.entries = s.entries.filter(x => x !== e);
  }else if(!s.plan.some(x => x.ex === toId)){
    s.plan.push(catalogItem(toId));
  }
  persistSession(TODAY);
  openEx = toId; editEx = null;
  switchTab("today");
}

/* ---------- 書き出し ---------- */
function buildCSV(){
  const rows = [["日付","種目","セット","重量kg","回数/秒","きつさ","メモ"]];
  sortedDates().slice().reverse().forEach(d=>{
    const s = state.sessions[d];
    let first = true;
    (s.entries||[]).forEach(e=>{
      const ex = EXMAP[e.ex];
      e.sets.forEach((st,i)=>{
        rows.push([d, ex?ex.name:e.ex, i+1, st.w!==undefined?st.w:"", st.r, st.rpe||"", first?(s.note||""):""]);
        first = false;
      });
    });
  });
  return rows.map(r=>r.map(c=>{
    const v = String(c===undefined?"":c);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(",")).join("\n");
}
async function exportCSV(){
  const csv = "\ufeff" + buildCSV();
  const ok = await saveFile("training-" + TODAY + ".csv", csv);
  if(!ok) showText();          /* 保存できない環境では画面に出す */
}
function showText(){
  const lines = [];
  sortedDates().slice().reverse().forEach(d=>{
    const s = state.sessions[d];
    const es = (s.entries||[]).filter(e=>e.sets.length);
    if(!es.length) return;
    lines.push(fmtDate(d));
    es.forEach(e=>{
      const ex = EXMAP[e.ex];
      lines.push("  " + (ex?ex.name:e.ex) + "  " + e.sets.map(st=>setText(st, ex?ex.kind:"b") + (st.rpe?`(${st.rpe})`:"")).join(" / "));
    });
    if(s.note) lines.push("  メモ: " + s.note);
    lines.push("");
  });
  const txt = lines.join("\n") || "記録がありません";
  sheetInner.innerHTML = `<h4>コピーして共有</h4>
    <p class="lastline" style="margin-top:0">括弧内はきつさの自己評価です。</p>
    <textarea style="min-height:280px" readonly>${txt.replace(/</g,"&lt;")}</textarea>
    <div class="rowbtns"><button data-close="1">閉じる</button></div>`;
  const t = sheetInner.querySelector("textarea");
  t.onfocus = ()=> t.select();
  sheetInner.querySelector("[data-close]").onclick = ()=> sheet.classList.remove("on");
  sheet.classList.add("on");
}

  themeBtn.onclick = ()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : (cur==="light" ? "" : "dark");
    if(next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    try{ next ? localStorage.setItem("trainlog.theme", next) : localStorage.removeItem("trainlog.theme"); }catch(e){}
    figThemeChanged(); render();
  };
})();

/* ---------- 日付の切り替わり ----------
   画面に戻ったとき・1分ごとに確かめる（入力中は邪魔しないよう次の機会にする） */
function checkNewDay(){
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && document.getElementById("view").contains(el)) return;
  if(rollDay()) render();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") checkNewDay(); });
window.addEventListener("pageshow", checkNewDay);
setInterval(checkNewDay, 60000);

/* ---------- 起動 ---------- */
render();
initStore().then(()=>{ if(typeof syncInit === "function") syncInit(); });
</script>
<script>
if('serviceWorker' in navigator){
  var __hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./service-worker.js').catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(__hadController && !window.__swReloaded){ window.__swReloaded = true; location.reload(); }
  });
}
</script>
