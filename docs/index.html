<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレーニング記録</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#EFEFE9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
:root{
  --paper:#EFEFE9;
  --panel:#FFFFFF;
  --panel-2:#F7F7F2;
  --ink:#1A2430;
  --ink-2:#5A6774;
  --ink-3:#8C97A1;
  --rule:#D6D8D0;
  --muscle:#B23A31;
  --muscle-2:#8A2B24;
  --neutral-fill:#DBDCD4;
  --neutral-stroke:#C4C6BD;
  --done:#2F6B4F;
  --shadow:0 1px 0 rgba(26,36,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13171B;
    --panel:#1A1F25;
    --panel-2:#20262D;
    --ink:#E9E9E2;
    --ink-2:#9BA6B0;
    --ink-3:#6E7A85;
    --rule:#2B333A;
    --muscle:#D3584C;
    --muscle-2:#E8796D;
    --neutral-fill:#2C333A;
    --neutral-stroke:#3A434B;
    --done:#4F9C77;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#13171B;
  --panel:#1A1F25;
  --panel-2:#20262D;
  --ink:#E9E9E2;
  --ink-2:#9BA6B0;
  --ink-3:#6E7A85;
  --rule:#2B333A;
  --muscle:#D3584C;
  --muscle-2:#E8796D;
  --neutral-fill:#2C333A;
  --neutral-stroke:#3A434B;
  --done:#4F9C77;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.num{font-family:"Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.wrap{max-width:620px;margin:0 auto;padding:0 16px 96px}

/* ---- header ---- */
header{padding:22px 0 12px;display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
header .date{margin-left:auto;font-size:13px;color:var(--ink-2)}
.themebtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}

/* ---- tabs ---- */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:20px;overflow-x:auto}
nav.tabs button{
  background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--muscle)}

/* ---- hero ---- */
.hero{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero .kicker{font-size:12px;color:var(--ink-3);margin:0 0 2px}
.hero h2{margin:0 0 10px;font-size:20px;font-weight:700}
.bigset{display:flex;align-items:baseline;gap:6px}
.bigset .v{font-size:46px;font-weight:700;line-height:1}
.bigset .x{font-size:22px;color:var(--ink-3);font-weight:500}
.bigset .u{font-size:15px;color:var(--ink-2);align-self:flex-end;padding-bottom:5px}
.hero .sub{font-size:13px;color:var(--ink-2);margin-top:6px}

/* ---- exercise cards ---- */
.exrow{background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:10px;overflow:hidden}
.exrow.done{border-color:var(--done)}
.exhead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;background:none;border:none;text-align:left}
.exhead .nm{display:block;font-weight:600;font-size:15px}
.exhead .meta{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.exhead .cnt{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.exrow.done .cnt{color:var(--done);font-weight:600}
.exbody{padding:0 14px 14px;border-top:1px solid var(--rule)}

.setline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.setline:last-of-type{border-bottom:none}
.setline .i{width:22px;color:var(--ink-3);font-size:12px}
.setline .val{font-weight:600}
.setline .rpe{margin-left:auto;font-size:12px;color:var(--ink-2)}
.setline .del{background:none;border:none;color:var(--ink-3);padding:2px 6px;font-size:16px;line-height:1}

.entry{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--ink-3)}
.stepper{display:flex;align-items:center;border:1px solid var(--rule);border-radius:3px;background:var(--panel-2)}
.stepper button{background:none;border:none;width:32px;height:38px;font-size:17px;color:var(--ink-2)}
.stepper input{
  width:52px;height:38px;border:none;background:none;text-align:center;
  font-family:"Archivo",system-ui,sans-serif;font-size:17px;font-weight:600;color:var(--ink);
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addbtn{background:var(--ink);color:var(--paper);border:none;border-radius:3px;height:38px;padding:0 18px;font-weight:700;font-size:14px}
.addbtn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule);font-weight:600}

.hint{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:2px solid var(--muscle);padding:8px 10px;margin-top:12px;border-radius:0 3px 3px 0}
.lastline{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.card a{color:var(--muscle);font-weight:600;text-underline-offset:2px}
.lastline b{color:var(--ink);font-family:"Archivo",system-ui,sans-serif}

/* ---- rest timer ---- */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:none;align-items:center;gap:14px;padding:11px 18px;z-index:50}
.timer.on{display:flex}
.timer .t{font-family:"Archivo",system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em}
.timer .lb{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.timer .lb b{font-size:12.5px;font-weight:600;opacity:.75}
.timer .lb small{font-size:12px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button+button{margin-left:0}
.timer button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:3px;padding:5px 12px;font-size:13px;white-space:nowrap;flex:0 0 auto}

/* ---- body figure ---- */
.figs{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.figwrap{flex:1;max-width:190px;text-align:center}
.figwrap .cap{font-size:11px;color:var(--ink-3);margin-top:2px}
svg.fig{width:100%;height:auto;display:block}
svg.fig .nt{fill:var(--neutral-fill);opacity:.55}
svg.fig .rg{fill:var(--neutral-fill);stroke:var(--neutral-stroke);stroke-width:.8;transition:fill .18s}
svg.fig .rg.sel{stroke:var(--ink);stroke-width:1.6}
svg.fig.clickable .rg{cursor:pointer}

.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend .bar{width:96px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--neutral-fill),var(--muscle))}

.mlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.p{background:var(--muscle);border-color:var(--muscle);color:#fff}
.chip.s{border-color:var(--muscle);color:var(--muscle)}

/* ---- generic blocks ---- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:12px}
h3.sec{font-size:13px;font-weight:700;color:var(--ink-2);margin:26px 0 10px}
.card h4{margin:0 0 8px;font-size:15px;font-weight:700}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:5px;font-size:14px}
.warn{color:var(--muscle)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{font-size:14px;padding-left:15px;position:relative;margin-bottom:5px}
ul.plain li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:1.5px;background:var(--ink-3)}

table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--rule)}
table.hist td{padding:6px;border-bottom:1px solid var(--rule)}
table.hist td.n{font-family:"Archivo",system-ui,sans-serif;font-weight:600;text-align:right;white-space:nowrap}

.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin:8px 0 2px}
.spark i{flex:1;background:var(--muscle);opacity:.8;border-radius:1px 1px 0 0;min-height:2px}

.empty{color:var(--ink-2);font-size:14px;padding:26px 4px;text-align:center}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rowbtns button{background:none;border:1px solid var(--rule);border-radius:3px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}

select,textarea,input[type=text],input[type=password]{
  font:inherit;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--rule);border-radius:3px;padding:8px 10px;width:100%;
}
textarea{min-height:64px;resize:vertical}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:var(--paper);width:100%;max-width:620px;max-height:86vh;overflow-y:auto;border-radius:10px 10px 0 0;padding:18px 16px 30px}
.sheet .inner h4{margin:0 0 12px;font-size:16px}
.picklist{display:flex;flex-direction:column;gap:6px}
.picklist button{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;text-align:left;font-size:14px;font-weight:600}
.picklist button span{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}

.status{font-size:11.5px;color:var(--ink-3);text-align:center;padding:14px 0 0}
.overflowx{overflow-x:auto}

/* ---- movement diagrams ---- */
.diapair{display:flex;align-items:center;gap:4px;margin:2px 0 0}
.diacell{flex:1;min-width:0;text-align:center}
.diacell svg,.diasolo svg{width:100%;height:auto;display:block}
.diasolo{max-width:76%;margin:0 auto}
.diahint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:2px 0 0}
.dialab{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.diaarrow{color:var(--ink-3);font-size:19px;line-height:1;flex:0 0 auto;padding:0 2px}
.fg-body{fill:var(--ink)}
.fg-far{fill:var(--ink);opacity:.4}
.fg-ghost{opacity:.14}
.fg-halo{fill:var(--panel);stroke:var(--panel);stroke-width:2.8;stroke-linejoin:round}
.fg-db{fill:var(--muscle)}
.fg-prop{fill:var(--neutral-fill);stroke:var(--neutral-stroke);stroke-width:1.5}
.fg-floor{stroke:var(--neutral-stroke);stroke-width:2;stroke-linecap:round}
.dianote{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.diahold{font-size:12px;color:var(--ink-2);margin:9px 0 0;padding:7px 9px;background:var(--panel-2);border-radius:3px}
.diahold b{color:var(--ink-3);font-size:10.5px;font-weight:700}
.exhead .fix{margin-left:8px;flex:0 0 auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:4px 12px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.exrow.editing .exhead .fix{border-color:var(--ink-2);color:var(--ink)}
.exbody.exedit{display:block;padding-top:4px}
.dbrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.dbrow:first-child{padding-top:0}
.dbrow .dbdel{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:3px;width:38px;height:38px;
  font-size:17px;line-height:1;color:var(--ink-3)}
.side{font-size:10px;color:var(--muscle);border:1px solid var(--muscle);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.adv{font-size:10px;color:var(--ink-2);border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.adv.warn{color:var(--muscle);border-color:var(--muscle)}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--panel-2);
  border-left:2px solid var(--muscle);padding:9px 11px;margin-top:12px;border-radius:0 3px 3px 0}
.target .tl{font-size:11px;color:var(--ink-3)}
.target .tv{font-size:19px;font-weight:700}
.target .tw{font-size:11.5px;color:var(--ink-2);flex-basis:100%}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.setrow:last-of-type{border-bottom:none}
.setrow small{display:block;font-size:11px;color:var(--ink-3)}
.setrow .stt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.tg{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:4px 14px;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tg.on{border-color:var(--muscle);color:var(--muscle)}
.splitcols{display:block}
.exmain{min-width:0}
.exside{margin-top:14px}
.refhead{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}

@media (min-width:900px){
  .wrap{max-width:1120px;padding:0 28px 96px}
  .shell{display:grid;grid-template-columns:168px minmax(0,1fr);gap:36px;align-items:start}
  nav.tabs{flex-direction:column;gap:0;border-bottom:none;border-right:1px solid var(--rule);
           position:sticky;top:20px;margin:0;overflow:visible}
  nav.tabs button{text-align:left;padding:9px 16px 9px 2px;border-bottom:none;
                  border-right:2px solid transparent;margin:0 -1px 0 0;font-size:15px}
  nav.tabs button[aria-selected="true"]{border-right-color:var(--muscle)}
  main.view-today,main.view-hist{max-width:760px}
  .splitcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .splitcols>div{min-width:0}
  .exbody{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:22px;align-items:start}
  .exside{margin-top:0}
  .hero{padding:24px 26px 22px}
  .hero .bigset .v{font-size:56px}
  .diasolo{max-width:52%}
}
@media (min-width:1180px){
  .wrap{max-width:1240px}
  .shell{grid-template-columns:180px minmax(0,1fr)}
}
.figslot{position:relative;background:var(--panel-2);border-radius:4px;overflow:hidden}
.figcanvas{width:100%;height:auto;display:block;touch-action:pan-y;cursor:grab}
.figcanvas:active{cursor:grabbing}
.figstill{width:100%;height:auto;display:block}
.figbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rule);display:none}
.figbar span{display:block;height:100%;width:0;background:var(--muscle)}
.figphase{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--ink-2);
  background:var(--panel);padding:1px 8px;border-radius:999px;opacity:.92}
.diawrong .fg-body,.diawrong .fg-far{fill:var(--muscle)}
.diawrong .fg-halo{fill:var(--panel);stroke:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>トレーニング記録</h1>
    <span class="date num" id="todayLabel"></span>
    <button class="themebtn" id="themeBtn">表示</button>
  </header>

  <div class="shell">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">今日</button>
      <button role="tab" data-tab="ex" aria-selected="false">種目</button>
      <button role="tab" data-tab="body" aria-selected="false">からだ</button>
      <button role="tab" data-tab="hist" aria-selected="false">履歴</button>
      <button role="tab" data-tab="plan" aria-selected="false">提案</button>
    </nav>
    <main id="view" class="view-today"></main>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="timer" id="timer">
  <span class="t num" id="timerT">1:30</span>
  <span class="lb"><b>次のセットまで</b><small id="timerLb"></small></span>
  <button id="timerPlus">+30秒</button>
  <button id="timerStop">終了</button>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

<script>
/* ============================================================
   人体の骨格モデルと動作生成（DOM も three.js も使わない純関数群）

   座標系: X=前(体の正面)  Y=上  Z=右  単位=メートル  床 y=0
   休め姿勢: 直立・両腕を体側に垂らす。このとき各ボーンの局所軸は
   ワールド軸と一致するので、関節角は解剖学の面と一対一で対応する。
     屈曲/伸展 = Z軸まわり   外転/内転・側屈 = X軸まわり   回旋 = Y軸まわり
   ============================================================ */
(function (root) {
  'use strict';

  /* ---------- ベクトル・クォータニオン ---------- */
  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1e-9; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]
  };

  const Q = {
    id: () => [0, 0, 0, 1],
    mul: (a, b) => [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]
    ],
    conj: (q) => [-q[0], -q[1], -q[2], q[3]],
    axis: (ax, rad) => {
      const h = rad / 2, s = Math.sin(h);
      return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(h)];
    },
    rot: (q, v) => {
      const [x, y, z, w] = q;
      const tx = 2 * (y * v[2] - z * v[1]);
      const ty = 2 * (z * v[0] - x * v[2]);
      const tz = 2 * (x * v[1] - y * v[0]);
      return [v[0] + w * tx + y * tz - z * ty,
              v[1] + w * ty + z * tx - x * tz,
              v[2] + w * tz + x * ty - y * tx];
    },
    /* 単位ベクトル from を to に最短で向けるクォータニオン */
    between: (from, to) => {
      const f = V.norm(from), t = V.norm(to);
      const d = V.dot(f, t);
      if (d > 0.999999) return Q.id();
      if (d < -0.999999) {
        let ax = V.cross(f, [1, 0, 0]);
        if (V.len(ax) < 1e-6) ax = V.cross(f, [0, 1, 0]);
        return Q.axis(V.norm(ax), Math.PI);
      }
      const c = V.cross(f, t);
      return Q.normalize([c[0], c[1], c[2], 1 + d]);
    },
    normalize: (q) => {
      const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1e-9;
      return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
    },
    /* Z(屈曲)→X(外転)→Y(回旋) の順に回す */
    fromFAT: (flexRad, abdRad, twistRad) =>
      Q.mul(Q.mul(Q.axis([0, 0, 1], flexRad), Q.axis([1, 0, 0], abdRad)), Q.axis([0, 1, 0], twistRad)),
    /* 同じ順序で分解して度で返す（可動域の検査用）

      const a = Math.asin(clamp(m[7], -1, 1));
      const ca = Math.cos(a);
      let f, t;

        f = Math.atan2(-m[1], m[4]);
        t = Math.atan2(-m[6], m[8]);
      } else {                      /* 外転90度付近は屈曲と回旋が縮退する */
        f = Math.atan2(m[3], m[0]);
        t = 0;

    fromBasis: (x, y, z) => {

      const tr = m[0] + m[4] + m[8];
      let q;
      if (tr > 0) {
        const s = Math.sqrt(tr + 1) * 2;
        q = [(m[7] - m[5]) / s, (m[2] - m[6]) / s, (m[3] - m[1]) / s, 0.25 * s];
      } else if (m[0] > m[4] && m[0] > m[8]) {
        const s = Math.sqrt(1 + m[0] - m[4] - m[8]) * 2;
        q = [0.25 * s, (m[1] + m[3]) / s, (m[2] + m[6]) / s, (m[7] - m[5]) / s];
      } else if (m[4] > m[8]) {

      } else {
        const s = Math.sqrt(1 + m[8] - m[0] - m[4]) * 2;
        q = [(m[2] + m[6]) / s, (m[5] + m[7]) / s, 0.25 * s, (m[3] - m[1]) / s];
      }

    },

    twistAbout: (q, a) => {
      const d = q[0] * a[0] + q[1] * a[1] + q[2] * a[2];
      return Q.normalize([a[0] * d, a[1] * d, a[2] * d, q[3]]);
    },

    matrix: (q) => {
      const [x, y, z, w] = q;
      return [

        2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w),
        2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)
      ];
    }
  };

  const RAD = Math.PI / 180;
  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

  /* ============================================================
     体格（身長175.8cm / 62kg を Winter の人体計測値で割り付け）
     offset は親ボーンの局所座標での関節位置、dir は休め姿勢での骨の向き。
     mass は体重比、com は近位端からの重心位置（骨長比）。
     rom は [最小, 最大] 度。flex=屈曲 abd=外転/側屈 rot=回旋(内旋+/右回り+)
     ============================================================ */
  const BODY = { height: 1.758, mass: 62 };

  const BONES = [
    /* 体幹 */
    { name: 'pelvis', parent: null, offset: [0, 0, 0], dir: [0, 1, 0], len: 0.10, mass: 0.142, com: 0.4 },
    { name: 'spineL', parent: 'pelvis', offset: [-0.02, 0.08, 0], dir: [0, 1, 0], len: 0.17, mass: 0.139, com: 0.45,
      rom: { flex: [-20, 50], abd: [-25, 25], rot: [-12, 12] }, sign: { flex: -1, abd: 1, rot: -1 } },
    { name: 'spineT', parent: 'spineL', offset: [0, 0.17, 0], dir: [0, 1, 0], len: 0.16, mass: 0.108, com: 0.5,
      rom: { flex: [-12, 20], abd: [-20, 20], rot: [-20, 20] }, sign: { flex: -1, abd: 1, rot: -1 } },
    { name: 'spineC', parent: 'spineT', offset: [0, 0.16, 0], dir: [0, 1, 0], len: 0.15, mass: 0.108, com: 0.5,
      rom: { flex: [-12, 18], abd: [-15, 15], rot: [-25, 25] }, sign: { flex: -1, abd: 1, rot: -1 } },
    { name: 'neck', parent: 'spineC', offset: [0, 0.15, 0], dir: [0, 1, 0], len: 0.08, mass: 0.020, com: 0.5,
      rom: { flex: [-45, 45], abd: [-35, 35], rot: [-60, 60] }, sign: { flex: -1, abd: 1, rot: -1 } },
    { name: 'head', parent: 'neck', offset: [0, 0.08, 0], dir: [0, 1, 0], len: 0.19, mass: 0.061, com: 0.5,
      rom: { flex: [-25, 25], abd: [-15, 15], rot: [-25, 25] }, sign: { flex: -1, abd: 1, rot: -1 } },
    /* 肩甲帯と腕（右を定義して左へ鏡像） */
    { name: 'clav', side: true, parent: 'spineC', offset: [0.05, 0.10, 0.02], dir: [0, 0, 1], len: 0.16, mass: 0.005, com: 0.5,
      rom: { flex: [-20, 25], abd: [-12, 30], rot: [-5, 5] },
      sign: { flex: 'side', abd: '-side', rot: 1 }, dof: { flex: 'prot', abd: 'elev' } },
    { name: 'upperarm', side: true, parent: 'clav', offset: [-0.04, -0.005, 0.16], dir: [0, -1, 0], len: 0.30, mass: 0.028, com: 0.436,
      rom: { flex: [-60, 175], abd: [-30, 165], rot: [-95, 95] }, sign: { flex: 1, abd: '-side', rot: 'side' } },
    { name: 'forearm', side: true, parent: 'upperarm', offset: [0, -0.30, 0], dir: [0, -1, 0], len: 0.255, mass: 0.016, com: 0.430,
      rom: { flex: [-5, 148], abd: [0, 0], rot: [-20, 200] }, sign: { flex: 1, abd: 1, rot: 'side' } },
    { name: 'hand', side: true, parent: 'forearm', offset: [0, -0.255, 0], dir: [0, -1, 0], len: 0.15, mass: 0.006, com: 0.506,
      rom: { flex: [-92, 80], abd: [-22, 28], rot: [-15, 15] }, sign: { flex: 1, abd: '-side', rot: 'side' } },
    /* 脚 */
    { name: 'thigh', side: true, parent: 'pelvis', offset: [0, -0.02, 0.085], dir: [0, -1, 0], len: 0.43, mass: 0.100, com: 0.433,
      rom: { flex: [-25, 132], abd: [-28, 48], rot: [-42, 42] }, sign: { flex: 1, abd: '-side', rot: 'side' } },
    { name: 'shank', side: true, parent: 'thigh', offset: [0, -0.43, 0], dir: [0, -1, 0], len: 0.43, mass: 0.0465, com: 0.433,
      rom: { flex: [-3, 146], abd: [0, 0], rot: [-18, 18] }, sign: { flex: -1, abd: 1, rot: 'side' } },
    { name: 'foot', side: true, parent: 'shank', offset: [0, -0.43, 0], dir: [1, 0, 0], len: 0.135, mass: 0.0125, com: 0.5,
      rom: { flex: [-55, 45], abd: [-18, 18], rot: [-14, 14] }, sign: { flex: 1, abd: '-side', rot: 'side' } },
    { name: 'toes', side: true, parent: 'foot', offset: [0.135, -0.03, 0], dir: [1, 0, 0], len: 0.065, mass: 0.002, com: 0.5,
      rom: { flex: [-25, 78], abd: [0, 0], rot: [0, 0] }, sign: { flex: 1, abd: 1, rot: 1 } }
  ];

  /* 足の局所形状（足首を原点とする）: 踵・母趾球・つま先の接地点 */
  const FOOT = { ankleH: 0.075, heel: [-0.058, -0.075, 0], ball: [0.135, -0.075, 0], mtp: [0.135, -0.03, 0], tip: [0.20, -0.075, 0] };
  /* 手の局所形状（手首を原点とする）: 手のひら中心とグリップ軸 */
  const HAND = { palm: [0, -0.075, 0], palmSurf: [0.042, -0.075, 0], grip: [0, -0.085, 0] };

  /* 左右に展開したボーン表を作る */
  const RIG = { bones: {}, order: [] };
  BONES.forEach((b) => {
    const mk = (name, side) => {
      const off = b.offset.slice();
      const dir = b.dir.slice();
      if (side < 0) { off[2] = -off[2]; dir[2] = -dir[2]; }
      const sign = {};
      Object.keys(b.sign || {}).forEach((k) => {
        const s = b.sign[k];
        sign[k] = s === 'side' ? side : (s === '-side' ? -side : s);
      });
      RIG.bones[name] = {
        name, side, parent: b.parent,
        offset: off, dir, len: b.len, mass: b.mass, com: b.com,
        rom: b.rom || null, sign, dof: b.dof || null
      };
      RIG.order.push(name);
    };
    if (b.side) { mk(b.name + 'R', 1); mk(b.name + 'L', -1); } else mk(b.name, 1);
  });
  /* side 付きボーンの親名を左右つきに解決する */
  Object.values(RIG.bones).forEach((b) => {
    if (b.side && b.parent && RIG.bones[b.parent] === undefined) {
      const suf = b.side > 0 ? 'R' : 'L';
      if (RIG.bones[b.parent + suf]) b.parent = b.parent + suf;
    }
  });
  const MASS_SUM = Object.values(RIG.bones).reduce((a, b) => a + b.mass, 0);

  /* ============================================================
     順運動学
     pose.q[bone] = 局所クォータニオン、pose.root = {pos, quat}
     戻り値 frame.b[bone] = { pos（関節位置）, quat（ワールド姿勢）, tip }
     ============================================================ */
  function fk(pose) {
    const out = {};
    RIG.order.forEach((name) => {
      const b = RIG.bones[name];
      const lq = pose.q[name] || Q.id();
      if (!b.parent) {
        const rq = Q.mul(pose.root.quat || Q.id(), lq);
        out[name] = { pos: pose.root.pos.slice(), quat: rq };
      } else {
        const p = out[b.parent];
        const pos = V.add(p.pos, Q.rot(p.quat, b.offset));
        out[name] = { pos, quat: Q.mul(p.quat, lq) };
      }
      const o = out[name];
      o.tip = V.add(o.pos, Q.rot(o.quat, V.mul(b.dir, b.len)));
      o.comPos = V.add(o.pos, Q.rot(o.quat, V.mul(b.dir, b.len * b.com)));
    });
    return { b: out };
  }

  /* 局所座標の点をワールドへ */
  function at(frame, bone, local) {
    const o = frame.b[bone];
    return V.add(o.pos, Q.rot(o.quat, local));
  }

  /* 角度ドライバ（度）から局所クォータニオンを組む */
  function quatFor(boneName, drivers, prefix) {
    const b = RIG.bones[boneName];
    const key = prefix !== undefined ? prefix : boneName;
    const names = { flex: 'flex', abd: 'abd', rot: 'rot' };
    if (b.dof) Object.keys(b.dof).forEach((k) => { names[k] = b.dof[k]; });
    const get = (k) => {
      const v = drivers[key + '.' + names[k]];
      return typeof v === 'number' ? v : 0;
    };
    const s = b.sign || {};
    return Q.fromFAT(get('flex') * (s.flex || 1) * RAD,
                     get('abd') * (s.abd || 1) * RAD,
                     get('rot') * (s.rot || 1) * RAD);
  }

  /* 全ボーンぶんの局所クォータニオンを作る。IK で上書きするボーンは skip に入れる */
  function poseFromDrivers(drivers, skip) {
    const q = {};
    RIG.order.forEach((name) => {
      if (skip && skip[name]) return;
      q[name] = quatFor(name, drivers);
    });
    const d = drivers;
    const root = {
      pos: [d['pelvis.x'] || 0, d['pelvis.y'] || 0, d['pelvis.z'] || 0],
      quat: Q.fromFAT((d['pelvis.pitch'] || 0) * -RAD, (d['pelvis.roll'] || 0) * RAD, (d['pelvis.yaw'] || 0) * -RAD)
    };
    return { q, root };
  }

  /* ============================================================
     2ボーンIK: 親関節 P から末端 T へ、極ベクトル pole の側に中間関節を出す
     戻り値は上腕/大腿と前腕/下腿のワールドクォータニオン
     ============================================================ */
  function twoBoneIK(P, T, L1, L2, pole, dirLocal) {
    let d = V.sub(T, P);
    let dist = V.len(d);
    const maxd = (L1 + L2) * 0.9995, mind = Math.abs(L1 - L2) + 1e-4;
    if (dist > maxd) { d = V.mul(V.norm(d), maxd); dist = maxd; }
    if (dist < mind) { d = V.mul(V.norm(d), mind); dist = mind; }
    const u = V.norm(d);
    let v = V.sub(pole, V.mul(u, V.dot(pole, u)));
    if (V.len(v) < 1e-6) {
      v = V.sub([0, 0, 1], V.mul(u, V.dot([0, 0, 1], u)));
      if (V.len(v) < 1e-6) v = [1, 0, 0];
    }
    v = V.norm(v);
    const cosA = clamp((L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist), -1, 1);
    const a = Math.acos(cosA);
    const K = V.add(P, V.mul(V.add(V.mul(u, Math.cos(a)), V.mul(v, Math.sin(a))), L1));
    return { knee: K };
  }

  /* dirLocal を targetDir に向け、局所 Z 軸（屈曲軸）を zWorld に合わせる */
  function orientBone(dirLocal, targetDir, zWorld) {
    const d = V.norm(targetDir);
    let z = V.sub(zWorld, V.mul(d, V.dot(zWorld, d)));
    if (V.len(z) < 1e-7) {
      z = V.cross(d, [0, 1, 0]);
      if (V.len(z) < 1e-7) z = V.cross(d, [1, 0, 0]);
    }
    z = V.norm(z);
    /* 局所 X,Y,Z の行き先を作る（右手系: X = Y x Z） */
    let ix, iy, iz = z;
    if (Math.abs(dirLocal[1]) > 0.5) {            /* 骨が -Y or +Y 方向（手足・脊柱） */
      iy = dirLocal[1] > 0 ? d : V.mul(d, -1);
      ix = V.norm(V.cross(iy, iz));
    } else {                                       /* 骨が +X 方向（足・鎖骨は別処理） */
      ix = d;
      iy = V.norm(V.cross(iz, ix));
    }
    return Q.fromBasis(ix, iy, iz);
  }

  /* ============================================================
     キーフレーム補間（周期・単調三次エルミート）
     ============================================================ */
  function driverNames(m) {
    const set = {};
    Object.keys(m.base || {}).forEach((k) => { set[k] = 1; });
    (m.keys || []).forEach((k) => Object.keys(k.d || {}).forEach((n) => { set[n] = 1; }));
    return Object.keys(set);
  }

  function buildTracks(m) {
    const T = m.keys[m.keys.length - 1].t;
    const names = driverNames(m);
    const tracks = {};
    names.forEach((n) => {
      const pts = m.keys.map((k) => ({
        t: k.t,
        v: (k.d && k.d[n] !== undefined) ? k.d[n] : (m.base[n] !== undefined ? m.base[n] : 0),
        hold: !!k.hold
      }));
      /* 周期を意識した接線（値が折り返す点では 0 にして滑らかに止める） */
      const n0 = pts.length;
      pts.forEach((p, i) => {
        const prev = pts[(i - 1 + n0) % n0], next = pts[(i + 1) % n0];
        const dtp = (i === 0 ? (T - prev.t + pts[0].t) : p.t - prev.t) || 1e-6;
        const dtn = (i === n0 - 1 ? (pts[0].t + T - p.t) : next.t - p.t) || 1e-6;
        const sp = (p.v - prev.v) / dtp, sn = (next.v - p.v) / dtn;
        let tang = (sp * dtn + sn * dtp) / (dtp + dtn);
        if (p.hold || prev.hold && sp === 0 || sp * sn <= 0) tang = 0;
        p.m = tang;
      });
      tracks[n] = { pts, T };
    });
    return { tracks, T };
  }

  function sampleTrack(tr, t) {
    const pts = tr.pts, T = tr.T;
    t = ((t % T) + T) % T;
    let i = 0;
    while (i < pts.length - 1 && pts[i + 1].t <= t) i++;
    const a = pts[i], b = pts[i + 1] || pts[pts.length - 1];
    const h = (b.t - a.t) || 1e-6;
    const s = clamp((t - a.t) / h, 0, 1);
    const s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * a.v + (s3 - 2 * s2 + s) * h * (a.m || 0)
         + (-2 * s3 + 3 * s2) * b.v + (s3 - s2) * h * (b.m || 0);
  }

  function driversAt(m, t) {
    if (!m._tracks) { const r = buildTracks(m); m._tracks = r.tracks; m._T = r.T; }
    const d = {};
    Object.keys(m._tracks).forEach((n) => { d[n] = sampleTrack(m._tracks[n], t); });
    return d;
  }

  /* ============================================================
     接地スペック → 末端ボーンのワールド姿勢と接地点
     spec = { at:[x,y,z] 接触するワールド点, local:[..] その点のボーン局所座標,
              pitch/yaw/roll: 度（ドライバ名を文字列で書くと補間値を読む）, pole:[..] }
     ============================================================ */
  function specAngle(spec, key, drivers) {
    const v = spec[key];
    if (typeof v === 'string') return drivers[v] || 0;
    return v || 0;
  }
  function endQuat(spec, drivers) {
    const yaw = specAngle(spec, 'yaw', drivers), pitch = specAngle(spec, 'pitch', drivers),
          roll = specAngle(spec, 'roll', drivers);
    return Q.mul(Q.mul(Q.axis([0, 1, 0], -yaw * RAD), Q.axis([0, 0, 1], pitch * RAD)), Q.axis([1, 0, 0], roll * RAD));
  }

  /* ============================================================
     1フレームを解く
     ============================================================ */
  function solveFrame(m, t) {
    const drivers = driversAt(m, t);
    const skip = {};
    const legs = [], arms = [];
    ['R', 'L'].forEach((s) => {
      const f = m.feet && m.feet[s];
      if (f) { ['thigh', 'shank', 'foot'].forEach((b) => { skip[b + s] = 1; }); legs.push({ s, spec: f }); }
      const h = m.hands && m.hands[s];
      if (h) { ['upperarm', 'forearm', 'hand'].forEach((b) => { skip[b + s] = 1; }); arms.push({ s, spec: h }); }
    });

    let pose = poseFromDrivers(drivers, skip);
    let frame = null;

    const pass = () => {
      frame = fk(pose);
      if (m.anchor) {                    /* 指定点（膝や肩甲骨）が台から動かないよう骨盤ごと寄せる */
        const cur = at(frame, m.anchor.bone, m.anchor.local);
        pose.root.pos = V.add(pose.root.pos, V.sub(m.anchor.at, cur));
        frame = fk(pose);
      }
      const applyIK = (chain, spec, side) => {
        const rootBone = RIG.bones[chain[0]];
        const P = frame.b[chain[0]].pos;
        /* 目標点は世界座標、または「このボーンについていく」指定 */
        let anchor, relQ = null;
        if (Array.isArray(spec.at)) anchor = spec.at.slice();
        else { anchor = at(frame, spec.at.bone, spec.at.local); relQ = frame.b[spec.at.bone].quat; }
        let endW;
        if (spec.align === 'surface') {
          const n = V.norm(spec.normal || [0, -1, 0]);        /* 手のひらの向き */
          let fwd = Q.rot(frame.b[spec.faceFrom || 'spineC'].quat, [1, 0, 0]);
          fwd = V.sub(fwd, V.mul(n, V.dot(fwd, n)));
          if (V.len(fwd) < 1e-5) fwd = V.sub([1, 0, 0], V.mul(n, V.dot([1, 0, 0], n)));
          fwd = V.norm(fwd);
          if (spec.fingerYaw) {                               /* 指の向きを水平面内で回す */
            const c = Math.cos(spec.fingerYaw * RAD), sn = Math.sin(spec.fingerYaw * RAD);
            const side = V.cross(n, fwd);
            fwd = V.norm(V.add(V.mul(fwd, c), V.mul(side, sn)));
          }
          const iY = V.mul(fwd, -1);
          endW = Q.fromBasis(n, iY, V.norm(V.cross(n, iY)));
        } else {
          endW = endQuat(spec, drivers);
          if (relQ) endW = Q.mul(relQ, endW);
        }
        const endPos = V.sub(anchor, Q.rot(endW, spec.local));
        const L1 = rootBone.len, L2 = RIG.bones[chain[1]].len;
        let pole = spec.pole ? (relQ ? Q.rot(relQ, spec.pole) : spec.pole.slice()) : Q.rot(endW, [1, 0, 0]);
        const r = twoBoneIK(P, endPos, L1, L2, pole, rootBone.dir);
        const K = r.knee;
        /* 肘・膝は蝶番。曲がる面の法線を屈曲軸にすると、ねじれが混ざらない */
        let n = V.cross(V.sub(K, P), V.sub(endPos, K));
        if (V.len(n) < 1e-6) n = V.cross(V.sub(K, P), pole);
        n = V.norm(n);
        const hingeSign = (RIG.bones[chain[1]].sign || {}).flex || 1;
        const zAxis = V.mul(n, hingeSign);
        let q1 = orientBone(rootBone.dir, V.sub(K, P), zAxis);
        let q2 = orientBone(RIG.bones[chain[1]].dir, V.sub(endPos, K), zAxis);
        const parentQ = frame.b[RIG.bones[chain[0]].parent].quat;
        /* 末端（手・足）のねじれは、前腕の回内／下腿のねじれへ逃がす */
        let endLocal = Q.mul(Q.conj(q2), endW);
        const tw = Q.twistAbout(endLocal, [0, 1, 0]);
        q2 = Q.mul(q2, tw);
        endLocal = Q.mul(Q.conj(tw), endLocal);
        pose.q[chain[0]] = Q.mul(Q.conj(parentQ), q1);
        pose.q[chain[1]] = Q.mul(Q.conj(q1), q2);
        pose.q[chain[2]] = endLocal;
        frame = fk(pose);
      };
      legs.forEach((l) => applyIK(['thigh' + l.s, 'shank' + l.s, 'foot' + l.s], l.spec, l.s));
      arms.forEach((a) => applyIK(['upperarm' + a.s, 'forearm' + a.s, 'hand' + a.s], a.spec, a.s));
    };

    pass();

    /* 重心が支持面の目標点に来るよう骨盤をずらす（立位のみ） */
    if (m.balance) {
      const axes = m.balance.axes || ['x'];
      const idx = { x: 0, y: 1, z: 2 };
      for (let it = 0; it < 6; it++) {
        const com = centerOfMass(frame, m, drivers);
        const tgt = balanceTarget(frame, m, drivers);
        let moved = 0;
        axes.forEach((ax) => {
          const i = idx[ax];
          const err = com[i] - tgt[i];
          if (Math.abs(err) < 0.0008) return;
          pose.root.pos[i] -= err * 1.35;
          moved = 1;
        });
        if (!moved) break;
        pass();
      }
    }

    const com = centerOfMass(frame, m, drivers);
    return { t, drivers, pose, b: frame.b, com, contacts: contactPoints(frame, m, drivers),
             dumbbells: dumbbellPoses(frame, m, drivers), motion: m };
  }

  /* ダンベルを含む全体重心 */
  function centerOfMass(frame, m, drivers) {
    let sum = [0, 0, 0], tot = 0;
    RIG.order.forEach((n) => {
      const b = RIG.bones[n];
      sum = V.add(sum, V.mul(frame.b[n].comPos, b.mass));
      tot += b.mass;
    });
    const dbs = dumbbellPoses(frame, m, drivers);
    dbs.forEach((d) => {
      const w = (d.kg || 0) / BODY.mass;
      sum = V.add(sum, V.mul(d.pos, w));
      tot += w;
    });
    return V.mul(sum, 1 / tot);
  }

  function balanceTarget(frame, m, drivers) {
    const cs = contactPoints(frame, m, drivers).filter((c) => c.support !== false);
    if (!cs.length) return [0, 0, 0];
    let s = [0, 0, 0];
    let w = 0;
    cs.forEach((c) => { const k = c.weight === undefined ? 1 : c.weight; s = V.add(s, V.mul(c.pos, k)); w += k; });
    const c0 = V.mul(s, 1 / w);
    const off = (m.balance && m.balance.offset) || [0, 0, 0];
    return [c0[0] + off[0], c0[1] + off[1], c0[2] + off[2]];
  }

  /* ============================================================
     接地点・ダンベル・可動域
     ============================================================ */
  function contactPoints(frame, m, drivers) {
    const out = [];
    ['R', 'L'].forEach((s) => {
      const f = m.feet && m.feet[s];
      if (f) {
        const pins = f.pins || [FOOT.heel, FOOT.ball];
        pins.forEach((p, i) => out.push({ name: 'foot' + s + i, pos: at(frame, 'foot' + s, p),
          bone: 'foot' + s, local: p, support: f.support !== false }));
      }
      const h = m.hands && m.hands[s];
      if (h && h.pins) {
        h.pins.forEach((p, i) => out.push({ name: 'hand' + s + i, pos: at(frame, 'hand' + s, p),
          bone: 'hand' + s, local: p, support: h.support !== false }));
      }
    });
    (m.contacts || []).forEach((c, i) => out.push({
      name: c.name || (c.bone + i), pos: at(frame, c.bone, c.local), bone: c.bone, local: c.local,
      anchor: c.at || null, support: c.support !== false, weight: c.weight
    }));
    return out;
  }

  function dumbbellPoses(frame, m, drivers) {
    const out = [];
    (m.dumbbells || []).forEach((d) => {
      const kg = d.kg === undefined ? 5 : d.kg;
      if (d.grip === 'both') {
        const a = at(frame, 'handR', d.local || HAND.grip);
        const b = at(frame, 'handL', d.local || HAND.grip);
        const pos = V.mul(V.add(a, b), 0.5);
        const quat = d.axis === 'vertical' ? Q.axis([1, 0, 0], Math.PI / 2)
          : Q.between([0, 0, 1], V.norm(V.len(V.sub(a, b)) > 1e-4 ? V.sub(a, b) : [0, 0, 1]));
        out.push({ pos: V.add(pos, d.offset || [0, 0, 0]), quat, kg, both: true });
      } else {
        const bone = d.grip;
        const pos = at(frame, bone, d.local || HAND.grip);
        out.push({ pos: V.add(pos, d.offset || [0, 0, 0]), quat: frame.b[bone].quat, kg });
      }
    });

  function boneAngles(pose, name) {
    const b = RIG.bones[name];
    const fat = Q.toFAT(pose.q[name] || Q.id());
    const s = b.sign || {};
    return { flex: fat[0] / (s.flex || 1), abd: fat[1] / (s.abd || 1), rot: fat[2] / (s.rot || 1) };
  }

  function romCheck(pose, tol) {
    const bad = [];
    const eps = tol === undefined ? 1.5 : tol;
    RIG.order.forEach((n) => {
      const b = RIG.bones[n];
      if (!b.rom) return;
      const a = boneAngles(pose, n);
      ['flex', 'abd', 'rot'].forEach((k) => {
        const r = b.rom[k];
        if (!r) return;
        /* 360度の折り返しを考え、可動域に最も近い等価角で判定する */
        let bestV = a[k], bestD = Infinity;
        [a[k] - 360, a[k], a[k] + 360].forEach((c) => {
          const d = c < r[0] ? r[0] - c : (c > r[1] ? c - r[1] : 0);
          if (d < bestD) { bestD = d; bestV = c; }
        });
        a[k] = bestV;
        if (a[k] < r[0] - eps || a[k] > r[1] + eps) {
          bad.push({ bone: n, dof: k, value: Math.round(a[k] * 10) / 10, rom: r });
        }

<script>
/* ============================================================
   3Dマネキンの描画（three.js）
   骨格の各ボーンに、局所座標であらかじめ形を作ったメッシュを割り当て、
   1フレームごとにワールド姿勢をそのまま流し込む。
   ============================================================ */
(function (root) {
  'use strict';
  const M = root.MOTION;

  const THEME = {
    light: { body: 0xd8d3c8, body2: 0xc6c0b4, prop: 0xcfd0c8, db: 0xb23a31, shadow: 0.22,
             hemiSky: 0xffffff, hemiGround: 0x9a9384, key: 0xffffff, rim: 0xdfe6ee },
    dark:  { body: 0x9aa3ac, body2: 0x848d97, prop: 0x39424a, db: 0xd3584c, shadow: 0.35,
             hemiSky: 0xb9c6d2, hemiGround: 0x2a3138, key: 0xdfe8f2, rim: 0x7f8b96 }
  };

  /* ---- 体の形（すべてボーン局所座標。+Y は骨の向き、-Y に伸びる手足が多い） ---- */
  function capsuleGeom(THREE, r0, r1, len, dir, seg) {
    /* 円錐台＋両端の球でできた形を回転体で作る */
    const pts = [];
    const n = seg || 10;
    for (let i = 0; i <= n; i++) {                    /* 近位端の半球 */
      const a = Math.PI / 2 * i / n;
      pts.push(new THREE.Vector2(Math.cos(a) * r0, Math.sin(a) * r0));
    }
    pts.reverse();
    for (let i = 0; i <= n; i++) {                    /* 遠位端の半球 */
      const a = Math.PI / 2 * i / n;
      pts.push(new THREE.Vector2(Math.cos(a) * r1, -len - Math.sin(a) * r1));
    }
    const g = new THREE.LatheGeometry(pts.map((p) => new THREE.Vector2(Math.max(p.x, 0.0006), p.y)), 20);
    if (dir && dir[0] === 1) g.rotateZ(-Math.PI / 2);        /* +X に伸びる骨 */
    else if (dir && dir[1] > 0) g.rotateX(Math.PI);          /* +Y に伸びる骨（脊柱・首） */
    else if (dir && dir[2]) g.rotateX(dir[2] > 0 ? -Math.PI / 2 : Math.PI / 2);  /* ±Z（鎖骨） */
    g.computeVertexNormals();
    return g;
  }
  function ballGeom(THREE, rx, ry, rz, cy, cx) {
    const g = new THREE.SphereGeometry(1, 20, 14);
    g.scale(rx, ry, rz);
    g.translate(cx || 0, cy || 0, 0);
    return g;
  }

  function buildBody(THREE, mat, mat2) {
    const meshes = {};
    const add = (bone, geom, m) => {
      const mesh = new THREE.Mesh(geom, m || mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      meshes[bone] = mesh;
      return mesh;
    };
    const R = M.RIG.bones;
    /* 体幹 */
    /* 骨盤: 腰からお尻にかけて少し広がる形 */
    const hipPts = [[0.002, 0.108], [0.070, 0.106], [0.098, 0.088], [0.110, 0.045], [0.114, 0.000],
                    [0.108, -0.040], [0.086, -0.070], [0.046, -0.086], [0.002, -0.090]];
    const hipG = new THREE.LatheGeometry(hipPts.map((q) => new THREE.Vector2(q[0], q[1])), 22);
    hipG.scale(0.86, 1, 1.12);
    hipG.computeVertexNormals();
    add('pelvis', hipG);
    const ell = (g, depth, width) => { g.scale(depth, 1, width); return g; };
    add('spineL', ell(capsuleGeom(THREE, 0.100, 0.116, 0.17, [0, 1, 0]), 0.82, 1.00));
    add('spineT', ell(capsuleGeom(THREE, 0.115, 0.126, 0.16, [0, 1, 0]), 0.84, 1.16));
    add('spineC', ell(capsuleGeom(THREE, 0.127, 0.094, 0.155, [0, 1, 0]), 0.80, 1.30));
    add('neck', capsuleGeom(THREE, 0.058, 0.054, 0.075, [0, 1, 0]));
    const head = new THREE.Group();
    const skull = new THREE.Mesh(ballGeom(THREE, 0.082, 0.098, 0.088, 0.093, 0.004), mat);
    const face = new THREE.Mesh(ballGeom(THREE, 0.052, 0.062, 0.062, 0.072, 0.052), mat2);
    skull.castShadow = face.castShadow = true;
    head.add(skull); head.add(face);
    meshes.head = head;
    /* 腕（肩の三角筋・上腕・前腕・手） */
    ['R', 'L'].forEach((s) => {
      const sg = s === 'R' ? 1 : -1;
      const ua = new THREE.Group();
      const delt = new THREE.Mesh(ballGeom(THREE, 0.060, 0.064, 0.058, -0.016, -0.004), mat);
      const arm = new THREE.Mesh(capsuleGeom(THREE, 0.049, 0.041, 0.312, [0, -1, 0]), mat);
      delt.castShadow = arm.castShadow = true;
      ua.add(delt); ua.add(arm);
      meshes['upperarm' + s] = ua;
      add('forearm' + s, capsuleGeom(THREE, 0.044, 0.033, 0.265, [0, -1, 0]));
      const handG = new THREE.Group();
      const palm = new THREE.Mesh(capsuleGeom(THREE, 0.040, 0.030, 0.105, [0, -1, 0]), mat);
      palm.geometry.scale(0.62, 1, 1.12);            /* 手は平たく */
      const thumb = new THREE.Mesh(capsuleGeom(THREE, 0.018, 0.015, 0.055, [0, -1, 0]), mat);
      thumb.geometry.rotateZ(-0.5 * sg);             /* 親指は内側へ */
      thumb.geometry.rotateX(0.35 * sg);
      thumb.position.set(0.012, -0.022, sg * 0.030);
      palm.castShadow = thumb.castShadow = true;
      handG.add(palm); handG.add(thumb);
      meshes['hand' + s] = handG;
      /* 脚 */
      add('thigh' + s, capsuleGeom(THREE, 0.090, 0.059, 0.442, [0, -1, 0]));
      const shank = new THREE.Group();
      const calf = new THREE.Mesh(ballGeom(THREE, 0.056, 0.105, 0.052, -0.120, -0.008), mat);
      const shin = new THREE.Mesh(capsuleGeom(THREE, 0.057, 0.037, 0.442, [0, -1, 0]), mat);
      calf.castShadow = shin.castShadow = true;
      shank.add(shin); shank.add(calf);
      meshes['shank' + s] = shank;
      /* 足（足首から前へ。土踏まずのぶん少し持ち上げる） */
      const foot = new THREE.Group();
      const F = M.FOOT;
      const soleG = new THREE.BoxGeometry(0.185, 0.060, 0.086, 3, 1, 1);
      soleG.translate(0.040, -0.045, 0);
      const sp = soleG.attributes.position;           /* つま先側を少し細くして足らしくする */
      for (let i = 0; i < sp.count; i++) {
        const x = sp.getX(i);
        if (x > 0.09) sp.setZ(i, sp.getZ(i) * 0.86);
        if (x < -0.03) sp.setZ(i, sp.getZ(i) * 0.9);
      }
      soleG.computeVertexNormals();
      const sole = new THREE.Mesh(soleG, mat);
      const ankle = new THREE.Mesh(ballGeom(THREE, 0.045, 0.045, 0.045, -0.012, -0.012), mat);
      sole.castShadow = ankle.castShadow = true;
      sole.receiveShadow = true;
      foot.add(sole); foot.add(ankle);
      meshes['foot' + s] = foot;
      const toes = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.042, 0.074), mat);
      toes.geometry.translate(0.028, -0.023, 0);
      toes.castShadow = true;
      meshes['toes' + s] = toes;
      meshes['clav' + s] = null;                      /* 鎖骨は胸の形で表す */
    });
    return meshes;
  }

  function dumbbellGeom(THREE) {
    const g = new THREE.Group();
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.135, 12), null);
    bar.rotation.x = Math.PI / 2;
    const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.048, 14), null);
    const p2 = p1.clone();
    p1.rotation.x = p2.rotation.x = Math.PI / 2;
    p1.position.z = 0.078; p2.position.z = -0.078;
    g.add(bar); g.add(p1); g.add(p2);
    return g;
  }

  function create(THREE, canvas, opts) {
    const o = opts || {};
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(o.dpr || 2, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if (THREE.ColorManagement) THREE.ColorManagement.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace || renderer.outputColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 40);
    let theme = THEME[o.theme === 'dark' ? 'dark' : 'light'];

    const mat = new THREE.MeshStandardMaterial({ color: theme.body, roughness: 0.62, metalness: 0.02 });
    const mat2 = new THREE.MeshStandardMaterial({ color: theme.body2, roughness: 0.62, metalness: 0.02 });
    const matProp = new THREE.MeshStandardMaterial({ color: theme.prop, roughness: 0.85, metalness: 0.0 });
    const matDb = new THREE.MeshStandardMaterial({ color: theme.db, roughness: 0.45, metalness: 0.25 });

    const hemi = new THREE.HemisphereLight(theme.hemiSky, theme.hemiGround, 1.05);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(theme.key, 1.9);
    key.position.set(1.6, 2.6, 1.9);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    const cam = key.shadow.camera;
    cam.left = -1.6; cam.right = 1.6; cam.top = 2.4; cam.bottom = -0.2; cam.near = 0.5; cam.far = 7;
    scene.add(key);
    const rim = new THREE.DirectionalLight(theme.rim, 0.5);
    rim.position.set(-1.8, 1.2, -1.4);
    scene.add(rim);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: theme.shadow }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const meshes = buildBody(THREE, mat, mat2);
    Object.keys(meshes).forEach((k) => { if (meshes[k]) scene.add(meshes[k]); });

    const propGroup = new THREE.Group();
    scene.add(propGroup);
    const dbGroup = new THREE.Group();
    scene.add(dbGroup);
    const dbPool = [];

    let propSig = null;
    function setProps(props) {
      const sig = JSON.stringify(props || []);
      if (sig === propSig) return;            /* 毎コマ作り直さない */
      propSig = sig;
      while (propGroup.children.length) {
        const c = propGroup.children[0];
        propGroup.remove(c);
        if (c.geometry) c.geometry.dispose();
      }
      (props || []).forEach((p) => {
        const size = [p.max[0] - p.min[0], p.max[1] - p.min[1], p.max[2] - p.min[2]];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), matProp);
        mesh.position.set((p.max[0] + p.min[0]) / 2, (p.max[1] + p.min[1]) / 2, (p.max[2] + p.min[2]) / 2);
        mesh.castShadow = true; mesh.receiveShadow = true;
        propGroup.add(mesh);
      });
    }

    function applyFrame(frame) {
      Object.keys(meshes).forEach((name) => {
        const mesh = meshes[name];
        if (!mesh) return;
        const b = frame.b[name];
        if (!b) { mesh.visible = false; return; }
        mesh.visible = true;
        mesh.position.set(b.pos[0], b.pos[1], b.pos[2]);
        mesh.quaternion.set(b.quat[0], b.quat[1], b.quat[2], b.quat[3]);
      });
      const dbs = frame.dumbbells || [];
      while (dbPool.length < dbs.length) {
        const g = dumbbellGeom(THREE);
        g.traverse((c) => { if (c.isMesh) { c.material = matDb; c.castShadow = true; } });
        dbPool.push(g); dbGroup.add(g);
      }
      dbPool.forEach((g, i) => {
        g.visible = i < dbs.length;
        if (!g.visible) return;
        const d = dbs[i];
        g.position.set(d.pos[0], d.pos[1], d.pos[2]);
        g.quaternion.set(d.quat[0], d.quat[1], d.quat[2], d.quat[3]);
      });
    }

    /* 動作全体が枠に収まるカメラ距離と中心を求める（種目ごとに1回だけ計算） */
    const fitCache = {};
    function fitView(motion, view, aspect) {
      /* 枠合わせは種目の基準アングルで一度だけ計算する（指で回しても再計算しない） */
      const base = motion.view || {};
      const az = (base.az === undefined ? (view.az || 0) : base.az), el = (base.el === undefined ? (view.el || 0) : base.el);
      const keyc = motion.id + '|' + Math.round(az) + '|' + Math.round(el) + '|' + aspect.toFixed(2);
      if (fitCache[keyc]) return fitCache[keyc];
      const a = az * Math.PI / 180, e = el * Math.PI / 180;
      const fwd = [-Math.cos(e) * Math.sin(a), -Math.sin(e), -Math.cos(e) * Math.cos(a)];
      const right = [Math.cos(a), 0, -Math.sin(a)];
      const up = [fwd[1] * right[2] - fwd[2] * right[1], fwd[2] * right[0] - fwd[0] * right[2],
                  fwd[0] * right[1] - fwd[1] * right[0]];
      const T = M.cycleTime(motion);
      const pts = [];
      for (let i = 0; i < 9; i++) {
        const f = M.solveFrame(motion, T * i / 9);
        Object.keys(f.b).forEach((n) => { pts.push(f.b[n].pos); pts.push(f.b[n].tip); });
        (f.dumbbells || []).forEach((d) => pts.push(d.pos));
      }
      let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9, w1 = -1e9;
      const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
      pts.forEach((p) => {
        const u = dot(p, right), v = dot(p, up), w = dot(p, fwd);
        if (u < u0) u0 = u; if (u > u1) u1 = u;
        if (v < v0) v0 = v; if (v > v1) v1 = v;
        if (w > w1) w1 = w;
      });
      const pad = view.pad === undefined ? 0.16 : view.pad;
      const halfU = (u1 - u0) / 2 * (1 + pad) + 0.06, halfV = (v1 - v0) / 2 * (1 + pad) + 0.06;
      const ty = Math.tan(camera.fov * Math.PI / 360);
      const dist = Math.max(halfV / ty, halfU / (ty * aspect)) + 0.55;
      const cu = (u0 + u1) / 2, cv = (v0 + v1) / 2;
      const cw = w1 - 0;
      const shape = { halfU, halfV };
      const target = [right[0] * cu + up[0] * cv + fwd[0] * cw,
                      right[1] * cu + up[1] * cv + fwd[1] * cw,
                      right[2] * cu + up[2] * cv + fwd[2] * cw];
      return (fitCache[keyc] = { target, dist, halfU, halfV });
    }

    function setCamera(view) {
      const az = (view.az || 40) * Math.PI / 180, el = (view.el || 12) * Math.PI / 180;
      const d = view.dist || 3.4;
      const t = view.target || [0, 0.9, 0];
      camera.position.set(t[0] + Math.cos(el) * Math.sin(az) * d,
                          t[1] + Math.sin(el) * d,
                          t[2] + Math.cos(el) * Math.cos(az) * d);
      camera.lookAt(t[0], t[1], t[2]);
    }

    function setSize(w, h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function setTheme(name) {
      theme = THEME[name === 'dark' ? 'dark' : 'light'];
      wrongNow = null;
      mat.color.setHex(theme.body); mat2.color.setHex(theme.body2);
      matProp.color.setHex(theme.prop); matDb.color.setHex(theme.db);
      hemi.color.setHex(theme.hemiSky); hemi.groundColor.setHex(theme.hemiGround);
      key.color.setHex(theme.key); rim.color.setHex(theme.rim);
      ground.material.opacity = theme.shadow;
    }

    /* 「よくある崩れ」の場面は体の色を警告色に寄せる */
    function phaseWrong(motion, t) {
      let w = false;

    }

<script>
/* ============================================================
   記録1セットごとのID
   端末間で記録を突き合わせる（同じセットを二重にしない・消したセットを復活させない）ために使う。
   - 新しく記録したセット: 乱数ID + 記録時刻 at（ミリ秒）
   - IDの無い古い記録: 日付・種目・順番・中身から決まるID（どの端末で振っても同じ値になる）
   ============================================================ */
function newSetId(){
  let a, b;
  try{
    const r = crypto.getRandomValues(new Uint32Array(2));
    a = r[0]; b = r[1];
  }catch(e){
    a = Math.floor(Math.random() * 4294967296); b = Math.floor(Math.random() * 4294967296);
  }
  return "s" + Date.now().toString(36) + a.toString(36) + b.toString(36);
}
function fnv1a(str){
  let h = 0x811c9dc5;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
function legacySetId(date, ex, i, set){
  return "L" + fnv1a([date, ex, i, set.w === undefined ? "" : set.w, set.r, set.rpe || 0].join("|"));
}
/* IDや記録時刻の無いセットに値を振る（回数などの中身は変えない）。何か振ったら true */
function ensureIds(st){
  let changed = false;
  Object.keys((st && st.sessions) || {}).forEach(date=>{
    const s = st.sessions[date];
    if(!s) return;
    (s.entries || []).forEach(e=>{
      (e.sets || []).forEach((set, i)=>{
        if(!set.id){ set.id = legacySetId(date, e.ex, i, set); changed = true; }
        if(set.at === undefined){ set.at = i; changed = true; }
      });
    });
  });
  return changed;
}

/* 既定メニュー（週3・全身） */
const DEFAULT_PROGRAM = ["goblet","rdl","row","ohp","deadbug"];

/* ============================================================
   保存層（ローカル版）: この端末の中だけで完結する。外部通信なし。
   記録は localStorage に置き、JSON のバックアップで端末間を移す。
   ============================================================ */
const LS = "trainlog.v1";
let state = { sessions:{}, program: DEFAULT_PROGRAM.slice() };
let lastSaved = "";

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){
      const o = JSON.parse(raw);
      state.sessions = o.sessions||{};
      state.program = o.program||DEFAULT_PROGRAM.slice();
      state.gear = readGear(o.gear);          /* 持っているダンベル（旧形式は読み替える） */
      ensureIds(state);                       /* 古い記録にもセットごとのIDを振る */
    }
  }catch(e){}
}
function saveLocal(){
  try{
    localStorage.setItem(LS, JSON.stringify(state));
    lastSaved = new Date().toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"});
    setStatus("この端末に保存しています（最終保存 " + lastSaved + "）");
  }catch(e){
    setStatus("保存できませんでした。ブラウザの保存領域がいっぱいか、履歴の保存が止められています");
  }
}
function setStatus(t){
  const el = document.getElementById("status");
  if(el) el.textContent = t;
}

async function initStore(){
  loadLocal();
  render();
  const n = Object.keys(state.sessions).length;
  setStatus(n ? "この端末に保存しています（" + n + "日分）" : "この端末に保存しています");
  /* 自動バックアップ: 直近の状態をもう1つ別キーに置いておく */
  try{ localStorage.setItem(LS + ".bak", localStorage.getItem(LS) || ""); }catch(e){}
}

function persistSession(date){
  if(state.sessions[date]) state.sessions[date].updatedAt = Date.now();
  saveLocal();
}
function persistProgram(){
  saveLocal();
}

/* ファイル書き出し（ブラウザのダウンロード） */
async function saveFile(filename, text){
  try{
    const blob = new Blob([text], {type: "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}

/* ---- バックアップ（JSON） ---- */
function backupJSON(){
  return JSON.stringify({ app:"trainlog", version:1, savedAt:new Date().toISOString(),
                          sessions: state.sessions, program: state.program, gear: state.gear }, null, 1);
}
async function backupSave(){
  const ok = await saveFile("trainlog-backup-" + TODAY + ".json", backupJSON());
  if(!ok){
    sheetInner.innerHTML = `<h4>バックアップ（コピーして保存）</h4>
      <textarea style="min-height:280px" readonly>${backupJSON().replace(/</g,"&lt;")}</textarea>
      <div class="rowbtns"><button data-close="1">閉じる</button></div>`;
    sheetInner.querySelector("[data-close]").onclick = ()=> sheet.classList.remove("on");
    sheet.classList.add("on");
  }
}
function applyBackup(text){
  let o = null;
  try{ o = JSON.parse(text); }catch(e){ alert("バックアップを読めませんでした（JSONの形式が違います）"); return; }
  if(!o || typeof o !== "object" || !o.sessions){ alert("このファイルはこのアプリのバックアップではないようです"); return; }
  const days = Object.keys(o.sessions).length;
  const merge = typeof mergeState === "function";
  if(!confirm("バックアップから " + days + "日分を取り込みます。" + (merge
      ? "同じ日付の記録は、この端末の記録とまとめます（どちらかにしかないセットも残ります）。"
      : "同じ日付の記録は取り込んだ内容で置き換えます。") + "よろしいですか？")) return;
  const incoming = {sessions: o.sessions, gear: readGear(o.gear)};
  ensureIds(incoming);
  if(merge){
    const m = mergeState(state, incoming);
    state.sessions = m.sessions;
    if(m.gear) state.gear = m.gear;
  }else{
    Object.keys(incoming.sessions).forEach(d=>{ state.sessions[d] = incoming.sessions[d]; });
    if(incoming.gear) state.gear = incoming.gear;
  }
  if(Array.isArray(o.program) && o.program.length) state.program = o.program;
  saveLocal();
  render();
  setStatus(days + "日分を取り込みました");
}
function backupLoad(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json,text/plain";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=> applyBackup(String(r.result || ""));
    r.readAsText(f);
  };
  inp.click();
}
/* ファイル選択が使えない環境用に、貼り付けでも取り込めるようにする */
function backupPaste(){
  sheetInner.innerHTML = `<h4>バックアップを貼り付けて取り込む</h4>
    <p class="lastline" style="margin-top:0">書き出したJSONをそのまま貼り付けてください。</p>
    <textarea id="bkpaste" style="min-height:220px" placeholder='{"app":"trainlog",...}'></textarea>
    <div class="rowbtns"><button data-go="1">取り込む</button><button data-close="1">閉じる</button></div>`;
  sheetInner.querySelector("[data-go]").onclick = ()=>{
    applyBackup(sheetInner.querySelector("#bkpaste").value);
    sheet.classList.remove("on");
  };
  sheetInner.querySelector("[data-close]").onclick = ()=> sheet.classList.remove("on");
  sheet.classList.add("on");
}

/* 履歴タブの書き出しカードに足すボタン */
function storeButtons(){
  return `<div class="rowbtns">
      <button data-act="backup">バックアップを保存</button>
      <button data-act="restore">バックアップから復元</button>
      <button data-act="restorepaste">貼り付けて復元</button>
    </div>
    <p class="lastline">共有を設定していない場合、記録はこの端末の中だけにあります。機種変更やブラウザの掃除で消えるので、ときどきバックアップを保存してください。</p>`;
}

/* ============================================================
   同期（GitHub）: この端末と、利用者自身の非公開GitHubリポジトリの trainlog.json を
   突き合わせて、スマホとPCで記録を共有する。

   前提（環境が用意するグローバル。ここでは定義しない）:
     state        { sessions:{date:session}, program:[...], gear? }
     saveLocal()  state を localStorage に書く（同期は走らない）
     render()     #view を今のタブで描き直す
     setStatus(t) 画面下のステータス行
     ensureIds(st) / newSetId()  src/ids.js

   トップレベルでは document / window / localStorage に触れない（関数の中でだけ使う）。
   classic script。import/export なし。var は Bun の node:vm からも直接触れるように。
   ============================================================ */

var SYNC_LS_KEY = "trainlog.sync.v1";
var SYNC_API_OVERRIDE_KEY = "trainlog.sync.api";
var SYNC_LAST_KEY = "trainlog.sync.lastAt";
var SYNC_REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
var SYNC_BACKOFF_MS = [800, 1600];

/* メモ・ダンベル設定の変更から同期までの待ち時間（入力中に何度も送らないため）。テストから縮めて使う */
var SYNC_TUNE = { debounce: 4000 };

var syncStatusText = "";
var syncRunning = false;
var syncRerunRequested = false;
var syncDebounceTimer = null;
var syncRenderPending = false;

/* ============================================================
   設定の保存（localStorage["trainlog.sync.v1"] = {repo, token}）
   ============================================================ */
function syncApiBase(){
  try{
    var v = localStorage.getItem(SYNC_API_OVERRIDE_KEY);
    /* テスト用の差し替えは、この端末の中のサーバー（localhost）だけ受け付ける。鍵を外へ送らないため */
    if(v && /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(v)) return v;
  }catch(e){}
  return "https://api.github.com";
}
function syncLoadConfig(){
  try{
    var raw = localStorage.getItem(SYNC_LS_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || typeof o !== "object" || !o.repo || !o.token) return null;
    return { repo: String(o.repo), token: String(o.token) };
  }catch(e){ return null; }
}
function syncSaveConfig(cfg){
  try{ localStorage.setItem(SYNC_LS_KEY, JSON.stringify({ repo: cfg.repo, token: cfg.token })); }catch(e){}
}
function syncClearConfig(){
  try{ localStorage.removeItem(SYNC_LS_KEY); }catch(e){}
  try{ localStorage.removeItem(SYNC_LAST_KEY); }catch(e){}
}
function syncLastDisplay(){
  try{
    var raw = localStorage.getItem(SYNC_LAST_KEY);
    var t = raw ? parseInt(raw, 10) : 0;
    if(!t) return "";
    return new Date(t).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  }catch(e){ return ""; }
}

/* ============================================================
   base64 ⇔ UTF-8（GitHub Contents API は base64。大きなデータでも
   call stack を溢れさせないよう String.fromCharCode をチャンクに分ける）
   ============================================================ */
function syncUtf8ToBase64(str){
  var bytes = new TextEncoder().encode(str);
  var binary = "";
  var chunk = 0x8000;
  for(var i = 0; i < bytes.length; i += chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
function syncBase64ToUtf8(b64){
  var cleaned = String(b64 || "").replace(/[\r\n]/g, "");
  var binary = atob(cleaned);
  var bytes = new Uint8Array(binary.length);
  for(var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ============================================================
   正準化した JSON（オブジェクトのキーだけをソートする。配列の順は保持する）。
   「何か変わったか」はこれで比較する。参照ではなく中身で見る。
   ============================================================ */
function syncCanon(v){
  if(Array.isArray(v)) return v.map(syncCanon);
  if(v && typeof v === "object"){
    var out = {};
    Object.keys(v).sort().forEach(function(k){
      if(v[k] !== undefined) out[k] = syncCanon(v[k]);
    });
    return out;
  }
  return v;
}
function stableKey(obj){
  return JSON.stringify(syncCanon(obj));
}
function syncCloneDeep(v){
  if(v === undefined || v === null) return v;
  return JSON.parse(JSON.stringify(v));
}

/* ============================================================
   マージ本体。純関数：引数を書き換えない。
   mergeState は同期からも、バックアップ取り込み（applyBackup）からも呼ばれる。
   ============================================================ */
function mergeState(local, remote){
  var a = syncCloneDeep(local) || {};
  var b = syncCloneDeep(remote) || {};
  a.sessions = a.sessions || {};
  b.sessions = b.sessions || {};
  ensureIds(a);
  ensureIds(b);

  var dateSet = {};
  Object.keys(a.sessions).forEach(function(d){ dateSet[d] = true; });
  Object.keys(b.sessions).forEach(function(d){ dateSet[d] = true; });

  var sessions = {};
  Object.keys(dateSet).forEach(function(date){
    var sa = a.sessions[date], sb = b.sessions[date];
    sessions[date] = (sa && sb) ? syncMergeSession(sa, sb) : (sa || sb);
  });

  return { sessions: sessions, gear: syncMergeGear(a.gear, b.gear) };
}

/* del は集合として意味を持つだけで順序は決まっていない。ソートしておかないと
   マージの向き（どちらを local と呼ぶか）で並びが変わり、正準JSONの比較が
   食い違って延々とpushし合う羽目になる。 */
function syncUnionIds(a, b){
  var seen = {}, out = [];
  (a || []).concat(b || []).forEach(function(id){
    if(id !== undefined && id !== null && !seen[id]){ seen[id] = true; out.push(id); }
  });
  out.sort();
  return out;
}

function syncMergeSession(a, b){
  var date = a.date || b.date;
  var del = syncUnionIds(a.del, b.del);
  var delLookup = {};
  del.forEach(function(id){ delLookup[id] = true; });

  /* entries の並び: a のエントリ、続けて a に無い ex を持つ b のエントリ。
     ※ 仕様どおりの非対称な規則。両端末が同じ日に別々の新しい種目を足すと
     並び順そのものは端末ごとに食い違ったままになり得るが、セットの中身（データ）
     は id で正しく収束する。並びだけの食い違いは無害（表示は日付・種目名基準）。 */
  var aMap = {}, order = [];
  (a.entries || []).forEach(function(e){
    if(!(e.ex in aMap)) order.push(e.ex);
    aMap[e.ex] = e;
  });
  var bMap = {};
  (b.entries || []).forEach(function(e){
    if(!(e.ex in bMap)) bMap[e.ex] = e;
    if(!(e.ex in aMap) && order.indexOf(e.ex) === -1) order.push(e.ex);
  });

  var entries = [];
  order.forEach(function(ex){
    var ea = aMap[ex], eb = bMap[ex];
    var setMap = {};
    (eb ? eb.sets || [] : []).forEach(function(s){ setMap[s.id] = s; });
    (ea ? ea.sets || [] : []).forEach(function(s){ setMap[s.id] = s; }); /* 同じidは a が勝つ */
    var sets = Object.keys(setMap).map(function(id){ return setMap[id]; })
      .filter(function(s){ return !delLookup[s.id]; });
    sets.sort(function(x, y){
      var ax = x.at === undefined ? 0 : x.at, ay = y.at === undefined ? 0 : y.at;
      if(ax !== ay) return ax - ay;
      var xi = String(x.id), yi = String(y.id);
      return xi < yi ? -1 : (xi > yi ? 1 : 0);
    });
    if(sets.length > 0 || ea) entries.push({ ex: ex, sets: sets });
  });

  var noteAtA = a.noteAt || 0, noteAtB = b.noteAt || 0;
  var noteWinner = noteAtB > noteAtA ? b : a;

  var hasPlanA = a.plan !== undefined, hasPlanB = b.plan !== undefined;
  var planWinner = null;
  if(hasPlanA && hasPlanB){
    var planAtA = a.planAt === undefined ? Infinity : a.planAt;
    var planAtB = b.planAt === undefined ? Infinity : b.planAt;
    planWinner = planAtB < planAtA ? b : a;
  }else if(hasPlanA){ planWinner = a; }
  else if(hasPlanB){ planWinner = b; }

  var merged = { date: date, entries: entries };
  if(del.length) merged.del = del;
  if(a.note !== undefined || b.note !== undefined) merged.note = noteWinner.note;
  if(noteWinner.noteAt !== undefined) merged.noteAt = noteWinner.noteAt;
  if(planWinner){
    merged.plan = planWinner.plan;
    if(planWinner.planAt !== undefined) merged.planAt = planWinner.planAt;
  }
  var routine = a.routine || b.routine;
  if(routine !== undefined) merged.routine = routine;
  var updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  if(updatedAt) merged.updatedAt = updatedAt;
  return merged;
}

/* gear は丸ごと勝ち負け（中身の形は問わない。updatedAt だけ見る）。
   両者とも updatedAt が無い/同じなら local(a) を残す。 */
function syncMergeGear(a, b){
  var atA = (a && a.updatedAt) || 0;
  var atB = (b && b.updatedAt) || 0;
  if(atB > atA) return b;
  if(a) return a;
  return b;
}

/* ============================================================
   エラー分類とメッセージ（日本語）
   ============================================================ */
function syncErrorMessage(kind){
  switch(kind){
    case "auth": return "鍵が無効か期限切れです。GitHubで作り直して入れ直してください";
    case "forbidden": return "鍵にこのリポジトリへの書き込み権限がありません（Contents を Read and write に）";
    case "repo404": return "リポジトリが見つかりません。名前と、鍵で選んだリポジトリを確認してください";
    case "public": return "公開リポジトリなので保存しません。非公開（Private）のリポジトリを指定してください";
    case "network": return "通信できませんでした。次に起動したときや記録したときに、まとめて同期します";
    case "conflict": return "同期が混み合っています。少し待ってからもう一度お試しください";
    case "badformat": return "リポジトリの trainlog.json がこのアプリの形式ではありません";
    case "progress": return "同期しています…";
    case "needrepo": return "リポジトリと鍵の両方を入力してください";
    case "badrepo": return "リポジトリは「ユーザー名/リポジトリ名」の形式で入力してください";
    default: return "エラーが発生しました。しばらくしてからお試しください";
  }
}
function syncMakeError(kind, cause){
  var err = new Error(syncErrorMessage(kind));
  err.syncKind = kind;
  err.cause = cause;
  return err;
}

/* ============================================================
   GitHub REST（Contents API）
   ============================================================ */
function syncContentsUrl(repo){
  return syncApiBase() + "/repos/" + repo + "/contents/trainlog.json";
}
function syncHeaders(token, extra){
  var h = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k)) h[k] = extra[k]; } }
  return h;
}

async function syncCheckRepo(repo, token){
  var res;
  try{
    res = await fetch(syncApiBase() + "/repos/" + repo, { headers: syncHeaders(token), cache: "no-store" });
  }catch(e){ throw syncMakeError("network", e); }
  if(res.status === 401) throw syncMakeError("auth");
  if(res.status === 404) throw syncMakeError("repo404");
  if(res.status === 403) throw syncMakeError("forbidden");
  if(!res.ok) throw syncMakeError("network");
  var data;
  try{ data = await res.json(); }catch(e){ throw syncMakeError("network", e); }
  if(data.private !== true) throw syncMakeError("public");
  return true;
}

async function syncPull(cfg){
  var url = syncContentsUrl(cfg.repo);
  var res;
  try{
    res = await fetch(url, { headers: syncHeaders(cfg.token), cache: "no-store" });
  }catch(e){ throw syncMakeError("network", e); }
  if(res.status === 404) return { remote: null, sha: null };
  if(res.status === 401) throw syncMakeError("auth");
  if(res.status === 403) throw syncMakeError("forbidden");
  if(!res.ok) throw syncMakeError("network");
  var data;
  try{ data = await res.json(); }catch(e){ throw syncMakeError("network", e); }

  var text;
  if(!data.content || data.encoding === "none"){
    var raw;
    try{
      raw = await fetch(url, { headers: syncHeaders(cfg.token, { "Accept": "application/vnd.github.raw+json" }), cache: "no-store" });
    }catch(e){ throw syncMakeError("network", e); }
    if(!raw.ok) throw syncMakeError("network");
    text = await raw.text();
  }else{
    text = syncBase64ToUtf8(data.content);
  }

  var parsed;
  try{ parsed = JSON.parse(text); }catch(e){ throw syncMakeError("badformat", e); }
  if(!parsed || parsed.app !== "trainlog") throw syncMakeError("badformat");
  return { remote: parsed, sha: data.sha };
}

async function syncPush(cfg, payloadObj, sha){
  var url = syncContentsUrl(cfg.repo);
  var body = { message: "記録を同期", content: syncUtf8ToBase64(JSON.stringify(payloadObj)) };
  if(sha) body.sha = sha;
  var res;
  try{
    res = await fetch(url, {
      method: "PUT",
      headers: syncHeaders(cfg.token, { "Content-Type": "application/json" }),
      cache: "no-store",
      body: JSON.stringify(body)
    });
  }catch(e){ throw syncMakeError("network", e); }
  if(res.status === 401) throw syncMakeError("auth");
  if(res.status === 403) throw syncMakeError("forbidden");
  if(res.status === 409 || res.status === 422) throw syncMakeError("conflict");
  if(!res.ok) throw syncMakeError("network");
  var data = null;
  try{ data = await res.json(); }catch(e){}
  return { sha: (data && data.content) ? data.content.sha : null };
}

/* ============================================================
   ステータス表示（カード内の #syncStatus に直接反映。フル render は呼ばない）
   ============================================================ */
function syncUpdateStatusEl(text){
  syncStatusText = text;
  try{
    var el = document.getElementById("syncStatus");
    if(el) el.textContent = text;
  }catch(e){}
}

/* 編集中の入力を巻き戻さないための安全な再描画。
   #view 内の INPUT/TEXTAREA/SELECT にフォーカスがあれば、focusout まで待つ。 */
function syncIsEditableFocus(){
  try{
    var el = document.activeElement;
    if(!el) return false;
    var tag = (el.tagName || "").toUpperCase();
    if(tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") return false;
    var view = document.getElementById("view");
    return !!(view && view.contains && view.contains(el));
  }catch(e){ return false; }
}
function syncSafeRender(){
  if(syncIsEditableFocus()){
    if(!syncRenderPending){
      syncRenderPending = true;
      try{
        var view = document.getElementById("view");
        if(view && view.addEventListener){
          var handler = function(){
            view.removeEventListener("focusout", handler);
            syncRenderPending = false;
            render();
          };
          view.addEventListener("focusout", handler);
        }else{
          syncRenderPending = false;
        }
      }catch(e){ syncRenderPending = false; }
    }
    return;
  }
  try{ render(); }catch(e){}
}

/* ============================================================
   同期本体
   ============================================================ */
function syncDelay(ms){
  return new Promise(function(resolve){ setTimeout(resolve, ms); });
}

async function syncAttempt(cfg){
  var pulled = await syncPull(cfg);
  var remote = pulled.remote, sha = pulled.sha;

  var localSnapshot = { sessions: state.sessions, gear: state.gear };
  var merged = mergeState(localSnapshot, remote || { sessions: {}, gear: undefined });

  var localKey = stableKey(localSnapshot);
  var mergedKey = stableKey(merged);
  if(mergedKey !== localKey){
    state.sessions = merged.sessions;
    state.gear = merged.gear;
    saveLocal();
    syncSafeRender();
  }

  var remoteForCompare = { sessions: (remote && remote.sessions) || {}, gear: remote && remote.gear };
  var remoteKey = stableKey(remoteForCompare);
  if(mergedKey !== remoteKey){
    var payload = { app: "trainlog", format: 1, savedAt: new Date().toISOString(), sessions: merged.sessions, gear: merged.gear };
    await syncPush(cfg, payload, sha);
  }

  syncOnSuccess();
}

function syncOnSuccess(){
  var hhmm = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  try{ localStorage.setItem(SYNC_LAST_KEY, String(Date.now())); }catch(e){}
  syncUpdateStatusEl("GitHubと同期しました（" + hhmm + "）");
  setStatus("この端末とGitHubに保存しています（同期 " + hhmm + "）");
}
function syncReportError(err){
  syncUpdateStatusEl((err && err.message) || syncErrorMessage("network"));
}

async function syncRunOnce(cfg){
  syncUpdateStatusEl(syncErrorMessage("progress"));
  var lastErr = null;
  for(var attempt = 0; attempt < 3; attempt++){
    if(attempt > 0) await syncDelay(SYNC_BACKOFF_MS[attempt - 1]);
    try{
      await syncAttempt(cfg);
      return;
    }catch(e){
      lastErr = e;
      if(!e || e.syncKind !== "conflict") break;
    }
  }
  syncReportError(lastErr);
}

/* 二重起動防止：実行中なら「終わったらもう一回」の印だけ残す */
async function syncNow(){
  var cfg = syncLoadConfig();
  if(!cfg) return;
  if(syncRunning){ syncRerunRequested = true; return; }
  /* 今から同期するので、入力待ちの同期は取り消す（その変更も今回まとめて送る） */
  if(syncDebounceTimer){ clearTimeout(syncDebounceTimer); syncDebounceTimer = null; }
  syncRunning = true;
  try{
    await syncRunOnce(cfg);
  }finally{
    syncRunning = false;
    if(syncRerunRequested){
      syncRerunRequested = false;
      syncNow();
    }
  }
}

/* ============================================================
   デバウンス起動・定期実行
   ============================================================ */
function syncSchedule(){
  var cfg = syncLoadConfig();
  if(!cfg) return;
  if(syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(function(){
    syncDebounceTimer = null;
    syncNow();
  }, SYNC_TUNE.debounce);
}
function syncFlushPending(){
  if(syncDebounceTimer){
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = null;
    syncNow();
  }
}

/* 同期するのは次のときだけ（本人の指定）:
     起動したとき（ここ）/ セットを記録・修正で消したとき（画面側から syncNow）/
     メモ・ダンベル設定を変えたとき（画面側から syncSchedule）。
   画面を離れるときは、入力待ちの同期が残っていれば取りこぼさないようその場で送る。 */
function syncInit(){
  if(syncLoadConfig()) syncNow();
  try{
    document.addEventListener("visibilitychange", function(){ if(document.hidden) syncFlushPending(); });
  }catch(e){}
  try{ window.addEventListener("pagehide", function(){ syncFlushPending(); }); }catch(e){}
}

/* ============================================================
   接続・解除
   ============================================================ */
async function syncConnect(repoRaw, tokenRaw){
  var repo = String(repoRaw || "").trim();
  var token = String(tokenRaw || "").trim();
  if(!repo || !token){ syncUpdateStatusEl(syncErrorMessage("needrepo")); return false; }
  if(!SYNC_REPO_RE.test(repo)){ syncUpdateStatusEl(syncErrorMessage("badrepo")); return false; }

  syncUpdateStatusEl(syncErrorMessage("progress"));
  try{
    await syncCheckRepo(repo, token);
  }catch(e){
    syncUpdateStatusEl((e && e.message) || syncErrorMessage("network"));
    return false;
  }

  syncSaveConfig({ repo: repo, token: token });
  syncUpdateStatusEl("");
  render();
  await syncNow();
  return true;
}
function syncDisconnect(){
  var ok = true;
  try{ ok = confirm("同期を解除しますか？記録はこの端末には残ります。"); }catch(e){ ok = true; }
  if(!ok) return;
  syncClearConfig();
  syncStatusText = "";
  render();
}

/* ============================================================
   UI（履歴タブに置くカード）
   ============================================================ */
function syncEsc(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============================================================
   日付など
   ============================================================ */
function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(k){
  const [y,m,d] = k.split("-").map(Number);
  const wd = ["日","月","火","水","木","金","土"][new Date(y,m-1,d).getDay()];
  return m+"月"+d+"日("+wd+")";
}
function asDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function daysAgo(k){
  return Math.round((asDate(todayKey()) - asDate(k)) / 86400000);
}
let TODAY = todayKey();
/* アプリを開いたまま日付が変わっていたら、今日に切り替える（前日の記録はそのまま残る）。切り替えたら true */
function rollDay(){
  const k = todayKey();
  if(k === TODAY) return false;
  TODAY = k;
  openEx = null; editEx = null;
  return true;
}

function session(date){

  const s = session(date);
  let e = s.entries.find(x=>x.ex===exId);
  if(!e && create){ e = {ex:exId, sets:[]}; s.entries.push(e); }
  return e;
}
