<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレーニング記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEFE9;
  --panel:#FFFFFF;
  --panel-2:#F7F7F2;
  --ink:#1A2430;
  --ink-2:#5A6774;
  --ink-3:#8C97A1;
  --rule:#D6D8D0;
  --muscle:#B23A31;
  --muscle-2:#8A2B24;
  --neutral-fill:#DBDCD4;
  --neutral-stroke:#C4C6BD;
  --done:#2F6B4F;
  --shadow:0 1px 0 rgba(26,36,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13171B;
    --panel:#1A1F25;
    --panel-2:#20262D;
    --ink:#E9E9E2;
    --ink-2:#9BA6B0;
    --ink-3:#6E7A85;
    --rule:#2B333A;
    --muscle:#D3584C;
    --muscle-2:#E8796D;
    --neutral-fill:#2C333A;
    --neutral-stroke:#3A434B;
    --done:#4F9C77;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#13171B;
  --panel:#1A1F25;
  --panel-2:#20262D;
  --ink:#E9E9E2;
  --ink-2:#9BA6B0;
  --ink-3:#6E7A85;
  --rule:#2B333A;
  --muscle:#D3584C;
  --muscle-2:#E8796D;
  --neutral-fill:#2C333A;
  --neutral-stroke:#3A434B;
  --done:#4F9C77;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.num{font-family:"Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.wrap{max-width:620px;margin:0 auto;padding:0 16px 96px}

/* ---- header ---- */
header{padding:22px 0 12px;display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
header .date{margin-left:auto;font-size:13px;color:var(--ink-2)}
.themebtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}

/* ---- tabs ---- */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:20px;overflow-x:auto}
nav.tabs button{
  background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--muscle)}

/* ---- hero ---- */
.hero{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero .kicker{font-size:12px;color:var(--ink-3);margin:0 0 2px}
.hero h2{margin:0 0 10px;font-size:20px;font-weight:700}
.bigset{display:flex;align-items:baseline;gap:6px}
.bigset .v{font-size:46px;font-weight:700;line-height:1}
.bigset .x{font-size:22px;color:var(--ink-3);font-weight:500}
.bigset .u{font-size:15px;color:var(--ink-2);align-self:flex-end;padding-bottom:5px}
.hero .sub{font-size:13px;color:var(--ink-2);margin-top:6px}

/* ---- exercise cards ---- */
.exrow{background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:10px;overflow:hidden}
.exrow.done{border-color:var(--done)}
.exhead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;background:none;border:none;text-align:left}
.exhead .nm{font-weight:600;font-size:15px}
.exhead .meta{font-size:12px;color:var(--ink-2);margin-top:1px}
.exhead .cnt{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.exrow.done .cnt{color:var(--done);font-weight:600}
.exbody{padding:0 14px 14px;border-top:1px solid var(--rule)}

.setline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.setline:last-of-type{border-bottom:none}
.setline .i{width:22px;color:var(--ink-3);font-size:12px}
.setline .val{font-weight:600}
.setline .rpe{margin-left:auto;font-size:12px;color:var(--ink-2)}
.setline .del{background:none;border:none;color:var(--ink-3);padding:2px 6px;font-size:16px;line-height:1}

.entry{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--ink-3)}
.stepper{display:flex;align-items:center;border:1px solid var(--rule);border-radius:3px;background:var(--panel-2)}
.stepper button{background:none;border:none;width:32px;height:38px;font-size:17px;color:var(--ink-2)}
.stepper input{
  width:52px;height:38px;border:none;background:none;text-align:center;
  font-family:"Archivo",system-ui,sans-serif;font-size:17px;font-weight:600;color:var(--ink);
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addbtn{background:var(--ink);color:var(--paper);border:none;border-radius:3px;height:38px;padding:0 18px;font-weight:700;font-size:14px}
.addbtn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule);font-weight:600}

.hint{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:2px solid var(--muscle);padding:8px 10px;margin-top:12px;border-radius:0 3px 3px 0}
.lastline{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.lastline b{color:var(--ink);font-family:"Archivo",system-ui,sans-serif}

/* ---- rest timer ---- */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:none;align-items:center;gap:14px;padding:11px 18px;z-index:50}
.timer.on{display:flex}
.timer .t{font-family:"Archivo",system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em}
.timer .lb{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.timer .lb b{font-size:12.5px;font-weight:600;opacity:.75}
.timer .lb small{font-size:12px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button+button{margin-left:0}
.timer button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:3px;padding:5px 12px;font-size:13px;white-space:nowrap;flex:0 0 auto}

/* ---- body figure ---- */
.figs{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.figwrap{flex:1;max-width:190px;text-align:center}
.figwrap .cap{font-size:11px;color:var(--ink-3);margin-top:2px}
svg.fig{width:100%;height:auto;display:block}
svg.fig .nt{fill:var(--neutral-fill);opacity:.55}
svg.fig .rg{fill:var(--neutral-fill);stroke:var(--neutral-stroke);stroke-width:.8;transition:fill .18s}
svg.fig .rg.sel{stroke:var(--ink);stroke-width:1.6}
svg.fig.clickable .rg{cursor:pointer}

.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend .bar{width:96px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--neutral-fill),var(--muscle))}

.mlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.p{background:var(--muscle);border-color:var(--muscle);color:#fff}
.chip.s{border-color:var(--muscle);color:var(--muscle)}

/* ---- generic blocks ---- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:12px}
h3.sec{font-size:13px;font-weight:700;color:var(--ink-2);margin:26px 0 10px}
.card h4{margin:0 0 8px;font-size:15px;font-weight:700}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:5px;font-size:14px}
.warn{color:var(--muscle)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{font-size:14px;padding-left:15px;position:relative;margin-bottom:5px}
ul.plain li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:1.5px;background:var(--ink-3)}

table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--rule)}
table.hist td{padding:6px;border-bottom:1px solid var(--rule)}
table.hist td.n{font-family:"Archivo",system-ui,sans-serif;font-weight:600;text-align:right;white-space:nowrap}

.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin:8px 0 2px}
.spark i{flex:1;background:var(--muscle);opacity:.8;border-radius:1px 1px 0 0;min-height:2px}

.empty{color:var(--ink-2);font-size:14px;padding:26px 4px;text-align:center}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rowbtns button{background:none;border:1px solid var(--rule);border-radius:3px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}

select,textarea,input[type=text]{
  font:inherit;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--rule);border-radius:3px;padding:8px 10px;width:100%;
}
textarea{min-height:64px;resize:vertical}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:var(--paper);width:100%;max-width:620px;max-height:86vh;overflow-y:auto;border-radius:10px 10px 0 0;padding:18px 16px 30px}
.sheet .inner h4{margin:0 0 12px;font-size:16px}
.picklist{display:flex;flex-direction:column;gap:6px}
.picklist button{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;text-align:left;font-size:14px;font-weight:600}
.picklist button span{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}

.status{font-size:11.5px;color:var(--ink-3);text-align:center;padding:14px 0 0}
.overflowx{overflow-x:auto}

/* ---- movement diagrams ---- */
.diapair{display:flex;align-items:center;gap:4px;margin:2px 0 0}
.diacell{flex:1;min-width:0;text-align:center}
.diacell svg,.diasolo svg{width:100%;height:auto;display:block}
.diasolo{max-width:76%;margin:0 auto}
.diahint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:2px 0 0}
.dialab{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.diaarrow{color:var(--ink-3);font-size:19px;line-height:1;flex:0 0 auto;padding:0 2px}
.fg-body{fill:var(--ink)}
.fg-far{fill:var(--ink);opacity:.4}
.fg-ghost{opacity:.14}
.fg-halo{fill:var(--panel);stroke:var(--panel);stroke-width:2.8;stroke-linejoin:round}
.fg-db{fill:var(--muscle)}
.fg-prop{fill:var(--neutral-fill);stroke:var(--neutral-stroke);stroke-width:1.5}
.fg-floor{stroke:var(--neutral-stroke);stroke-width:2;stroke-linecap:round}
.dianote{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.diahold{font-size:12px;color:var(--ink-2);margin:9px 0 0;padding:7px 9px;background:var(--panel-2);border-radius:3px}
.diahold b{color:var(--ink-3);font-size:10.5px;font-weight:700}
.rswitch{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.rswitch button{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3}
.rswitch button b{font-family:"Archivo",system-ui,sans-serif;font-size:16px;color:var(--ink-3)}
.rswitch button span{font-size:10.5px;color:var(--ink-3)}
.rswitch button.on{border-color:var(--muscle);background:var(--panel)}
.rswitch button.on b{color:var(--muscle)}
.rswitch button.on span{color:var(--ink)}
.side{font-size:10px;color:var(--muscle);border:1px solid var(--muscle);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--panel-2);
  border-left:2px solid var(--muscle);padding:9px 11px;margin-top:12px;border-radius:0 3px 3px 0}
.target .tl{font-size:11px;color:var(--ink-3)}
.target .tv{font-size:19px;font-weight:700}
.target .tw{font-size:11.5px;color:var(--ink-2);flex-basis:100%}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.setrow:last-of-type{border-bottom:none}
.setrow small{display:block;font-size:11px;color:var(--ink-3)}
.setrow .stt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.tg{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:4px 14px;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tg.on{border-color:var(--muscle);color:var(--muscle)}
.splitcols{display:block}
.exmain{min-width:0}
.exside{margin-top:14px}
.refhead{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}

@media (min-width:900px){
  .wrap{max-width:1120px;padding:0 28px 96px}
  .shell{display:grid;grid-template-columns:168px minmax(0,1fr);gap:36px;align-items:start}
  nav.tabs{flex-direction:column;gap:0;border-bottom:none;border-right:1px solid var(--rule);
           position:sticky;top:20px;margin:0;overflow:visible}
  nav.tabs button{text-align:left;padding:9px 16px 9px 2px;border-bottom:none;
                  border-right:2px solid transparent;margin:0 -1px 0 0;font-size:15px}
  nav.tabs button[aria-selected="true"]{border-right-color:var(--muscle)}
  main.view-today,main.view-hist{max-width:760px}
  .splitcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .splitcols>div{min-width:0}
  .exbody{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:22px;align-items:start}
  .exside{margin-top:0}
  .hero{padding:24px 26px 22px}
  .hero .bigset .v{font-size:56px}
  .diasolo{max-width:52%}
}
@media (min-width:1180px){
  .wrap{max-width:1240px}
  .shell{grid-template-columns:180px minmax(0,1fr)}
}
.figslot{position:relative;background:var(--panel-2);border-radius:4px;overflow:hidden}
.figcanvas{width:100%;height:auto;display:block;touch-action:pan-y;cursor:grab}
.figcanvas:active{cursor:grabbing}
.figstill{width:100%;height:auto;display:block}
.figbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rule);display:none}
.figbar span{display:block;height:100%;width:0;background:var(--muscle)}
.figphase{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--ink-2);
  background:var(--panel);padding:1px 8px;border-radius:999px;opacity:.92}
.diawrong .fg-body,.diawrong .fg-far{fill:var(--muscle)}
.diawrong .fg-halo{fill:var(--panel);stroke:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>トレーニング記録</h1>
    <span class="date num" id="todayLabel"></span>
    <button class="themebtn" id="themeBtn">表示</button>
  </header>

  <div class="shell">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">今日</button>
      <button role="tab" data-tab="ex" aria-selected="false">種目</button>
      <button role="tab" data-tab="body" aria-selected="false">からだ</button>
      <button role="tab" data-tab="hist" aria-selected="false">履歴</button>
      <button role="tab" data-tab="plan" aria-selected="false">提案</button>
    </nav>
    <main id="view" class="view-today"></main>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="timer" id="timer">
  <span class="t num" id="timerT">1:30</span>
  <span class="lb"><b>次のセットまで</b><small id="timerLb"></small></span>
  <button id="timerPlus">+30秒</button>
  <button id="timerStop">終了</button>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

<!--INLINE:src/motions.js-->

<script>
/* ============================================================
   筋肉グループ
   ============================================================ */
const MUSCLES = {
  chest:"胸", shoulders:"肩", traps:"僧帽筋", lats:"広背筋", erectors:"脊柱起立筋",
  biceps:"上腕二頭筋", triceps:"上腕三頭筋", forearms:"前腕",
  abs:"腹直筋", obliques:"腹斜筋",
  glutes:"大殿筋", quads:"大腿四頭筋", hams:"ハムストリング",
  adductors:"内転筋", calves:"ふくらはぎ"
};

/* ============================================================
   種目ライブラリ
   kind: "w"=重量×回数 / "b"=自重×回数 / "t"=秒数
   ============================================================ */
const EX = [
  {
    id:"goblet", name:"ゴブレットスクワット", kind:"w", w:5, r:12, sets:3,
    p:["quads","glutes"], s:["adductors","abs","erectors"],
    how:[
      "ダンベルを縦に持ち、胸の前で両手で抱える。肘は体の内側に落とす。",
      "足は肩幅よりやや広く、つま先は少し外向き。",
      "胸を張ったまま、股関節から後ろに座るようにしゃがむ。太ももが床と平行かそれ以下まで。",
      "かかと全体で床を押して立ち上がる。一番上で尻を締める。"
    ],
    ng:[
      "膝が内側に入る。つま先と同じ方向に開いたまま動かす。",
      "背中が丸まる。ダンベルが重すぎるか、足首が硬い可能性。",
      "浅い。深さが足りないと5kgではほぼ刺激にならない。"
    ],
    up:[
      "しゃがむ深さを限界まで広げる",
      "下ろす動作に3秒かける",
      "一番下で1秒静止してから立つ",
      "片脚（ブルガリアン）に切り替える"
    ]
  },
  {
    id:"rdl", name:"ルーマニアンデッドリフト", kind:"w", w:5, r:12, sets:3,
    p:["hams","glutes"], s:["erectors","lats","forearms"],
    how:[
      "ダンベルを体の前で持ち、足は腰幅。膝は軽く曲げた角度で固定する。",
      "膝の角度を変えずに、尻を後ろに引きながら上体を倒す。",
      "ダンベルは脚のすぐ前をこすりながら下ろす。もも裏が張るところで止める。",
      "尻を締めながら股関節を前に押し出して戻る。"
    ],
    ng:[
      "スクワットになっている。これは膝ではなく股関節を曲げる種目。",
      "腰が丸まる。丸まる直前が可動域の限界。",
      "ダンベルが体から離れる。腰への負担が増える。"
    ],
    up:[
      "もも裏の伸びを感じる位置まで深く下ろす",
      "下ろす動作に3秒かける",
      "片脚ルーマニアンデッドリフトに切り替える"
    ]
  },
  {
    id:"split", name:"ブルガリアンスクワット", kind:"w", w:5, r:10, sets:3,
    p:["quads","glutes"], s:["adductors","abs"],
    how:[
      "椅子やベッドに片足の甲を乗せ、前脚は椅子から70cmほど前に置く。",
      "上体をやや前傾させたまま、前脚の膝を曲げて真下に沈む。",
      "後ろの膝が床に近づくまで下ろす。",
      "前脚のかかとで床を押して戻る。"
    ],
    ng:[
      "前脚の位置が近すぎて膝が前に出すぎる。バランスが取れないときは足幅を見直す。",
      "後ろ脚で押している。後ろ脚は支えるだけ。"

/* ============================================================

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(k){
  const [y,m,d] = k.split("-").map(Number);
  const wd = ["日","月","火","水","木","金","土"][new Date(y,m-1,d).getDay()];
  return m+"月"+d+"日("+wd+")";
}
function asDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function daysAgo(k){
  return Math.round((asDate(todayKey()) - asDate(k)) / 86400000);
}
const TODAY = todayKey();

function session(date){
  if(!state.sessions[date]) state.sessions[date] = { date, entries:[], note:"" };
  return state.sessions[date];
}
function sortedDates(){ return Object.keys(state.sessions).sort().reverse(); }

function entryFor(date, exId, create){
  const s = session(date);
  let e = s.entries.find(x=>x.ex===exId);
  if(!e && create){ e = {ex:exId, sets:[]}; s.entries.push(e); }
  return e;
}
function lastPerformance(exId, beforeDate){
  for(const d of sortedDates()){
    if(d >= beforeDate) continue;
    const e = (state.sessions[d].entries||[]).find(x=>x.ex===exId && x.sets.length);
    if(e) return {date:d, sets:e.sets};
  }
  return null;
}
function bestSet(sets, kind){
  if(!sets.length) return null;
  if(kind==="w") return sets.slice().sort((a,b)=> (b.w*b.r)-(a.w*a.r))[0];
  return sets.slice().sort((a,b)=> b.r-a.r)[0];
}
function setText(st, kind){
  if(kind==="w") return st.w+" kg × "+st.r;
  if(kind==="t") return st.r+" 秒";
  return st.r+" 回";
}

const PREF = {
  get(k,d){ try{ const v=localStorage.getItem("trainlog."+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("trainlog."+k, JSON.stringify(v)); }catch(e){} }
};
const PREF_DEFAULT = { sound:true, vib:false, notify:false, wake:true };
let CAP = { sound:null, vib:null, notif:null, wake:null };

/* ---- 音 ---- */
let AC = null;
function unlockAudio(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) { CAP.sound=false; return; }
    if(!AC) AC = new C();
    if(AC.state === "suspended") AC.resume();
    CAP.sound = true;
  }catch(e){ CAP.sound = false; }
}
function beep(){
  if(!PREF.get("sound", true)) return;
  try{
    unlockAudio(); if(!AC) return;
    [[0,784],[0.22,784],[0.44,1046]].forEach(([t,f])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      const s0 = AC.currentTime + t;
      g.gain.setValueAtTime(0.0001, s0);
      g.gain.exponentialRampToValueAtTime(0.3, s0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s0 + 0.2);
      o.connect(g); g.connect(AC.destination);
      o.start(s0); o.stop(s0 + 0.22);
    });
  }catch(e){ CAP.sound = false; }
}
/* ---- 振動 ---- */
function buzz(){
  if(!PREF.get("vib", false)) return;
  try{ if(navigator.vibrate){ navigator.vibrate([220,90,220,90,320]); CAP.vib = true; } else CAP.vib = false; }
  catch(e){ CAP.vib = false; }
}
/* ---- 端末通知 ---- */
function notifySupported(){ return typeof Notification !== "undefined"; }
function notify(title, body){
  if(!PREF.get("notify", false) || !notifySupported()) return;
  try{
    if(Notification.permission === "granted"){ new Notification(title, {body, tag:"trainlog-rest"}); CAP.notif = true; }
  }catch(e){ CAP.notif = false; }
}
async function askNotify(){
  if(!notifySupported()){ CAP.notif = false; setStatus("この画面では端末通知が使えません。音と振動で知らせます"); render(); return; }
  try{
    const r = await Notification.requestPermission();
    const ok = (r === "granted");
    PREF.set("notify", ok); CAP.notif = ok;
    setStatus(ok ? "" : "通知が許可されませんでした。音と振動で知らせます");
  }catch(e){ CAP.notif = false; PREF.set("notify", false); setStatus("この画面では端末通知が使えません。音と振動で知らせます"); }
  render();
}
/* ---- 画面を消さない ---- */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); CAP.wake = true; }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ CAP.wake = false; wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && PREF.get("wake", true) && restIv) keepAwake(true);
});

let restLeft = 0, restIv = null, restLabel = "";
function startRest(sec, label){
  restLeft = sec;
  restLabel = label || "";
  document.getElementById("timer").classList.add("on");
  document.getElementById("timerLb").textContent = restLabel;
  drawRest();
  clearInterval(restIv);
  if(PREF.get("wake", true)) keepAwake(true);
  restIv = setInterval(()=>{
    restLeft--;
    if(restLeft<=0){
      clearInterval(restIv); restIv = null;
      document.getElementById("timerT").textContent = "0:00";
      beep(); buzz();
      notify("次のセットの時間です", restLabel || "休憩おわり");
      setTimeout(stopRest, 4000);
      return;
    }
    drawRest();
  },1000);
}
function drawRest(){
  const m = Math.floor(restLeft/60), s = restLeft%60;
  document.getElementById("timerT").textContent = m+":"+String(s).padStart(2,"0");
}
function stopRest(){
  clearInterval(restIv); restIv = null;
  document.getElementById("timer").classList.remove("on");
  keepAwake(false);
}
document.getElementById("timerStop").onclick = stopRest;
document.getElementById("timerPlus").onclick = ()=>{ if(restIv){ restLeft += 30; drawRest(); } };

let FIG = null, animRAF = null, playingId = null, playSlot = null, playBtn = null;
const figAz = {};                 /* 種目ごとの視点。指で左右にドラッグすると回る */
const figShots = {};              /* 静止画のキャッシュ */

function figDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t) return t === "dark";
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function figInit(){
  if(FIG !== null) return FIG;
  try{
    if(typeof THREE === "undefined" || typeof MOTION === "undefined" || typeof FIGURE3D === "undefined") return (FIG = false);
    const c = document.createElement("canvas");
    c.className = "figcanvas";
    const f = FIGURE3D.create(THREE, c, {theme: figDark() ? "dark" : "light", dpr: window.devicePixelRatio || 1});
    f.setSize(480, 560);
    f.canvas = c;
    bindFigDrag(c);
    FIG = f;
  }catch(e){ FIG = false; }
  return FIG;
}
function bindFigDrag(c){
  let down = false, x0 = 0, a0 = 0;
  const start = (e)=>{ if(!playingId) return; down = true; x0 = e.clientX; a0 = figAz[playingId] || 0;
    try{ c.setPointerCapture(e.pointerId); }catch(err){} };
  const move = (e)=>{ if(!down || !playingId) return; figAz[playingId] = a0 + (e.clientX - x0) * 0.5; };
  const end = ()=>{ down = false; };
  c.addEventListener("pointerdown", start);
  c.addEventListener("pointermove", move);
  c.addEventListener("pointerup", end);
  c.addEventListener("pointercancel", end);
}
function motionOf(id){
  if(typeof MOTION === "undefined") return null;
  return MOTION.motions[id] || MOTION.motions[baseOf(id)] || null;
}
function figView(m, id){
  const v = Object.assign({}, m.view || {});
  v.az = (v.az === undefined ? 40 : v.az) + (figAz[id] || 0);
  return v;
}
function stillTime(m){
  if(m.still !== undefined) return m.still;
  const T = MOTION.cycleTime(m);
  const ps = m.phases || [];
  /* 「よくある崩れ」の場面は静止画に使わない */
  if(ps.some(p => p.wrong)){
    for(let i = 0; i < ps.length; i++){
      if(!ps[i].wrong){
        const end = (i + 1 < ps.length) ? ps[i+1].t : T;
        return (ps[i].t + end) / 2;
      }
    }
  }
  return T * 0.35;
}
function figSize(f, m){
  let w = 480, h = 560;
  try{
    const r = f.frameShape ? f.frameShape(m).ratio : 1;
    if(r > 1.15){ h = Math.round(Math.max(300, 560 / Math.min(2.0, r / 0.85))); w = 560; }
  }catch(e){}
  f.setSize(w, h);
}
function figShot(id){
  const f = figInit(), m = motionOf(id);
  if(!f || !m) return "";
  figSize(f, m);
  const key = id + "|" + (figDark() ? "d" : "l") + "|" + Math.round(figAz[id] || 0);
  if(figShots[key]) return figShots[key];
  try{
    f.render(m, stillTime(m), figView(m, id));
    const keys = Object.keys(figShots);
    if(keys.length > 10) delete figShots[keys[0]];     /* 画像を抱え込みすぎない */
    return (figShots[key] = f.canvas.toDataURL("image/png"));
  }catch(e){ return ""; }
}
function phaseLabel(m, t){
  let lb = "";
  (m.phases || []).forEach(p => { if(t >= p.t) lb = p.label; });
  return lb;
}
function diaHTML(id, compact){
  const m = motionOf(id);
  const hold = ((PHYS[id] || PHYS[baseOf(id)] || {}).hold) || "";
  const note = DIANOTE[id] || DIANOTE[baseOf(id)] || "";
  const tail = (hold ? `<p class="diahold"><b>接地</b>　${hold}</p>` : "")
             + (compact || !note ? "" : `<p class="dianote">${note}</p>`);
  if(!m) return `<div class="dia">${tail}</div>`;
  const shot = figShot(id);
  return `<div class="dia" data-dia="${id}">
    <div class="figslot">
      ${shot ? `<img class="figstill" src="${shot}" alt="${itemNameOf(id)}の姿勢">`
             : `<p class="diahint">この端末では動きの図を表示できません</p>`}
      <div class="figphase"></div>
      <div class="figbar"><span></span></div>
    </div>
    ${shot ? `<div class="rowbtns"><button data-act="play" data-ex="${id}">動きを再生</button></div>` : ""}
    ${tail}
  </div>`;
}
function itemNameOf(id){ return EXMAP[id] ? EXMAP[id].name : ""; }
function stopAnim(){
  if(animRAF) cancelAnimationFrame(animRAF);
  animRAF = null;
  if(playSlot){
    if(FIG && FIG.canvas && FIG.canvas.parentNode === playSlot) playSlot.removeChild(FIG.canvas);
    const img = playSlot.querySelector(".figstill");
    if(img) img.style.display = "";
    const ph = playSlot.querySelector(".figphase");
    if(ph) ph.textContent = "";
    const bb = playSlot.querySelector(".figbar");
    if(bb){ bb.style.display = "none"; bb.firstChild.style.width = "0%"; }
  }
  if(playBtn) playBtn.textContent = "動きを再生";
  playSlot = null; playBtn = null; playingId = null;
}
function togglePlay(id){
  const wrap = document.querySelector('[data-dia="' + id + '"]');
  const f = figInit(), m = motionOf(id);
  if(!wrap || !f || !m) return;
  if(playingId === id){ stopAnim(); return; }
  stopAnim();
  figSize(f, m);
  const slot = wrap.querySelector(".figslot");
  const img = slot.querySelector(".figstill");
  if(img) img.style.display = "none";
  slot.insertBefore(f.canvas, slot.firstChild);
  playSlot = slot;
  playBtn = wrap.querySelector('[data-act="play"]');
  if(playBtn) playBtn.textContent = "停止";
  playingId = id;
  const phase = slot.querySelector(".figphase");
  const bar = slot.querySelector(".figbar span");
  if(bar) bar.parentNode.style.display = "block";
  const T = MOTION.cycleTime(m);
  const t0 = performance.now();
  let last = 0;
  const tick = (now)=>{
    animRAF = requestAnimationFrame(tick);
    if(now - last < 33) return;
    last = now;
    const t = ((now - t0) / 1000) % T;
    f.render(m, t, figView(m, id));
    if(phase) phase.textContent = phaseLabel(m, t);
    if(bar) bar.style.width = (t / T * 100).toFixed(1) + "%";
  };
  animRAF = requestAnimationFrame(tick);
}
function figThemeChanged(){
  Object.keys(figShots).forEach(k => delete figShots[k]);
  if(FIG) FIG.setTheme(figDark() ? "dark" : "light");
}

function render(){
  stopAnim();

  wire();
}

const REST = {split:120, goblet:120, rdl:120, rdl1:120, hipthrust:105, row:105, ohp:105, pushup:105, floorpress:105};
function restFor(item){
  const ex = EXMAP[item.ex];
  if(ex.kind === "t") return 60;
  return REST[item.ex] || 90;
}
function routineToday(){
  const s = session(TODAY);
  if(s.routine && RMAP[s.routine]) return s.routine;
  for(const d of sortedDates()){
    if(d >= TODAY) continue;
    const sd = state.sessions[d];
    if(sd && sd.routine && (sd.entries||[]).some(e=>e.sets.length)){
      const i = RORDER.indexOf(sd.routine);
      if(i >= 0) return RORDER[(i+1) % RORDER.length];
    }
  }
  return "A";
}
function todayItems(){
  const items = RMAP[routineToday()].items.map(x=>Object.assign({}, x));
  const s = session(TODAY);
  (s.entries||[]).forEach(e=>{
    if(!items.some(i=>i.ex===e.ex) && EXMAP[e.ex]){
      const ex = EXMAP[e.ex];
      items.push({ex:e.ex, sets:ex.sets||3, r:ex.r, extra:true});
    }
  });
  return items;
}
function itemOf(id){ return todayItems().find(i=>i.ex===id) || {ex:id, sets:3, r:EXMAP[id]?EXMAP[id].r:10}; }

/* ---- きつさに応じて次のセットの回数を決める ---- */
function clampR(kind, r){
  r = Math.round(r);
  return kind==="t" ? Math.max(10, Math.min(180, r)) : Math.max(4, Math.min(40, r));
}
function adjust(kind, r, rpe){
  const st = kind==="t" ? 5 : 2;
  if(!rpe) return {r:clampR(kind,r), why:""};
  if(rpe <= 5) return {r:clampR(kind, r + st*2), why:"かなり余裕があったので増やしました"};
  if(rpe <= 6) return {r:clampR(kind, r + st), why:"まだ余力があるので少し増やしました"};
  if(rpe <= 9) return {r:clampR(kind, r), why:"狙いの範囲です。同じ数字で"};
  return {r:clampR(kind, r - st), why:"限界まで行ったので少し減らしました"};
}
function suggestNext(item, e, last){
  const ex = EXMAP[item.ex], kind = ex.kind;
  const sets = e ? e.sets : [];
  let w = kind==="w" ? gearWeight(item.ex) : undefined;
  if(sets.length){
    const prev = sets[sets.length-1];
    if(kind==="w") w = prev.w;
    const a = adjust(kind, prev.r, prev.rpe);
    return {r:a.r, w, why:a.why, src:"前のセットのきつさ " + (prev.rpe||"—")};
  }
  if(last && last.sets.length){
    const first = last.sets[0];
    if(kind==="w") w = first.w;
    const avg = last.sets.reduce((x,st)=>x+(st.rpe||0),0) / last.sets.length;
    const a = adjust(kind, first.r, avg ? Math.round(avg*2)/2 : 0);
    return {r:a.r, w, why:a.why, src:"前回のきつさ平均 " + (avg ? Math.round(avg*10)/10 : "—")};
  }
  return {r:clampR(kind, item.r || ex.r), w, why:"初回はフォーム優先。余力を2〜3回残して終える", src:"初回"};
}
function sugText(item, sug){
  const ex = EXMAP[item.ex];
  if(ex.kind === "w") return sug.w + " kg × " + sug.r + (item.side ? "（左右それぞれ）" : "");
  if(ex.kind === "t") return sug.r + " 秒" + (item.side ? "（左右それぞれ）" : "");
  return sug.r + " 回" + (item.side ? "（左右それぞれ）" : "");
}

function viewToday(){
  const rid = routineToday(), R = RMAP[rid];
  const items = todayItems();
  const s = session(TODAY);

  let next = null;
  for(const it of items){
    const e = entryFor(TODAY, it.ex, false);
    if(!e || e.sets.length < (it.sets||3)){ next = it; break; }
  }

  const switcher = `<div class="rswitch">` + ROUTINES.map(r=>
    `<button data-act="setr" data-r="${r.id}" class="${r.id===rid?"on":""}">
       <b>${r.id}</b><span>${r.name}</span></button>`).join("") + `</div>`;

  let hero;
  if(!next){
    const total = s.entries.reduce((a,e)=>a+e.sets.length,0);
    hero = `<div class="hero"><p class="kicker">${rid}：${R.name}</p><h2>完了</h2>
      <div class="bigset"><span class="v num" style="color:var(--done)">${total}</span><span class="u">セット記録</span></div>
      <p class="sub">次回は ${RORDER[(RORDER.indexOf(rid)+1)%RORDER.length]}：${RMAP[RORDER[(RORDER.indexOf(rid)+1)%RORDER.length]].name} です。</p></div>`;
  }else{
    const ex = EXMAP[next.ex];
    const e = entryFor(TODAY, next.ex, false);
    const sug = suggestNext(next, e, lastPerformance(next.ex, TODAY));
    const inner = ex.kind==="w"
      ? `<div class="bigset"><span class="v num">${sug.w}</span><span class="x num">×</span><span class="v num">${sug.r}</span><span class="u">kg・回</span></div>`
      : `<div class="bigset"><span class="v num">${sug.r}</span><span class="u">${ex.kind==="t"?"秒":"回"}${next.side?"・左右":""}</span></div>`;
    hero = `<div class="hero"><p class="kicker">${rid}：${R.name}　—　次の種目</p>
      <h2>${itemName(next)}</h2>${inner}
      <p class="sub">${sug.src}${sug.why?"　→　"+sug.why:""}</p></div>`;
  }

  const rows = items.map(it=>exRow(it)).join("");

  return switcher + hero + rows + `
    <div class="rowbtns"><button data-act="addex">種目を追加</button></div>
    <h3 class="sec">今日のメモ</h3>
    <div class="card">
      <textarea id="note" placeholder="睡眠、体調、気づいたこと。一行でいい。">${(s.note||"").replace(/</g,"&lt;")}</textarea>
    </div>
    ${gearCard()}
    ${settingsCard()}`;
}

/* ============================================================
   使える器具（設定で変える。既定は 5kg×2本＝引き継ぎ時の前提）
   ============================================================ */
const GEAR_DEFAULT = { unit: 5, count: 2, adjustable: false, max: 5 };
function gear(){ return Object.assign({}, GEAR_DEFAULT, state.gear || {}); }
function setGear(patch){
  state.gear = Object.assign({}, gear(), patch);
  if(state.gear.max < state.gear.unit) state.gear.max = state.gear.unit;
  persistProgram();
}
function kgText(v){ return (Math.round(v*10)/10) + "kg"; }

/* 種目ごとのダンベルの使い方
   each   = 両手に1つずつ（2本あれば2本使う）
   stack  = 両手で1つ／体に乗せる（2本あれば重ねて倍にできる）
   single = 片手に1つだけ（左右を入れ替えて行う）
   none   = 使わない（自重・時間種目） */
const GEAR_USE = {
  goblet:{mode:"stack"}, rdl:{mode:"each"}, rdl1:{mode:"each"}, split:{mode:"each"},
  hipthrust:{mode:"stack"}, row:{mode:"single"}, ohp:{mode:"each"}, lateral:{mode:"each"},
  floorpress:{mode:"each"}, curl:{mode:"each"}, triext:{mode:"stack", cap:1},
  calf:{mode:"each"}, farmer:{mode:"each"}
};
function gearUse(id){ return GEAR_USE[id] || GEAR_USE[baseOf(id)] || {mode:"none"}; }

/* その種目で実際に持てる本数と合計重量 */
function gearLoad(id){
  const g = gear(), u = gearUse(id);
  if(u.mode === "none") return {n:0, total:0, mode:"none", unit:g.unit};
  const cap = u.cap || 2;
  const n = u.mode === "single" ? Math.min(1, g.count) : Math.min(g.count, cap);
  return {n, total: Math.round(g.unit * n * 10) / 10, mode:u.mode, unit:g.unit};
}
/* 記録欄に出す初期値。器具から決まる */
function gearWeight(id){
  const l = gearLoad(id);
  return l.n ? l.total : 0;
}
/* 「5kg×2 = 10kg（両手に1つずつ）」のような説明 */
function gearLine(id){
  const g = gear(), l = gearLoad(id);
  if(l.mode === "none") return "";
  if(!g.count) return "ダンベルが0本の設定です。この種目は飛ばすか、自重で近い動きに置き換えてください。";
  const how = l.mode === "each" ? (l.n >= 2 ? "両手に1つずつ" : "ダンベルが1本なので片手ずつ行う")
            : l.mode === "stack" ? (l.n >= 2 ? "2本まとめて持つ" : "両手で1つを持つ")
            : "片手に1つ（左右を入れ替える）";
  const calc = l.n >= 2 ? kgText(g.unit) + "×" + l.n + " = " + kgText(l.total) : kgText(l.total);
  return calc + "（" + how + "）";
}
/* 解説文の中の「5kg」を今の設定に合わせる（既定の5kgなら何も変わらない） */
function gearText(s){
  const g = gear();
  if(!s || g.unit === 5) return s || "";
  return String(s).replace(/10\s*kg/g, kgText(g.unit * 2)).replace(/5\s*kg/g, kgText(g.unit));
}
/* 重量を上げる余地があるか（可変式で上限に未到達なら、まず重量を上げる） */
function canAddWeight(){
  const g = gear();
  return !!(g.adjustable && g.max > g.unit);
}
function nextWeightStep(){
  const g = gear();
  return Math.min(g.max, Math.round((g.unit + Math.max(1, g.unit * 0.1)) * 2) / 2);
}

/* ルーチンの注記のうち、今の器具と食い違う一文を落とす（元データは書き換えない） */
function noteForGear(note){
  if(!note) return "";
  const g = gear();
  if(g.count >= 2) return gearText(note);
  const kept = note.split("。").filter(x => x && !/[2２]つ|両手に[1１]つずつ/.test(x));
  return kept.length ? gearText(kept.join("。") + "。") : "";
}

function exRow(item){
  const id = item.ex, ex = EXMAP[id]; if(!ex) return "";
  const e = entryFor(TODAY, id, false);
  const n = e ? e.sets.length : 0;
  const target = item.sets || ex.sets || 3;
  const done = n >= target;
  const open = openEx === id;
  const last = lastPerformance(id, TODAY);
  const parts = ex.p.map(m=>MUSCLES[m]).join("・");
  const sug = suggestNext(item, e, last);

  let body = "";
  if(open){
    const sets = (e?e.sets:[]).map((st,i)=>`
      <div class="setline">
        <span class="i num">${i+1}</span>
        <span class="val num">${setText(st, ex.kind)}</span>
        ${st.rpe?`<span class="rpe">きつさ ${st.rpe}</span>`:""}
        <button class="del" data-act="delset" data-ex="${id}" data-i="${i}" aria-label="削除">×</button>
      </div>`).join("");

    const wfld = ex.kind==="w" ? `
      <div class="fld"><label>重量 kg</label>
        <div class="stepper">

/* ============================================================
   提案（ルールベース。外部通信なし。state.sessions の実績だけで判断する）
   ============================================================ */

/* ある種目の、記録のあるセッションだけを古い→新しい順に並べる */
function exerciseHistory(exId){
  const out = [];
  sortedDates().slice().reverse().forEach(d=>{
    const e = (state.sessions[d].entries||[]).find(x=>x.ex===exId && x.sets && x.sets.length);
    if(e) out.push({date:d, sets:e.sets});
  });
  return out;
}
function sessionSummary(exId, sets){
  const kind = EXMAP[exId].kind;
  const avgRpe = sets.reduce((a,s)=>a+(s.rpe||0),0) / sets.length;
  const maxR = sets.reduce((a,s)=>Math.max(a,s.r||0),0);
  const vol = kind==="w" ? sets.reduce((a,s)=>a+(s.w||0)*(s.r||0),0) : sets.reduce((a,s)=>a+(s.r||0),0);
  return {avgRpe, maxR, vol, kind};
}

/* 種目ごとの「そろそろ変え時／まだ様子見／余裕あり」判定。
   可変式で上限に余裕があれば重量を上げる案を先に出し、重さ固定なら
   EX[id].up（可動域・テンポ・片側化など）を次の一手として出す。 */
/* 次の一手。重量を上げられるならそれが最優先 */
function nextStepText(exId){
  const ex = EXMAP[exId];
  if(ex.kind === "w" && canAddWeight()){
    return "1本 " + kgText(nextWeightStep()) + " に上げる（上限 " + kgText(gear().max) + "）";
  }
  return gearText(ex.up[0]);
}

function levelSuggestions(){
  const out = [];
  Object.keys(EXMAP).forEach(exId=>{
    const ex = EXMAP[exId];
    if(!ex.up || !ex.up.length) return;
    const hist = exerciseHistory(exId);
    if(hist.length < 3) return;
    const ceil = clampR(ex.kind, 9999);
    const sums = hist.map(h=>sessionSummary(exId, h.sets));
    const recent3 = sums.slice(-3);

    const atCeiling = recent3.every(s=>s.maxR >= ceil*0.9 && s.avgRpe >= 8.5);
    if(atCeiling){
      out.push({exId, kind:"levelup",
        title: itemName({ex:exId}) + "：そろそろ切り替え時",
        body: "次の一手 → " + nextStepText(exId),
        why: "直近3回とも" + (ex.kind==="t" ? "秒数" : "回数") + "が上限付近で、きつさの平均が " + recent3[recent3.length-1].avgRpe.toFixed(1) + "。" + (canAddWeight() ? "重量を上げる余地があります。" : kgText(gear().unit) + "のままでは伸びしろが少ない状態です。")});
      return;
    }

    if(hist.length >= 4){
      const sums4 = sums.slice(-4);
      const first = sums4[0].vol, last = sums4[sums4.length-1].vol;
      const avgRpe4 = sums4.reduce((a,s)=>a+s.avgRpe,0) / sums4.length;
      if(first > 0 && last <= first*1.05 && avgRpe4 >= 8){
        out.push({exId, kind:"plateau",
          title: itemName({ex:exId}) + "：伸び悩みぎみ",
          body: "次の一手 → " + nextStepText(exId),
          why: "直近4回できつさは高いまま（平均 " + avgRpe4.toFixed(1) + "）ですが、量はほぼ横ばいです。"});
        return;
      }
    }

    const easy3 = recent3.every(s=>s.avgRpe <= 6 && s.maxR < ceil*0.7);
    if(easy3){
      out.push({exId, kind:"easy",
        title: itemName({ex:exId}) + "：余裕が続いています",
        body: "回数を増やすか、早めに次の一手 → " + nextStepText(exId),
        why: "直近3回のきつさ平均が " + (recent3.reduce((a,s)=>a+s.avgRpe,0)/3).toFixed(1) + "。8〜9を狙う設計に対して軽すぎる状態です。"});
    }
  });
  return out;
}

/* 大きな部位が長期間ゼロに近い＝メニュー全体の見直しサイン */
function balanceSuggestions(){
  const BIG = ["quads","glutes","hams","lats"];
  const load30 = muscleLoad(30);
  const out = [];
  BIG.forEach(m=>{
    const v = load30[m] || 0;
    if(v <= 2){
      const cands = EX.filter(e=>e.p.includes(m)).slice(0,3).map(e=>e.name);
      out.push({kind:"balance", muscle:m,
        title: MUSCLES[m] + "：直近30日でほぼ使えていません",
        body: cands.length ? "候補: " + cands.join("、") : "",
        why: "有効セット数 " + v.toFixed(1) + "（体の中で大きい筋肉なので、抜けると効果の範囲が狭くなります）"});
    }
  });
  return out;
}

/* A/B/C/Dの実施頻度に偏りがないか */
function routineSuggestions(){
  const counts = {A:0,B:0,C:0,D:0};
  let total = 0;
  sortedDates().forEach(d=>{
    if(daysAgo(d) >= 28) return;
    const s = state.sessions[d];
    if(!s.routine || !(s.entries||[]).some(e=>e.sets.length)) return;
    counts[s.routine] = (counts[s.routine]||0) + 1;
    total++;
  });
  if(total < 4) return [];
  const out = [];
  RORDER.forEach(id=>{
    if(counts[id] === 0 && total >= 4){
      out.push({kind:"routine",
        title: id + "：" + RMAP[id].name + " をしばらく行っていません",
        body: "",
        why: "直近28日・" + total + "回のトレーニング中、このメニューは0回でした。"});
    }
  });
  return out;
}

function planSummary(){
  const totalSessions = sortedDates().filter(d=>(state.sessions[d].entries||[]).some(e=>e.sets.length)).length;
  return { totalSessions, level: levelSuggestions(), balance: balanceSuggestions(), routine: routineSuggestions() };
}

/* ---------- 履歴 ---------- */
function viewHist(){
  const dates = sortedDates().filter(d=> (state.sessions[d].entries||[]).some(e=>e.sets.length));
  if(!dates.length) return `<div class="empty">まだ記録がありません。<br>「今日」タブから最初の1セットを記録してください。</div>`;

  const streakDays = dates.length;
  const totalSets = dates.reduce((a,d)=>a+(state.sessions[d].entries||[]).reduce((x,e)=>x+e.sets.length,0),0);
  const last7 = dates.filter(d=>daysAgo(d)<7).length;

  const perEx = {};
  dates.slice().reverse().forEach(d=>{
    (state.sessions[d].entries||[]).forEach(e=>{
      if(!e.sets.length) return;
      const ex = EXMAP[e.ex]; if(!ex) return;
      const vol = ex.kind==="w" ? e.sets.reduce((a,s)=>a+s.w*s.r,0) : e.sets.reduce((a,s)=>a+s.r,0);
      (perEx[e.ex] = perEx[e.ex] || []).push({d, vol, best: bestSet(e.sets, ex.kind)});
    });
  });

  const prog = Object.keys(perEx).map(id=>{
    const ex = EXMAP[id], rows = perEx[id];
    const max = Math.max(...rows.map(r=>r.vol), 1);
    const bars = rows.slice(-12).map(r=>`<i style="height:${Math.max(4, Math.round(r.vol/max*44))}px" title="${fmtDate(r.d)}"></i>`).join("");
    const first = rows[0], lastR = rows[rows.length-1];
    const delta = first.vol>0 ? Math.round((lastR.vol/first.vol-1)*100) : 0;
    const unit = ex.kind==="w" ? "kg·回" : (ex.kind==="t"?"秒":"回");
    return `<div class="card">
      <h4>${ex.name}</h4>
      <div class="spark">${bars}</div>
      <p class="lastline" style="margin-top:2px">総量 <b>${Math.round(lastR.vol)}</b> ${unit}　最高セット <b>${setText(lastR.best, ex.kind)}</b>${rows.length>1?`　開始時比 <b>${delta>=0?"+":""}${delta}%</b>`:""}</p>
    </div>`;
  }).join("");

  const table = dates.slice(0,30).map(d=>{
    const s = state.sessions[d];
    const sets = (s.entries||[]).reduce((a,e)=>a+e.sets.length,0);
    const names = (s.entries||[]).filter(e=>e.sets.length).map(e=>EXMAP[e.ex]?EXMAP[e.ex].name:e.ex).join("、");
    return `<tr><td>${fmtDate(d)}<div style="font-size:11.5px;color:var(--ink-3)">${names}</div>${s.note?`<div style="font-size:11.5px;color:var(--ink-2)">${s.note.replace(/</g,"&lt;")}</div>`:""}</td><td class="n">${sets}</td></tr>`;
  }).join("");

  return `
    <div class="card">
      <h4>これまで</h4>
      <div class="bigset"><span class="v num">${streakDays}</span><span class="u">回のトレーニング・${totalSets}セット</span></div>
      <p class="lastline">直近7日で ${last7} 回。</p>
    </div>
    <h3 class="sec">種目ごとの推移</h3>
    ${prog}
    <h3 class="sec">セッション</h3>
    <div class="card overflowx">
      <table class="hist"><thead><tr><th>日付</th><th style="text-align:right">セット</th></tr></thead><tbody>${table}</tbody></table>
    </div>
    <h3 class="sec">書き出し</h3>
    <div class="card">
      <p class="lastline" style="margin-top:0">CSVで保存するか、テキストを貼り付けて共有できます。</p>
      <div class="rowbtns">
        <button data-act="csv">CSVで保存</button>
        <button data-act="txt">テキストで表示</button>
      </div>
      ${typeof storeButtons === "function" ? storeButtons() : ""}
    </div>`;
}

/* ============================================================
   イベント
   ============================================================ */
function wire(){
  const v = document.getElementById("view");

  v.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick = (ev)=>{
      const a = el.dataset.act;
      if(a==="toggle"){ openEx = (openEx===el.dataset.ex)?null:el.dataset.ex; render(); }
      else if(a==="addset"){ addSet(el.dataset.ex); }
      else if(a==="delset"){ delSet(el.dataset.ex, +el.dataset.i); }
      else if(a==="step"){ step(el.dataset.t, el.dataset.ex, +el.dataset.d); }
      else if(a==="setr"){ const s2 = session(TODAY); s2.routine = el.dataset.r; persistSession(TODAY); openEx=null; render(); }
      else if(a==="pref"){ const k = el.dataset.k; PREF.set(k, !PREF.get(k, PREF_DEFAULT[k])); render(); }
      else if(a==="gearcount"){ setGear({count: +el.dataset.n}); render(); }
      else if(a==="gearadj"){ const g = gear(); setGear({adjustable: !g.adjustable, max: Math.max(g.max, g.unit)}); render(); }
      else if(a==="gearstep"){ gearStep(el.dataset.t, +el.dataset.d); }
      else if(a==="asknotify"){ if(PREF.get("notify",false)){ PREF.set("notify",false); render(); } else askNotify(); }
      else if(a==="testalert"){ unlockAudio(); beep(); buzz(); notify("テスト", "この知らせ方で鳴ります"); }
      else if(a==="goref"){ refEx = el.dataset.ex; switchTab("ex"); }
      else if(a==="addex"){ openPicker("add"); }
      else if(a==="addtoday"){ addToProgramToday(el.dataset.ex); }
      else if(a==="days"){ bodyDays = +el.dataset.d; selMuscle=null; render(); }
      else if(a==="play"){ togglePlay(el.dataset.ex); }
      else if(a==="csv"){ exportCSV(); }
      else if(a==="txt"){ showText(); }
      else if(a==="backup" && typeof backupSave === "function"){ backupSave(); }
      else if(a==="restore" && typeof backupLoad === "function"){ backupLoad(); }
      else if(a==="restorepaste" && typeof backupPaste === "function"){ backupPaste(); }
    };
  });

  const sel = v.querySelector("#exSel");
  if(sel) sel.onchange = ()=>{ refEx = sel.value; render(); };

  ["unit","max"].forEach(k=>{
    const inp = v.querySelector("#gear_" + k);
    if(!inp) return;
    inp.onchange = ()=>{
      const val = parseFloat(inp.value || "0");
      if(isNaN(val) || val <= 0) { render(); return; }
      setGear(k === "max" ? {max: val} : {unit: val});
      render();
    };
  });

  const note = v.querySelector("#note");
  if(note){
    let t=null;
    note.oninput = ()=>{
      clearTimeout(t);
      t = setTimeout(()=>{ session(TODAY).note = note.value; persistSession(TODAY); }, 600);
    };
  }

  if(tab==="ex"){
    const ex = EXMAP[refEx];
    const w = {}; ex.p.forEach(m=>w[m]=1); (ex.s||[]).forEach(m=>{ if(!w[m]) w[m]=0.45; });
    paintFigs(v.querySelector("#refFig"), w, 1);
  }
  if(tab==="body"){
    const load = muscleLoad(bodyDays);
    const max = Math.max(1, ...Object.values(load));
    paintFigs(v, load, max);
    v.querySelectorAll("svg.fig .rg").forEach(el=>{
      if(selMuscle && el.getAttribute("data-m")===selMuscle) el.classList.add("sel");
      el.onclick = ()=>{ selMuscle = el.getAttribute("data-m"); render(); };
    });
  }
}
function switchTab(t){
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.tab===t)));
  render(); window.scrollTo(0,0);
}

function step(t, id, d){
  const map = {w:"w_", r:"r_", e:"e_"};
  const inp = document.getElementById(map[t]+id);
  if(!inp) return;
  let val = parseFloat(inp.value||"0");
  if(t==="w") val = Math.max(0, val + d*0.5);
  else if(t==="e") val = Math.min(10, Math.max(1, val + d));
  else val = Math.max(1, val + d);
  inp.value = (t==="w") ? String(val) : String(Math.round(val));
}

function gearStep(which, d){
  const g = gear();
  const cur = which === "max" ? g.max : g.unit;
  const step = cur >= 20 ? 2.5 : (cur >= 10 ? 1 : 0.5);
  const v = Math.max(which === "max" ? g.unit : 0, Math.round((cur + d*step) * 10) / 10);
  setGear(which === "max" ? {max: v} : {unit: v});
  render();
}

function addSet(id){
  const ex = EXMAP[id];
  const r = Math.round(parseFloat(document.getElementById("r_"+id).value||"0"));
  const rpe = Math.round(parseFloat(document.getElementById("e_"+id).value||"0"));
  if(!r || r<1) return;
  unlockAudio();
  const st = {r, rpe};
  if(ex.kind==="w"){
    const w = parseFloat(document.getElementById("w_"+id).value||"0");
    st.w = isNaN(w)?0:w;
  }
  const e = entryFor(TODAY, id, true);
  e.sets.push(st);
  const s = session(TODAY);
  if(!s.routine) s.routine = routineToday();
  persistSession(TODAY);

  const item = itemOf(id);
  const doneNow = e.sets.length >= (item.sets||3);
  let label;
  if(doneNow){
    const items = todayItems();
    const nx = items.find(it=>{ const en = entryFor(TODAY, it.ex, false); return !en || en.sets.length < (it.sets||3); });
    label = nx ? "次: " + itemName(nx) : "今日のメニュー完了";
  }else{
    const sug = suggestNext(item, e, lastPerformance(id, TODAY));
    label = itemName(item) + "  " + sugText(item, sug);
  }
  render();
  startRest(restFor(item), label);
}
function delSet(id, i){
  const e = entryFor(TODAY, id, false);
  if(!e) return;
  e.sets.splice(i,1);
  if(!e.sets.length && !state.program.includes(id)){
    const s = session(TODAY);
    s.entries = s.entries.filter(x => x !== e);
  }
  persistSession(TODAY);
  render();
}
function addToProgramToday(id){
  entryFor(TODAY, id, true);
  persistSession(TODAY);
  openEx = id;
  switchTab("today");
}

/* ---------- ピッカー ---------- */
const sheet = document.getElementById("sheet");
const sheetInner = document.getElementById("sheetInner");
sheet.onclick = (e)=>{ if(e.target===sheet) sheet.classList.remove("on"); };

function openPicker(mode){
  if(mode==="add"){
    sheetInner.innerHTML = `<h4>今日のメニューに追加</h4><div class="picklist">` +
      EX.map(e=>`<button data-pick="${e.id}">${e.name}<span>${e.p.map(m=>MUSCLES[m]).join("・")}</span></button>`).join("") +
      `</div>`;
    sheetInner.querySelectorAll("[data-pick]").forEach(b=>{
      b.onclick = ()=>{ sheet.classList.remove("on"); addToProgramToday(b.dataset.pick); };
    });
  }else{
    sheetInner.innerHTML = `<h4>基本メニュー</h4>
      <p class="lastline" style="margin-top:0">毎回のトレーニングで表示される種目です。タップで入れ替えできます。</p>
      <div class="picklist">` +
      EX.map(e=>{
        const on = state.program.includes(e.id);
        return `<button data-tog="${e.id}" style="${on?'border-color:var(--muscle);':''}">${on?"■ ":"□ "}${e.name}<span>${e.p.map(m=>MUSCLES[m]).join("・")}</span></button>`;
      }).join("") +
      `</div><div class="rowbtns"><button data-reset="1">既定に戻す</button><button data-close="1">閉じる</button></div>`;
    sheetInner.querySelectorAll("[data-tog]").forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.tog;
        if(state.program.includes(id)) state.program = state.program.filter(x=>x!==id);
        else state.program.push(id);
        persistProgram(); openPicker("prog"); render();
      };
    });
    const rs = sheetInner.querySelector("[data-reset]");
    if(rs) rs.onclick = ()=>{ state.program = DEFAULT_PROGRAM.slice(); persistProgram(); openPicker("prog"); render(); };
    const cl = sheetInner.querySelector("[data-close]");
    if(cl) cl.onclick = ()=> sheet.classList.remove("on");
  }
  sheet.classList.add("on");
}

/* ---------- 書き出し ---------- */
function buildCSV(){
  const rows = [["日付","種目","セット","重量kg","回数/秒","きつさ","メモ"]];
  sortedDates().slice().reverse().forEach(d=>{
    const s = state.sessions[d];
    let first = true;
    (s.entries||[]).forEach(e=>{
      const ex = EXMAP[e.ex];
      e.sets.forEach((st,i)=>{
        rows.push([d, ex?ex.name:e.ex, i+1, st.w!==undefined?st.w:"", st.r, st.rpe||"", first?(s.note||""):""]);
        first = false;
      });
    });
  });
  return rows.map(r=>r.map(c=>{
    const v = String(c===undefined?"":c);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(",")).join("\n");
}
async function exportCSV(){
  const csv = "\ufeff" + buildCSV();
  const ok = await saveFile("training-" + TODAY + ".csv", csv);
  if(!ok) showText();          /* 保存できない環境では画面に出す */
}
function showText(){
  const lines = [];
  sortedDates().slice().reverse().forEach(d=>{
    const s = state.sessions[d];
    const es = (s.entries||[]).filter(e=>e.sets.length);
    if(!es.length) return;
    lines.push(fmtDate(d));
    es.forEach(e=>{
      const ex = EXMAP[e.ex];
      lines.push("  " + (ex?ex.name:e.ex) + "  " + e.sets.map(st=>setText(st, ex?ex.kind:"b") + (st.rpe?`(${st.rpe})`:"")).join(" / "));
    });
    if(s.note) lines.push("  メモ: " + s.note);
    lines.push("");
  });
  const txt = lines.join("\n") || "記録がありません";
  sheetInner.innerHTML = `<h4>コピーして共有</h4>
    <p class="lastline" style="margin-top:0">括弧内はきつさの自己評価です。</p>
    <textarea style="min-height:280px" readonly>${txt.replace(/</g,"&lt;")}</textarea>
    <div class="rowbtns"><button data-close="1">閉じる</button></div>`;
  const t = sheetInner.querySelector("textarea");
  t.onfocus = ()=> t.select();
  sheetInner.querySelector("[data-close]").onclick = ()=> sheet.classList.remove("on");
  sheet.classList.add("on");
}

/* ---------- テーマ ---------- */
const themeBtn = document.getElementById("themeBtn");
(function(){
  let t = null;
  try{ t = localStorage.getItem("trainlog.theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme", t);
  themeBtn.onclick = ()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : (cur==="light" ? "" : "dark");
    if(next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    try{ next ? localStorage.setItem("trainlog.theme", next) : localStorage.removeItem("trainlog.theme"); }catch(e){}
    figThemeChanged(); render();
  };
})();

render();
initStore();
