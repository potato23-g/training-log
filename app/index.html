<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレーニング記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEFE9;
  --panel:#FFFFFF;
  --panel-2:#F7F7F2;
  --ink:#1A2430;
  --ink-2:#5A6774;
  --ink-3:#626D78;
  --rule:#D6D8D0;
  --muscle:#B23A31;
  --muscle-2:#8A2B24;
  --neutral-fill:#DBDCD4;
  --neutral-stroke:#C4C6BD;
  --done:#2F6B4F;
  --shadow:0 1px 0 rgba(26,36,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13171B;
    --panel:#1A1F25;
    --panel-2:#20262D;
    --ink:#E9E9E2;
    --ink-2:#9BA6B0;
    --ink-3:#8A96A1;
    --rule:#2B333A;
    --muscle:#D3584C;
    --muscle-2:#E8796D;
    --neutral-fill:#2C333A;
    --neutral-stroke:#3A434B;
    --done:#4F9C77;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#13171B;
  --panel:#1A1F25;
  --panel-2:#20262D;
  --ink:#E9E9E2;
  --ink-2:#9BA6B0;
  --ink-3:#8A96A1;
  --rule:#2B333A;
  --muscle:#D3584C;
  --muscle-2:#E8796D;
  --neutral-fill:#2C333A;
  --neutral-stroke:#3A434B;
  --done:#4F9C77;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.num{font-family:"Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--muscle);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.wrap{max-width:620px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}

/* ---- header ---- */
header{padding:22px 0 12px;display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
header .date{margin-left:auto;font-size:13px;color:var(--ink-2)}
.themebtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.flash{background:var(--panel);border-left:3px solid var(--ink-3);padding:8px 10px;margin:8px 0 0;border-radius:0 6px 6px 0}
.themebtn[disabled]{opacity:.55}
header .date{white-space:nowrap}

/* ---- tabs ---- */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:20px;overflow-x:auto}
nav.tabs button{
  background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--muscle)}

/* ---- hero ---- */
.hero{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero .kicker{font-size:12px;color:var(--ink-3);margin:0 0 2px}
.hero h2{margin:0 0 10px;font-size:20px;font-weight:700}
.bigset{display:flex;align-items:baseline;gap:6px}
.bigset .v{font-size:46px;font-weight:700;line-height:1}
.bigset .x{font-size:22px;color:var(--ink-3);font-weight:500}
.bigset .u{font-size:15px;color:var(--ink-2);align-self:flex-end;padding-bottom:5px}
.hero .sub{font-size:13px;color:var(--ink-2);margin-top:6px}

/* ---- exercise cards ---- */
.exrow{background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:10px;overflow:hidden}
.exrow.done{border-color:var(--done)}
.exhead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;background:none;border:none;text-align:left}
.exhead .nm{display:block;font-weight:600;font-size:15px}
.exhead .meta{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.exhead .cnt{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.exrow.done .cnt{color:var(--done);font-weight:600}
.exbody{padding:0 14px 14px;border-top:1px solid var(--rule)}

.setline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.setline:last-of-type{border-bottom:none}
.setline .i{width:22px;color:var(--ink-3);font-size:12px}
.setline .val{font-weight:600}
.setline .rpe{margin-left:auto;font-size:12px;color:var(--ink-2)}
.setline .del{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);min-width:44px;height:36px;font-size:12px;line-height:1}
.setline .rpe+.del{margin-left:8px}

.entry{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--ink-3)}
.stepper{display:flex;align-items:center;border:1px solid var(--rule);border-radius:3px;background:var(--panel-2)}
.stepper button{background:none;border:none;width:44px;height:44px;font-size:19px;color:var(--ink-2)}
.stepper input{
  width:52px;height:44px;border:none;background:none;text-align:center;
  font-family:"Archivo",system-ui,sans-serif;font-size:17px;font-weight:600;color:var(--ink);
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addbtn{background:var(--ink);color:var(--paper);border:none;border-radius:3px;height:48px;padding:0 22px;font-weight:700;font-size:15px}
.addbtn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule);font-weight:600}

.hint{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:2px solid var(--muscle);padding:8px 10px;margin-top:12px;border-radius:0 3px 3px 0}
.lastline{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.card a{color:var(--muscle);font-weight:600;text-underline-offset:2px}
.lastline b{color:var(--ink);font-family:"Archivo",system-ui,sans-serif}

/* ---- rest timer ---- */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);display:none;align-items:center;gap:10px;padding:8px max(14px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));z-index:50}
.timer.on{display:flex}
.timer .t{font-family:"Archivo",system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em}
.timer .lb{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.timer .lb b{font-size:12.5px;font-weight:600;opacity:.75}
.timer .lb small{font-size:12px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button+button{margin-left:0}
.timer button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:3px;min-height:44px;min-width:52px;padding:0 10px;font-size:13px;white-space:nowrap;flex:0 0 auto}

/* ---- body figure ---- */
.figs{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.figwrap{flex:1;max-width:190px;text-align:center}
.figwrap .cap{font-size:11px;color:var(--ink-3);margin-top:2px}
svg.fig{width:100%;height:auto;display:block}
svg.fig .nt{fill:var(--neutral-fill);opacity:.55}
svg.fig .rg{fill:var(--neutral-fill);stroke:var(--neutral-stroke);stroke-width:.8;transition:fill .18s}
svg.fig .rg.sel{stroke:var(--ink);stroke-width:1.6}
svg.fig.clickable .rg{cursor:pointer}

.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend .bar{width:96px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--neutral-fill),var(--muscle))}

.mlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.p{background:var(--muscle);border-color:var(--muscle);color:#fff}
.chip.s{border-color:var(--muscle);color:var(--muscle)}

/* ---- generic blocks ---- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:12px}
h3.sec{font-size:13px;font-weight:700;color:var(--ink-2);margin:26px 0 10px}
.card h4{margin:0 0 8px;font-size:15px;font-weight:700}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:5px;font-size:14px}
.warn{color:var(--muscle)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{font-size:14px;padding-left:15px;position:relative;margin-bottom:5px}
ul.plain li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:1.5px;background:var(--ink-3)}

table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--rule)}
table.hist td{padding:6px;border-bottom:1px solid var(--rule)}
table.hist td.n{font-family:"Archivo",system-ui,sans-serif;font-weight:600;text-align:right;white-space:nowrap}

.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin:8px 0 2px}
.spark i{flex:1;background:var(--muscle);opacity:.8;border-radius:1px 1px 0 0;min-height:2px}

.empty{color:var(--ink-2);font-size:14px;padding:26px 4px;text-align:center}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rowbtns button{background:none;border:1px solid var(--rule);border-radius:3px;min-height:44px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}

select,textarea,input[type=text],input[type=password]{
  font:inherit;font-size:16px;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--rule);border-radius:3px;padding:8px 10px;width:100%;
}
textarea{min-height:64px;resize:vertical}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:var(--paper);width:100%;max-width:620px;max-height:86vh;overflow-y:auto;border-radius:10px 10px 0 0;padding:18px max(16px, env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
.sheet .inner h4{margin:0 0 12px;font-size:16px}
.picklist{display:flex;flex-direction:column;gap:6px}
.picklist button{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;text-align:left;font-size:14px;font-weight:600}
.picklist button span{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}

.status{font-size:11.5px;color:var(--ink-3);text-align:center;padding:14px 0 0}
.overflowx{overflow-x:auto}

/* ---- movement diagrams ---- */
.diapair{display:flex;align-items:center;gap:4px;margin:2px 0 0}
.diacell{flex:1;min-width:0;text-align:center}
.diacell svg,.diasolo svg{width:100%;height:auto;display:block}
.diasolo{max-width:76%;margin:0 auto}
.diahint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:2px 0 0}
.dialab{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.diaarrow{color:var(--ink-3);font-size:19px;line-height:1;flex:0 0 auto;padding:0 2px}
.fg-body{fill:var(--ink)}
.fg-far{fill:var(--ink);opacity:.4}
.fg-ghost{opacity:.14}
.fg-halo{fill:var(--panel);stroke:var(--panel);stroke-width:2.8;stroke-linejoin:round}
.fg-db{fill:var(--muscle)}
.fg-prop{fill:var(--neutral-fill);stroke:var(--neutral-stroke);stroke-width:1.5}
.fg-floor{stroke:var(--neutral-stroke);stroke-width:2;stroke-linecap:round}
.dianote{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.diahold{font-size:12px;color:var(--ink-2);margin:9px 0 0;padding:7px 9px;background:var(--panel-2);border-radius:3px}
.diahold b{color:var(--ink-3);font-size:10.5px;font-weight:700}
.exhead .fix{margin-left:8px;flex:0 0 auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:4px 12px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.exrow.editing .exhead .fix{border-color:var(--ink-2);color:var(--ink)}
.exbody.exedit{display:block;padding-top:4px}
.dbrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.dbrow:first-child{padding-top:0}
.dbrow .dbdel{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:3px;width:38px;height:38px;
  font-size:17px;line-height:1;color:var(--ink-3)}
.side{font-size:10px;color:var(--muscle);border:1px solid var(--muscle);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.adv{font-size:10px;color:var(--ink-2);border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.adv.warn{color:var(--muscle);border-color:var(--muscle)}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--panel-2);
  border-left:2px solid var(--muscle);padding:9px 11px;margin-top:12px;border-radius:0 3px 3px 0}
.target .tl{font-size:11px;color:var(--ink-3)}
.target .tv{font-size:19px;font-weight:700}
.target .tw{font-size:11.5px;color:var(--ink-2);flex-basis:100%}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.setrow:last-of-type{border-bottom:none}
.setrow small{display:block;font-size:11px;color:var(--ink-3)}
.setrow .stt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.tg{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:4px 14px;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tg.on{border-color:var(--muscle);color:var(--muscle)}
.splitcols{display:block}
.exmain{min-width:0}
.exside{margin-top:14px}
.refhead{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}

@media (min-width:900px){
  .wrap{max-width:1120px;padding:0 28px 96px}
  .shell{display:grid;grid-template-columns:168px minmax(0,1fr);gap:36px;align-items:start}
  nav.tabs{flex-direction:column;gap:0;border-bottom:none;border-right:1px solid var(--rule);
           position:sticky;top:20px;margin:0;overflow:visible}
  nav.tabs button{text-align:left;padding:9px 16px 9px 2px;border-bottom:none;
                  border-right:2px solid transparent;margin:0 -1px 0 0;font-size:15px}
  nav.tabs button[aria-selected="true"]{border-right-color:var(--muscle)}
  main.view-today,main.view-hist{max-width:760px}
  .splitcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .splitcols>div{min-width:0}
  .exbody{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:22px;align-items:start}
  .exside{margin-top:0}
  .hero{padding:24px 26px 22px}
  .hero .bigset .v{font-size:56px}
  .diasolo{max-width:52%}
}
@media (min-width:1180px){
  .wrap{max-width:1240px}
  .shell{grid-template-columns:180px minmax(0,1fr)}
}
.figslot{position:relative;background:var(--panel-2);border-radius:4px;overflow:hidden}
.figcanvas{width:100%;height:auto;display:block;touch-action:pan-y;cursor:grab}
.figcanvas:active{cursor:grabbing}
.figstill{width:100%;height:auto;display:block}
.figbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rule);display:none}
.figbar span{display:block;height:100%;width:0;background:var(--muscle)}
.figphase{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--ink-2);
  background:var(--panel);padding:1px 8px;border-radius:999px;opacity:.92}
.diawrong .fg-body,.diawrong .fg-far{fill:var(--muscle)}
.diawrong .fg-halo{fill:var(--panel);stroke:var(--panel)}
/* ---- 種目カード（入力と記録を上に）・きつさのボタン・今日の一言 ---- */
.entry .fld.rpefld{flex-basis:100%}
.rpechips{display:flex;gap:6px;flex-wrap:wrap}
.rpechips button{min-width:48px;height:44px;border:1px solid var(--rule);background:var(--panel-2);border-radius:3px;
  font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--ink-2)}
.rpechips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rpechips .lo{font-family:inherit;font-size:12.5px}
.entry .recrow{display:flex;gap:10px;align-items:center;flex-basis:100%}
.entry .recrow .addbtn{flex:1}
.warmup{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;padding:7px 10px;background:var(--panel-2);border-radius:3px}
.cardtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cardtools button{background:none;border:1px solid var(--rule);border-radius:3px;min-height:40px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.hero.compact{padding:10px 14px}
.hero.compact .kicker{display:inline;margin-right:8px}
.hero.compact h2{display:inline;font-size:15px;margin:0}
.banner{background:var(--panel);border:1px solid var(--muscle);border-radius:4px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.banner b{color:var(--muscle)}
.flash .rowbtns{margin-top:6px}
.skipped{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.skipped button{background:none;border:1px solid var(--rule);border-radius:3px;min-height:36px;padding:4px 10px;margin-left:6px;font-size:12.5px;color:var(--ink-2)}
.ladder{padding:9px 0;border-bottom:1px dashed var(--rule)}
.ladder:last-child{border-bottom:none}
.ladder .lk{font-size:11.5px;color:var(--ink-2);margin:0}
.ladder .ln{margin:2px 0 0;font-size:14px}
.setbtn{font-size:14px;padding:3px 9px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>トレーニング記録</h1>
    <span class="date num" id="todayLabel"></span>
    <button class="themebtn" id="updBtn" title="新しい版が出ていれば取り込みます">更新</button>
    <button class="themebtn" id="themeBtn">表示</button>
    <button class="themebtn setbtn" id="setBtn" title="ダンベル・知らせ方・同期・バックアップ" aria-label="設定">⚙</button>
  </header>

  <div class="shell">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">今日</button>
      <button role="tab" data-tab="ex" aria-selected="false">種目</button>
      <button role="tab" data-tab="body" aria-selected="false">からだ</button>
      <button role="tab" data-tab="hist" aria-selected="false">履歴</button>
      <button role="tab" data-tab="plan" aria-selected="false">提案</button>
    </nav>
    <main id="view" class="view-today"></main>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="timer" id="timer">
  <span class="t num" id="timerT">1:30</span>
  <span class="lb"><b>次のセットまで</b><small id="timerLb"></small></span>
  <button id="timerMinus">−30秒</button>
  <button id="timerPlus">+30秒</button>
  <button id="timerStop">終える</button>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>

<script>
