<!doctype html>
<meta charset="utf-8">
<title>webgl test</title>
<style>body{margin:0;background:#EFEFE9;font:14px sans-serif}#info{position:absolute;left:8px;top:8px}</style>
<div id="info">loading</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
(function(){
  const info = document.getElementById('info');
  try{
    const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
    r.setSize(480, 360);
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(r.domElement);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(30, 480/360, 0.1, 50);
    cam.position.set(2.5, 1.6, 3.2); cam.lookAt(0, 0.4, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.9));
    const dl = new THREE.DirectionalLight(0xffffff, 1.6);
    dl.position.set(2, 4, 3); dl.castShadow = true; dl.shadow.mapSize.set(1024,1024);
    scene.add(dl);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(4,4), new THREE.ShadowMaterial({opacity:0.25}));
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
    const cap = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.6, 8, 24), new THREE.MeshStandardMaterial({color:0xcfc8bd, roughness:0.6}));
    cap.position.set(0, 0.6, 0); cap.rotation.z = 0.5; cap.castShadow = true; scene.add(cap);
    r.render(scene, cam);
    const gl = r.getContext();
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    info.textContent = 'three r' + THREE.REVISION + ' webgl2=' + r.capabilities.isWebGL2 + ' ' + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '');
  }catch(e){
    info.textContent = 'ERROR ' + e.message;
  }
  window.__ready = true;
})();
</script>
